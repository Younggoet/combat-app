<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combat — League Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E0F11">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<style>
  :root{
    --bg:#0E0F11;
    --panel:#17181B;
    --panel-2:#1E2024;
    --border:#2A2C31;
    --text:#EDEDED;
    --text-dim:#8A8A8A;
    --text-faint:#4E4F53;
    --gold:#D4AF37;
    --red:#E2283C;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
    height:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 0;height:100vh;display:flex;flex-direction:column;box-sizing:border-box;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex:0 0 auto;}
  .brand{font-size:15px;font-weight:600;letter-spacing:0.02em;}
  .brand span{color:var(--gold);}
  .live-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#4CAF7D;box-shadow:0 0 0 3px rgba(76,175,125,0.15);}

  .namebar{
    display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;margin-bottom:14px;flex:0 0 auto;font-size:13px;color:var(--text-dim);
  }
  .namebar input{
    background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);
    font-size:13px;padding:6px 10px;width:160px;
  }
  .namebar input:focus{outline:none;border-color:var(--gold);}

  .messages{
    flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:16px;
  }
  .empty{text-align:center;color:var(--text-dim);padding:60px 0;font-size:14px;}
  .msg{max-width:78%;}
  .msg.mine{align-self:flex-end;}
  .msg .meta{display:flex;gap:8px;align-items:baseline;margin-bottom:3px;}
  .msg.mine .meta{justify-content:flex-end;}
  .msg .name{font-size:11.5px;font-weight:600;color:var(--gold);}
  .msg.mine .name{color:#9FD6B8;}
  .msg .time{font-size:10.5px;color:var(--text-faint);}
  .msg .bubble{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 13px;
    font-size:14px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;
  }
  .msg.mine .bubble{background:rgba(212,175,55,0.1);border-color:rgba(212,175,55,0.35);}

  .composer{
    flex:0 0 auto;display:flex;gap:10px;padding:14px 0 20px;border-top:1px solid var(--border);
  }
  .composer textarea{
    flex:1;resize:none;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-size:14px;padding:11px 14px;font-family:inherit;max-height:120px;
  }
  .composer textarea:focus{outline:none;border-color:var(--gold);}
  .composer button{
    background:var(--gold);color:#0E0F11;border:none;border-radius:10px;padding:0 20px;
    font-size:13px;font-weight:600;cursor:pointer;
  }
  .composer button:disabled{opacity:0.5;cursor:not-allowed;}
  .error{
    background:rgba(226,40,60,0.1);border:1px solid rgba(226,40,60,0.3);color:#F0897D;
    font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:12px;flex:0 0 auto;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">COMBAT <span>LEAGUE CHAT</span></div>
    <div style="display:flex;align-items:center;gap:16px;">
      <a href="index.html" style="font-size:12px;color:var(--text-dim);text-decoration:none;">Mock Draft</a>
      <a href="news.html" style="font-size:12px;color:var(--text-dim);text-decoration:none;">News</a>
      <a href="settings.html" style="font-size:12px;color:var(--text-dim);text-decoration:none;">League Settings</a>
      <a href="notifications.html" style="font-size:12px;color:var(--text-dim);text-decoration:none;">Notifications</a>
      <a href="draft.html" style="font-size:12px;color:var(--text-dim);text-decoration:none;">Draft</a>
      <a href="live.html" style="font-size:12px;color:var(--text-dim);text-decoration:none;">Live</a>
      <a href="team.html" style="font-size:12px;color:var(--text-dim);text-decoration:none;">My Team</a>
      <span id="authStatus"></span>
      <div class="live-pill"><span class="live-dot"></span> LIVE</div>
    </div>
  </div>

  <div class="namebar" id="nameBar">Loading…</div>

  <div id="errorBox"></div>

  <div class="messages" id="messages"><div class="empty">Loading league chat…</div></div>

  <div class="composer">
    <textarea id="bodyInput" rows="1" placeholder="Message the league…" maxlength="2000"></textarea>
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://cguenfdcrqbduluscsel.supabase.co";
const SUPABASE_KEY = "sb_publishable_51D_xE2j1vYOWl_0nNc4XQ_r7iAYn8x";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Single league for now — Combat doesn't have multi-league support yet.
const LEAGUE_ID = "a18edea0-2355-45c7-a175-f880597aa86e";
const FN_BASE = "https://combat-sync.netlify.app/.netlify/functions";

const nameBar = document.getElementById("nameBar");
const bodyInput = document.getElementById("bodyInput");
const sendBtn = document.getElementById("sendBtn");
const messagesEl = document.getElementById("messages");
const errorBox = document.getElementById("errorBox");

// Chat identity now comes from the signed-in user's real account — no more
// free-text name typed into localStorage.
let currentUser = null;
let currentDisplayName = "";

function getDisplayName(){ return currentDisplayName; }

async function initIdentity(){
  currentUser = await CombatAuth.getUser();
  if (!currentUser) {
    nameBar.innerHTML = `Sign in to chat — <a href="login.html" style="color:#D4AF37;text-decoration:none;">sign in →</a>`;
    bodyInput.disabled = true;
    sendBtn.disabled = true;
    bodyInput.placeholder = "Sign in to send a message…";
    return;
  }
  const profile = await CombatAuth.getProfile(currentUser.id);
  currentDisplayName = (profile && profile.display_name) || currentUser.email;
  nameBar.textContent = `Chatting as ${currentDisplayName}`;
  bodyInput.disabled = false;
  sendBtn.disabled = false;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function timeLabel(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d)) return "";
  return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

let renderedIds = new Set();

function appendMessage(msg){
  if (renderedIds.has(msg.id)) return;
  renderedIds.add(msg.id);

  const empty = messagesEl.querySelector(".empty");
  if (empty) empty.remove();

  const mine = msg.display_name.trim().toLowerCase() === getDisplayName().toLowerCase() && getDisplayName() !== "";

  const row = document.createElement("div");
  row.className = "msg" + (mine ? " mine" : "");
  row.innerHTML = `
    <div class="meta">
      <span class="name">${escapeHtml(msg.display_name)}</span>
      <span class="time">${timeLabel(msg.created_at)}</span>
    </div>
    <div class="bubble">${escapeHtml(msg.body)}</div>
  `;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadHistory(){
  const { data, error } = await sb
    .from("chat_messages")
    .select("id, display_name, body, created_at")
    .eq("league_id", LEAGUE_ID)
    .order("created_at", { ascending: true })
    .limit(200);

  if (error){
    messagesEl.innerHTML = `<div class="empty">Couldn't load chat history.</div>`;
    return;
  }

  messagesEl.innerHTML = "";
  if (!data || data.length === 0){
    messagesEl.innerHTML = `<div class="empty">No messages yet — say hello.</div>`;
    return;
  }
  data.forEach(appendMessage);
}

function showError(text){
  errorBox.innerHTML = `<div class="error">${escapeHtml(text)}</div>`;
  setTimeout(() => { errorBox.innerHTML = ""; }, 4000);
}

async function sendMessage(){
  if (!currentUser){
    showError("Sign in to send a message.");
    return;
  }
  const body = bodyInput.value.trim();
  if (!body) return;

  sendBtn.disabled = true;
  // Routed through a server function (instead of inserting with the anon
  // key directly) so identity can be verified server-side and a new
  // message can also trigger a push notification to subscribed devices.
  // Realtime still delivers it live to every open tab, including this
  // one, the instant it's inserted.
  let ok = true;
  try {
    const session = await CombatAuth.getSession();
    const res = await fetch(`${FN_BASE}/send-chat-message`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${session ? session.access_token : ""}`,
      },
      body: JSON.stringify({ league_id: LEAGUE_ID, body: body }),
    });
    ok = res.ok;
  } catch (err) {
    ok = false;
  }
  sendBtn.disabled = false;

  if (!ok){
    showError("Message didn't send — try again.");
    return;
  }
  bodyInput.value = "";
  bodyInput.style.height = "auto";
}

sendBtn.addEventListener("click", sendMessage);
bodyInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
bodyInput.addEventListener("input", () => {
  bodyInput.style.height = "auto";
  bodyInput.style.height = Math.min(bodyInput.scrollHeight, 120) + "px";
});

// Realtime: every insert (from anyone, any tab) streams straight in —
// no polling, no refresh.
sb.channel("chat-messages")
  .on("postgres_changes", { event: "INSERT", schema: "public", table: "chat_messages" }, (payload) => {
    if (payload.new.league_id === LEAGUE_ID) appendMessage(payload.new);
  })
  .subscribe();

initIdentity().then(loadHistory);
</script>
</body>
</html>
