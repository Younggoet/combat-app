<html lang="en"><head><meta charset="utf-8">

<style>html,body{margin:0;background:#0A1124}#app{min-height:100vh}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
</head><body><div id="app"></div>
<script src="dc-runtime.js"></script>
<script>
(async function(){
  var desk=window.matchMedia('(min-width:900px)').matches;
  var ISO={'United States':'us','Australia':'au','Mexico':'mx','Cuba':'cu','Italy':'it','North Macedonia':'mk','Puerto Rico':'pr','United Kingdom':'gb','Turkey':'tr'};
  var DASH='—';

    var sb=window.CombatAuth&&window.CombatAuth.client;

    var BO=[],EV={};try{var br=await sb.from('bkfc_bouts').select('*'),er=await sb.from('bkfc_events').select('*');BO=br.data||[];(er.data||[]).forEach(function(e){EV[e.id]=e})}catch(e2){}
    var logs={};(lr.data||[]).forEach(function(l){(logs[l.fighter_id]=logs[l.fighter_id]||[]).push(l)});

      var fpT=0;ls.forEach(function(l){var win=l.result==='win',m=l.method||'';fpT+=0.2*l.landed+8*(l.knockdowns||0)+(win?5:0)+(win&&(m==='ko'||m==='tko')?15:0)+(win&&m.indexOf('decision')===0?3:0)+(l.thrown>=30&&l.landed/l.thrown>=0.6?3:0)});

        {l:'KO / TKO / stoppage',a:pc(B.ko)+' of fights',r:'+15',p:pt(B.ko*15/n)},

        kop:(f.wins>0&&f.ko_wins!=null)?Math.round(f.ko_wins/f.wins*100)+'%':DASH,fin:f.ko_wins!=null?String(f.ko_wins):DASH,fpy:fpy!=null?fpy.toFixed(1):DASH,proj:fpf!=null?fpf.toFixed(1):DASH,
        photo:f.headshot_url,credit:f.headshot_credit,tag:f.career_tag,note:f.career_note,src:f.career_source,

        rank:(f.rankings||[]).filter(function(r){return r.rank>0}).map(function(r){return '#'+r.rank+' '+r.division}).join(' · ')||DASH,

    });
    pool.sort(function(x,y){return (y.projN==null?-1:y.projN)-(x.projN==null?-1:x.projN)||(y.wins||0)-(x.wins||0)});

    pool.forEach(function(p){var best=null;BO.forEach(function(b){if(b.red_id!==p.id&&b.blue_id!==p.id)return;var ev=EV[b.event_id];if(!ev||ev.event_date<today||b.status==='completed')return;if(!best||ev.event_date<best.ev.event_date)best={b:b,ev:ev}});
      if(best){var oid=best.b.red_id===p.id?best.b.blue_id:best.b.red_id;p.opp=ID[oid]||null;p.evName=best.ev.name;p.evDate=best.ev.event_date}});

  }catch(e){}

  var FLAG=function(iso){return iso?'https://flagcdn.com/w1280/'+iso+'.png':null};
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  setInterval(function(){

        rows:[{a:p.rec,l:'RECORD',b:o?o.rec:DASH},{a:p.fin,l:'FINISHES',b:o?o.fin:DASH},{a:rkOf(p),l:'BLOCK RANK',b:o?rkOf(o):DASH},{a:p.proj,l:'PROJ FANTASY PTS',b:o?o.proj:DASH}]}};
  };
  window.__BRDV=function(inst){

      '</div></div>'+
