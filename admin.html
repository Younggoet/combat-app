<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Combat Panel</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<style>
:root{--bg:#0B0B0D;--surf:#131317;--fg:#F2EFE6;--mut:#B8B5AE;--dim:#8C8982;--gold:#D4AF37;--gold2:#E8C93A;--red:#E2283C;--redl:#FF6A78;--green:#4CD08A;--teal:#3FD8C5;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:14px}
body{min-height:100vh;background:radial-gradient(900px 600px at 20% -5%,rgba(200,200,205,.20),rgba(120,120,125,0) 70%),linear-gradient(180deg,#4A4A50 0,#222226 420px,#0B0B0D 900px),var(--bg);background-attachment:fixed}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.h{font-family:Oswald,sans-serif;letter-spacing:1px}
.gold{color:var(--gold2)}.dim{color:var(--dim)}.mut{color:var(--mut)}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.top .t{font-size:34px;color:var(--gold2);font-family:Oswald;letter-spacing:2px}
.top .s{letter-spacing:2px;color:var(--gold2);font-size:12px}
.oc{clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.tab{font-family:Oswald;letter-spacing:1.5px;font-size:14px;color:var(--gold2);background:#3a3628;border:0;padding:10px 18px;cursor:pointer;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.tab.on{background:linear-gradient(135deg,#F2D675,#D4AF37 60%,#9C7A1E);color:#14120A}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--gold);padding:1.5px;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
.card>.i{background:linear-gradient(155deg,rgba(212,175,55,.12),rgba(0,0,0,0) 60%),#131317;padding:14px 16px;height:100%;clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 13px,100% calc(100% - 13px),calc(100% - 13px) 100%,13px 100%,0 calc(100% - 13px),0 13px)}
.card.red{background:var(--red)}.card.grn{background:var(--green)}.card.dm{background:#6E6A5E}
.lab{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.big{font-family:Oswald;font-size:38px;line-height:1.05;margin-top:4px}
.sec{display:flex;align-items:center;gap:14px;margin:26px 0 12px}
.sec:before,.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#D4AF3766)}.sec:after{background:linear-gradient(270deg,transparent,#D4AF3766)}
.sec span{font-family:Oswald;letter-spacing:3px;color:var(--gold2);font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:1.5px;color:var(--dim);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid #26262C;white-space:nowrap}
td{padding:7px 8px;border-top:1px solid #1f1f25;vertical-align:top}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-family:Oswald;letter-spacing:1px;font-size:11px;padding:2px 8px;background:#26262C;color:var(--mut);clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px)}
.pill.g{background:rgba(76,208,138,.18);color:var(--green)}.pill.r{background:rgba(226,40,60,.2);color:var(--redl)}.pill.y{background:rgba(232,201,58,.18);color:var(--gold2)}
.bar{height:10px;background:#26262C;position:relative}.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;align-items:center;gap:10px}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
a.btn,button.btn{display:inline-block;font-family:Oswald;letter-spacing:1.5px;font-size:13px;padding:10px 16px;border:0;cursor:pointer;text-decoration:none;color:#14120A;background:linear-gradient(135deg,#F2D675,#D4AF37 60%,#9C7A1E);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
a.btn.o,button.btn.o{background:#26262C;color:var(--fg)}
input{background:#0F0F12;border:1px solid #3a3628;color:var(--fg);padding:9px 12px;font-size:14px;border-radius:8px}
.note{color:var(--dim);font-size:12px;margin-top:6px;line-height:1.5}
.msg{max-width:520px;margin:12vh auto;text-align:center}
@media(max-width:600px){.top .t{font-size:28px}.big{font-size:30px}}
</style></head><body>
<div class="wrap" id="app"><div class="msg dim">Loading…</div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=CombatAuth.client,FN='https://combat-sync.netlify.app/.netlify/functions/';
let D=null,tab=(location.hash||'#overview').slice(1),err='',busy=false;
const TABS=[['overview','OVERVIEW'],['scoring','SCORING'],['leagues','LEAGUES'],['usage','USAGE'],['data','DATA'],['tools','TOOLS']];
const n=v=>v==null?'—':Number(v).toLocaleString();
const ago=s=>s==null?'never':s<90?s+'s ago':s<5400?Math.round(s/60)+' min ago':s<172800?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago';
const stat=(l,v,sub,cls)=>`<div class="card ${cls||''}"><div class="i"><div class="lab">${l}</div><div class="big">${v}</div>${sub?`<div class="dim" style="font-size:12px;margin-top:4px">${sub}</div>`:''}</div></div>`;
const sec=t=>`<div class="sec"><span>${t}</span></div>`;
const box=(inner,cls)=>`<div class="card ${cls||''}"><div class="i">${inner}</div></div>`;
const kv=o=>Object.keys(o||{}).length?Object.entries(o).map(([k,v])=>`<span class="pill y" style="margin:2px 6px 2px 0">${esc(k)} ${v}</span>`).join(''):'<span class="dim">none</span>';
const etToday=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
async function load(){if(busy)return;busy=true;try{const {data,error}=await sb.rpc('admin_overview');if(error)throw error;D=data;err=''}catch(e){err=e.message||String(e)}busy=false;draw()}
function health(){const s=D.scoring,bad=[];const today=etToday();const t=s.bouts.filter(b=>b.date===today);
  if(t.some(b=>!b.cito))bad.push(t.filter(b=>!b.cito).length+' of today’s bouts are not linked to live scoring');
  if(s.live_stale.length)bad.push(s.live_stale.length+' live fight(s) have not updated in over 5 minutes');
  if(D.drafts.stuck.length)bad.push(D.drafts.stuck.length+' draft(s) look stuck');
  if(D.usage.error_count_24h>0)bad.push(D.usage.error_count_24h+' app error(s) in the last 24 hours');
  if(s.odd_matchups.length)bad.push(s.odd_matchups.length+' final matchup(s) ended 0.0 to 0.0');
  return bad}
function pOverview(){const u=D.users,l=D.leagues,a=D.activity,us=D.usage,f=D.funnel,h=health();
  const mx=Math.max(1,...u.signups_by_day.map(x=>x.n));
  return `<div class="two"><div>${box(h.length?`<div class="lab" style="color:var(--redl)">Needs attention</div>${h.map(x=>`<div style="margin-top:8px">• ${esc(x)}</div>`).join('')}`:`<div class="lab" style="color:var(--green)">All clear</div><div style="margin-top:8px">No problems found in scoring, drafts or errors.</div>`,h.length?'red':'grn')}</div><div>${box(`<div class="lab">Signups, last 14 days</div><div class="row" style="align-items:flex-end;gap:4px;height:70px;margin-top:10px">${u.signups_by_day.map(x=>`<div title="${x.d}: ${x.n}" style="flex:1;background:${x.n?'var(--gold)':'#26262C'};height:${Math.max(4,x.n/mx*70)}px"></div>`).join('')}</div>`)}</div></div>
  ${sec('PEOPLE')}<div class="grid">${stat('Accounts',n(u.total),n(u.new_7d)+' new this week')}${stat('Signed in, 24h',n(u.signed_in_24h))}${stat('Active users, 24h',n(us.users_24h),'from app tracking')}${stat('Sessions, 24h',n(us.sessions_24h))}${stat('Returning users',n(us.returning_users),'came back on 2+ days, last 14 days')}${stat('Avg minutes / session',us.avg_minutes_per_session_7d==null?'—':us.avg_minutes_per_session_7d,'last 7 days, while the app is open')}</div>
  ${sec('LEAGUES AND ACTIVITY')}<div class="grid">${stat('Leagues',n(l.total),n(l.real)+' real, '+(l.total-l.real)+' test')}${stat('Drafts finished',n(D.drafts.by_status.complete||0),n(D.drafts.by_status.live||0)+' live')}${stat('Auto-picks',D.drafts.autopick_share==null?'—':D.drafts.autopick_share+'%','of all draft picks')}${stat('Trades, 7 days',n(Object.values(a.trades_7d).reduce((x,y)=>x+y,0)),n(a.trades_all)+' all time')}${stat('Chat, 24h',n(a.chat_24h),n(a.chat_7d)+' this week')}${stat('Teams customized',n(a.renamed_teams),'color or photo set')}</div>
  ${sec('FUNNEL')}${box(`<div class="scroll">${[['Created an account',f.accounts],['Created a league',f.created_league],['Joined a team',f.joined_team],['Finished a draft',f.finished_draft]].map(([lab,v])=>`<div class="row" style="margin:7px 0"><div style="width:190px">${lab}</div><div class="bar" style="flex:1"><i style="width:${f.accounts?v/f.accounts*100:0}%"></i></div><div class="h" style="width:44px;text-align:right">${v}</div></div>`).join('')}</div>`)}`}
function pScoring(){const s=D.scoring,today=etToday();
  const rows=s.bouts.map(b=>{const st=b.status,pill=st==='live'?'r':st==='completed'?'g':'y';const linked=b.cito?`<span class="pill g">linked ${esc(b.cito)}</span>`:'<span class="pill r">NOT LINKED</span>';
   return `<tr><td>${esc(b.date)}</td><td class="dim">${b.order||''}</td><td>${esc(b.a)} <span class="dim">vs</span> ${esc(b.b)}</td><td><span class="pill ${pill}">${esc(st)}</span></td><td>${linked}</td><td>${b.stats}/${b.perfs}</td><td class="h gold">${b.pts_a==null?'—':b.pts_a} <span class="dim">/</span> ${b.pts_b==null?'—':b.pts_b}</td><td>${esc(b.method||'')}</td><td class="dim">${b.last_sync_s==null?'—':ago(b.last_sync_s)}</td></tr>`}).join('');
  return `<div class="grid">${stat('Bouts yesterday to tomorrow',s.bouts.length)}${stat('Not linked (next 7 days)',s.unlinked_upcoming,'scheduled bouts with no live-scoring link',s.unlinked_upcoming?'red':'grn')}${stat('Live but stale',s.live_stale.length,'no update for 5+ minutes',s.live_stale.length?'red':'grn')}${stat('0.0 to 0.0 finals',s.odd_matchups.length,'matchups that look wrong',s.odd_matchups.length?'red':'grn')}</div>
  ${sec('BOUTS')}${box(`<div class="scroll"><table><tr><th>DATE</th><th>#</th><th>BOUT</th><th>STATUS</th><th>LIVE SCORING</th><th>STATS ROWS</th><th>POINTS A / B</th><th>METHOD</th><th>LAST UPDATE</th></tr>${rows||'<tr><td colspan="9" class="dim">No bouts in this window.</td></tr>'}</table></div><div class="note">Stats rows shows how many fighters have live stats recorded out of the fighters in the bout. Today (Eastern) is ${today}.</div>`)}
  ${s.live_stale.length?sec('STALE LIVE FIGHTS')+box(s.live_stale.map(x=>`<div>${esc(x.a)} vs ${esc(x.b)} <span class="pill r">${ago(x.age_s)}</span></div>`).join(''),'red'):''}
  ${s.odd_matchups.length?sec('MATCHUPS TO CHECK')+box(s.odd_matchups.map(x=>`<div>${esc(x.league)} block ${x.block}: ${x.a} to ${x.b}</div>`).join(''),'red'):''}`}
function pLeagues(){const L=D.leagues;
  return `<div class="grid">${stat('Total',n(L.total))}${stat('Real',n(L.real))}</div>${sec('BY STATUS')}${box(kv(L.by_status))}${sec('BY FORMAT')}${box(kv(L.by_format))}
  ${sec('ALL LEAGUES')}${box(`<div class="scroll"><table><tr><th>NAME</th><th>STATUS</th><th>FORMAT</th><th>PLAYERS</th><th>CPU</th><th>COMMISSIONER</th><th>FINISH BONUS</th><th>CHAT 7D</th><th>CREATED</th></tr>${L.list.map(l=>`<tr><td>${esc(l.name)} ${l.is_test?'<span class="pill">test</span>':''}</td><td><span class="pill ${l.status==='active'?'g':'y'}">${esc(l.status)}</span></td><td>${esc(l.format||'')}</td><td>${l.teams}/${l.team_count}</td><td>${l.cpu}</td><td>${esc(l.commissioner||'')}</td><td>${l.finish_bonus?'<span class="pill g">on</span>':'<span class="pill">off</span>'}</td><td>${l.msgs_7d}</td><td class="dim">${esc(String(l.created).slice(0,10))}</td></tr>`).join('')}</table></div>`)}
  ${sec('DRAFTS')}${box(kv(D.drafts.by_status)+`<div class="note">${D.drafts.autopick_share==null?'':D.drafts.autopick_share+'% of all picks were auto-picks.'}</div>`)}
  ${D.drafts.stuck.length?sec('STUCK DRAFTS')+box(D.drafts.stuck.map(x=>`<div>${esc(x.league)}: pick ${x.pick}, deadline passed ${ago(x.overdue_s)}</div>`).join(''),'red'):''}
  ${sec('TRADES AND WAIVERS, LAST 7 DAYS')}<div class="two">${box('<div class="lab">Trades</div>'+kv(D.activity.trades_7d))}${box('<div class="lab">Waiver claims</div>'+kv(D.activity.claims_7d))}</div>`}
function pUsage(){const u=D.usage,tot=Math.max(1,...u.views_7d.map(x=>x.n)),ta=Math.max(1,...u.actions_7d.map(x=>x.n));
  const bars=(arr,k,mx)=>arr.map(x=>`<div class="row" style="margin:5px 0"><div style="width:190px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x[k]||'(unknown)')}</div><div class="bar" style="flex:1"><i style="width:${x.n/mx*100}%"></i></div><div style="width:40px;text-align:right" class="h">${x.n}</div></div>`).join('')||'<span class="dim">No data yet. It fills in as people use the app.</span>';
  const p=u.press_room;
  return `<div class="grid">${stat('Events, 24h',n(u.events_24h))}${stat('Active users, 7d',n(u.users_7d))}${stat('Errors, 24h',n(u.error_count_24h),'',u.error_count_24h?'red':'grn')}${stat('Press room opens',n(p.opened),'last 7 days')}${stat('Mic taps',n(p.mic))}${stat('Chat sends',n(p.chat))}${stat('Interrupts',n(p.interrupts))}</div>
  ${sec('SCREENS VIEWED, 7 DAYS')}${box(bars(u.views_7d,'screen',tot))}${sec('MOST TAPPED, 7 DAYS')}${box(bars(u.actions_7d,'action',ta))}
  ${sec('DEVICES (SESSIONS, 7 DAYS)')}${box(kv(u.devices_7d))}
  ${sec('RECENT ERRORS')}${box(u.errors_24h.length?`<div class="scroll"><table><tr><th>WHEN</th><th>SCREEN</th><th>MESSAGE</th></tr>${u.errors_24h.map(e=>`<tr><td class="dim">${esc(String(e.at).slice(11,19))}</td><td>${esc(e.screen||'')}</td><td>${esc(e.msg||'')}</td></tr>`).join('')}</table></div>`:'<span class="dim">No errors in the last 24 hours.</span>',u.errors_24h.length?'red':'')}`}
function pData(){const q=D.data_quality,pc=v=>q.fighters?Math.round(v/q.fighters*100)+'%':'—';
  return `<div class="grid">${stat('Fighters',n(q.fighters))}${stat('No photo',n(q.no_photo),pc(q.no_photo)+' of fighters')}${stat('No age',n(q.no_age),pc(q.no_age))}${stat('No height',n(q.no_height),pc(q.no_height))}${stat('No reach',n(q.no_reach),pc(q.no_reach))}${stat('No stance',n(q.no_stance),pc(q.no_stance))}${stat('No country',n(q.no_country),pc(q.no_country))}${stat('Duplicate fights',n(q.dup_bouts),'extra copies in the database',q.dup_bouts?'red':'grn')}</div>
  ${sec('UPCOMING FIGHTERS WITH MISSING INFO (NEXT 30 DAYS)')}${box(q.upcoming_missing.length?`<div class="scroll"><table><tr><th>FIGHTER</th><th>PHOTO</th><th>AGE</th><th>HEIGHT</th><th>REACH</th><th>COUNTRY</th></tr>${q.upcoming_missing.map(f=>`<tr><td>${esc(f.name)}</td>${['photo','age','height','reach','country'].map(k=>`<td>${f[k]?'<span class="pill r">missing</span>':'<span class="dim">ok</span>'}</td>`).join('')}</tr>`).join('')}</table></div>`:'<span class="gold">Every fighter on an upcoming card has full info.</span>')}`}
function pTools(){const d=etToday();
  return `<div class="note" style="margin-bottom:12px">These open in a new tab and show a result you can read. Run the dry run first when there is one.</div><div class="two">
  ${box(`<div class="lab">Link a card to live scoring</div><div class="row" style="margin:10px 0"><input id="ld" value="${d}" style="width:140px"></div><a class="btn o" id="l1" target="_blank">DRY RUN</a> <a class="btn" id="l2" target="_blank">LINK IT</a><div class="note">Connects each bout on that date to Cito so points update live.</div>`)}
  ${box(`<div class="lab">Fill in fighter info and photos</div><div style="margin:10px 0"><a class="btn o" target="_blank" href="${FN}enrich-upcoming?dryRun=true">DRY RUN</a> <a class="btn" target="_blank" href="${FN}enrich-upcoming">RUN</a></div><div class="note">Age, height, reach, stance, record and photo for fighters on upcoming cards.</div>`)}
  ${box(`<div class="lab">Live scoring right now</div><div style="margin:10px 0"><a class="btn" target="_blank" href="${FN}live-poll">RUN LIVE POLL NOW</a></div><div class="note">Normally runs by itself every minute. Use this if a fight looks stuck.</div>`)}
  ${box(`<div class="lab">Fix winners</div><div style="margin:10px 0"><a class="btn o" target="_blank" href="${FN}repair-winners">RUN</a></div><div class="note">Re-checks winners on finished fights.</div>`)}
  </div>`}
function draw(){const app=$('#app');
  if(err){app.innerHTML=`<div class="msg"><div class="h gold" style="font-size:28px">COMBAT PANEL</div><p class="mut">${/Not allowed/i.test(err)?'This page is only for the Combat owner.':'Could not load the panel: '+esc(err)}</p><p><a class="btn" href="login.html">SIGN IN</a></p></div>`;return}
  if(!D){app.innerHTML='<div class="msg dim">Loading…</div>';return}
  const body={overview:pOverview,scoring:pScoring,leagues:pLeagues,usage:pUsage,data:pData,tools:pTools}[tab]||pOverview;
  app.innerHTML=`<div class="top"><span class="t">COMBAT</span><span class="s">OWNER PANEL</span><span style="flex:1"></span><span class="dim" style="font-size:12px">Updated ${new Date(D.generated_at).toLocaleTimeString()} · refreshes every 30 s</span><button class="btn o" id="rf">REFRESH</button></div><div class="tabs">${TABS.map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>${body()}`;
  const l1=$('#l1'),l2=$('#l2'),ld=$('#ld');if(ld){const set=()=>{l1.href=FN+'link-card-bouts?date='+encodeURIComponent(ld.value)+'&dryRun=true';l2.href=FN+'link-card-bouts?date='+encodeURIComponent(ld.value)};set();ld.addEventListener('input',set)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;location.hash=tab;draw();return}if(e.target.closest('#rf'))load()});
(async()=>{const u=await CombatAuth.getUser();if(!u){err='Not signed in';draw();return}load();setInterval(()=>{if(!document.hidden&&tab!=='tools')load()},30000)})();
</script></body></html>
