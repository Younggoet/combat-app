<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Combat Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A1124">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<style>
:root{--bg:#0A1124;--card:#141A2E;--line:#2A3350;--fg:#F5F2EA;--mut:#D2D0C8;--dim:#A3A8B8;--gold:#E8C93A;--red:#FF6A78;--green:#4CD08A;--redbg:rgba(226,40,60,.14);--grnbg:rgba(76,208,138,.12);--ylbg:rgba(232,201,58,.12);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{font-family:Oswald,sans-serif;margin:0;font-weight:700;letter-spacing:.5px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:30px;color:var(--gold)}
.top .upd{flex:1;color:var(--dim);font-size:14px;min-width:160px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.tab{flex:none;font:600 15px Inter,sans-serif;color:var(--mut);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tab .dot{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:20px;text-align:center}
.intro{color:var(--mut);margin:0 0 20px;max-width:70ch}
h2.sec{font-size:20px;margin:30px 0 4px;color:var(--fg)}
.secnote{color:var(--dim);font-size:14px;margin:0 0 12px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card.red{border-color:var(--red);background:var(--redbg)}.card.grn{border-color:var(--green);background:var(--grnbg)}.card.yel{border-color:var(--gold);background:var(--ylbg)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat .l{font-weight:600;color:var(--mut);font-size:15px}
.stat .v{font-family:Oswald;font-size:38px;line-height:1.1;margin:4px 0}
.stat .s{color:var(--dim);font-size:14px}
.banner{display:flex;gap:14px;align-items:flex-start}
.banner .ic{font-size:28px;line-height:1}
.banner h2{font-size:22px}
.issue{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.1)}
.issue:first-of-type{border-top:0}
.pill{display:inline-block;font:600 13px Inter,sans-serif;padding:3px 10px;border-radius:999px;background:#262D47;color:var(--mut);white-space:nowrap}
.pill.g{background:rgba(76,208,138,.2);color:var(--green)}.pill.r{background:rgba(226,40,60,.25);color:var(--red)}.pill.y{background:rgba(232,201,58,.2);color:var(--gold)}
.btn{display:inline-block;font:600 15px Inter,sans-serif;padding:10px 18px;border:0;border-radius:8px;cursor:pointer;text-decoration:none;color:#14120A;background:var(--gold)}
.btn:hover{filter:brightness(1.08)}
.btn.o{background:#262D47;color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:14px}
input,select{background:#0D1328;border:1px solid var(--line);color:var(--fg);padding:10px 12px;font:16px Inter,sans-serif;border-radius:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:12px;background:#262D47;border-radius:6px;overflow:hidden;flex:1;min-width:80px}.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.list>div{padding:12px 0;border-top:1px solid var(--line)}.list>div:first-child{border-top:0}
.bout{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.bout .nm{font-weight:600;font-size:17px}.bout .vs{color:var(--dim);font-weight:400}
.bout .meta{grid-column:1/-1;color:var(--dim);font-size:14px;display:flex;gap:8px 16px;flex-wrap:wrap}
.date{font-family:Oswald;color:var(--gold);font-size:17px;letter-spacing:.5px;margin:22px 0 6px}
.kvrow{display:flex;gap:6px;flex-wrap:wrap}
.note{color:var(--dim);font-size:14px;margin-top:8px}
.tool h3{font-size:18px;margin-bottom:6px}
.tool .what{color:var(--mut);margin:0 0 6px}.tool .when{color:var(--dim);font-size:14px;margin:0 0 12px}
.msg{max-width:520px;margin:12vh auto;text-align:center}
.lg{display:grid;gap:4px 14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:10px;font-size:14px;color:var(--dim)}
.lg b{display:block;color:var(--fg);font-size:15px;font-weight:600}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;color:var(--dim);font-weight:600;font-size:14px;padding:8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style></head><body>
<div class="wrap" id="app"><div class="msg" style="color:var(--dim)">Loading…</div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=CombatAuth.client,FN='https://combat-sync.netlify.app/.netlify/functions/';
let R=[],D=null,tab=(location.hash||'#home').slice(1),err='',busy=false;
const TABS=[['home','Home'],['fights','Fights'],['leagues','Leagues'],['users','Users & Usage'],['reports','Reports'],['data','Fighter Data'],['tools','Fix-It Tools']];
const n=v=>v==null?'—':Number(v).toLocaleString();
const ago=s=>s==null?'never':s<90?s+' sec ago':s<5400?Math.round(s/60)+' min ago':s<172800?Math.round(s/3600)+' hours ago':Math.round(s/86400)+' days ago';
const etToday=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
const niceDate=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}catch(_){return d}};
const shortDate=d=>{try{return new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch(_){return d}};
const stat=(l,v,sub,cls)=>`<div class="card stat ${cls||''}"><div class="l">${l}</div><div class="v">${v}</div>${sub?`<div class="s">${sub}</div>`:''}</div>`;
const sec=(t,note)=>`<h2 class="sec">${t}</h2>${note?`<p class="secnote">${note}</p>`:'<div style="height:8px"></div>'}`;
const box=(inner,cls)=>`<div class="card ${cls||''}">${inner}</div>`;
const kv=o=>Object.keys(o||{}).length?`<div class="kvrow">${Object.entries(o).map(([k,v])=>`<span class="pill y">${esc(k)}: ${v}</span>`).join('')}</div>`:'<span style="color:var(--dim)">None</span>';
const LSTAT={setup:'Not drafted yet',drafting:'Drafting now',live:'Drafting now',active:'In season',complete:'Finished',archived:'Archived'};
const BSTAT={scheduled:['Upcoming','y'],live:['Live now','r'],completed:['Finished','g']};
async function load(){if(busy)return;busy=true;try{const {data,error}=await sb.rpc('admin_overview');if(error)throw error;D=data;err='';try{const {data:rr}=await sb.rpc('admin_chat_reports');R=rr||[]}catch(_){R=[]}}catch(e){err=e.message||String(e)}busy=false;draw()}
function stuckSplit(){const a=D.drafts.stuck||[];return{fresh:a.filter(x=>x.overdue_s<86400),old:a.filter(x=>x.overdue_s>=86400)}}
function issues(){const s=D.scoring,out=[],today=etToday();const t=s.bouts.filter(b=>b.date===today);
  const nl=t.filter(b=>!b.cito).length;if(nl)out.push({t:nl+(nl>1?' fights today are':' fight today is')+' not connected to live scoring, so points will not update.',tab:'tools',go:'Fix it'});
  if(s.live_stale.length)out.push({t:s.live_stale.length+' live fight'+(s.live_stale.length>1?'s have':' has')+' not updated in over 5 minutes.',tab:'tools',go:'Fix it'});
  const sk=stuckSplit();if(sk.fresh.length)out.push({t:sk.fresh.length+' draft'+(sk.fresh.length>1?'s look':' looks')+' stuck. The pick timer ran out within the last day and the draft did not move on.',tab:'leagues',go:'See which'});
  const pu=(s.past_unfinished||[]);if(pu.length)out.push({t:pu.length+' past fight'+(pu.length>1?'s are':' is')+' still marked Upcoming even though the date has passed, so no points were ever scored for '+(pu.length>1?'them':'it')+'.',tab:'fights',go:'See which'});
  if(D.data_quality.dup_bouts>0)out.push({t:D.data_quality.dup_bouts.toLocaleString()+' fights are stored more than once in the database (mostly older fights). This does not break scoring but makes data messy.',tab:'data',go:'Details'});
  if(D.usage.error_count_24h>0)out.push({t:D.usage.error_count_24h+' app error'+(D.usage.error_count_24h>1?'s':'')+' in the last 24 hours.',tab:'users',go:'See errors'});
  if(s.odd_matchups.length)out.push({t:s.odd_matchups.length+' finished matchup'+(s.odd_matchups.length>1?'s':'')+' ended 0.0 to 0.0, which usually means stats are missing.',tab:'fights',go:'See which'});
  const open=R.filter(x=>x.status==='open').length;if(open)out.push({t:open+' chat message'+(open>1?'s were':' was')+' reported by players and need a decision.',tab:'reports',go:'Review'});
  return out}
function pHome(){const u=D.users,l=D.leagues,a=D.activity,us=D.usage,f=D.funnel,h=issues();
  const mx=Math.max(1,...u.signups_by_day.map(x=>x.n));
  const banner=h.length?box(`<div class="banner"><div class="ic">⚠️</div><div style="flex:1"><h2 style="color:var(--red)">${h.length} thing${h.length>1?'s':''} need${h.length>1?'':'s'} your attention</h2><div style="margin-top:8px">${h.map(x=>`<div class="issue"><span>${esc(x.t)}</span><button class="btn sm" data-t="${x.tab}">${x.go}</button></div>`).join('')}</div></div></div>`,'red'):box(`<div class="banner"><div class="ic">✅</div><div><h2 style="color:var(--green)">Everything looks good</h2><div style="color:var(--mut);margin-top:4px">No problems found with scoring, drafts or app errors.</div></div></div>`,'grn');
  const steps=[['Made an account',f.accounts],['Created a league',f.created_league],['Joined a team',f.joined_team],['Finished a draft',f.finished_draft]];
  return `${banner}
  ${sec('People','Who is using Combat.')}<div class="grid">${stat('Total accounts',n(u.total),n(u.new_7d)+' new this week')}${stat('Signed in today',n(u.signed_in_24h),'in the last 24 hours')}${stat('Active in the app',n(us.users_24h),'last 24 hours')}${stat('Came back again',n(us.returning_users),'used the app on 2 or more days (last 14 days)')}</div>
  ${sec('Leagues','Leagues players have created.')}<div class="grid">${stat('Leagues',n(l.total),n(l.real)+' real, '+(l.total-l.real)+' test')}${stat('Drafts finished',n(D.drafts.by_status.complete||0),n(D.drafts.by_status.live||0)+' happening now')}${stat('Trades this week',n(Object.values(a.trades_7d).reduce((x,y)=>x+y,0)),n(a.trades_all)+' all time')}${stat('Chat messages today',n(a.chat_24h),n(a.chat_7d)+' this week')}</div>
  ${sec('New accounts, last 14 days')}${box(`<div class="row" style="align-items:flex-end;gap:5px;height:90px">${u.signups_by_day.map(x=>`<div title="${esc(x.d)}: ${x.n} new" style="flex:1;border-radius:4px 4px 0 0;background:${x.n?'var(--gold)':'#262D47'};height:${Math.max(5,x.n/mx*90)}px"></div>`).join('')}</div><div class="note">Each bar is one day. Hover or tap a bar to see the number.</div>`)}
  ${sec('How far people get','Of everyone who made an account, how many got to each step.')}${box(steps.map(([lab,v])=>`<div class="row" style="margin:10px 0"><div style="width:170px;font-weight:600">${lab}</div><div class="bar"><i style="width:${f.accounts?v/f.accounts*100:0}%"></i></div><div style="width:110px;text-align:right"><b>${v}</b> <span style="color:var(--dim)">(${f.accounts?Math.round(v/f.accounts*100):0}%)</span></div></div>`).join(''))}`}
function pFights(){const s=D.scoring,today=etToday();
  const byDate={};s.bouts.forEach(b=>{(byDate[b.date]=byDate[b.date]||[]).push(b)});
  const days=Object.keys(byDate).sort().map(d=>`<div class="date">${esc(niceDate(d))}${d===today?' · TODAY':''}</div>${box(`<div class="list">${byDate[d].map(b=>{const [lab,cl]=BSTAT[b.status]||[b.status,''];
    const both=b.perfs?(b.stats>=b.perfs?'Stats received for both fighters':b.stats+' of '+b.perfs+' fighters have stats'):'No stats yet';
    return `<div class="bout"><div class="nm">${esc(b.a)} <span class="vs">vs</span> ${esc(b.b)}</div><div><span class="pill ${cl}">${esc(lab)}</span></div><div class="meta"><span>${b.cito?'<span class="pill g">Live scoring connected</span>':'<span class="pill r">Not connected to live scoring</span>'}</span><span>${esc(both)}</span>${b.pts_a==null?'':`<span>Fantasy points: <b style="color:var(--gold)">${b.pts_a}</b> to <b style="color:var(--gold)">${b.pts_b}</b></span>`}${b.method?`<span>Result: ${esc(b.method)}</span>`:''}<span>Last update: ${b.last_sync_s==null?'none yet':ago(b.last_sync_s)}</span></div></div>`}).join('')}</div>`)}`).join('');
  return `<p class="intro">Every fight from yesterday through tomorrow, and whether its points are coming in. Times use US Eastern. Today is ${esc(niceDate(today))}.</p>
  <div class="grid">${stat('Fights shown',s.bouts.length,'yesterday to tomorrow')}${stat('Not connected',s.unlinked_upcoming,'upcoming fights (next 7 days) with no live scoring link',s.unlinked_upcoming?'red':'grn')}${stat('Stalled live fights',s.live_stale.length,'live, but no update for 5+ minutes',s.live_stale.length?'red':'grn')}${stat('Suspicious results',s.odd_matchups.length,'matchups that ended 0.0 to 0.0',s.odd_matchups.length?'red':'grn')}</div>
  ${(s.unlinked_upcoming||s.live_stale.length)?box('<b>To fix a connection problem:</b> go to the Fix-It Tools tab and use “Connect fights to live scoring” or “Refresh live scores now”.','yel').replace('class="card','style="margin-top:14px" class="card'):''}
  ${(s.past_unfinished||[]).length?sec('Past fights never finished','These fights were on a card that already happened, but they are still marked Upcoming. Nothing scored them. They are probably missing the live scoring link, so Combat never picked them up. Check the results on UFC.com and tell me, or connect and re-check them from the Fix-It Tools tab.')+box(`<div class="list">${s.past_unfinished.map(x=>`<div><b>${esc(x.a)} <span class="vs" style="color:var(--dim);font-weight:400">vs</span> ${esc(x.b)}</b><div style="color:var(--dim);font-size:14px">${esc(shortDate(x.date))} · ${esc(x.event||'')} · ${x.cito?'live scoring connected':'never connected to live scoring'}</div></div>`).join('')}</div>`,'yel'):''}
  ${s.live_stale.length?sec('Stalled live fights')+box(s.live_stale.map(x=>`<div>${esc(x.a)} vs ${esc(x.b)} <span class="pill r">last update ${ago(x.age_s)}</span></div>`).join(''),'red'):''}
  ${s.odd_matchups.length?sec('Matchups to double-check','These league matchups finished 0.0 to 0.0.')+box(s.odd_matchups.map(x=>`<div>${esc(x.league)}, block ${x.block}: ${x.a} to ${x.b}</div>`).join(''),'red'):''}
  ${sec('Fights')}${days||box('<span style="color:var(--dim)">No fights in this window.</span>')}`}
function pLeagues(){const L=D.leagues;
  const cards=L.list.map(l=>`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="font-size:19px">${esc(l.name)}</h3><span class="row" style="gap:6px">${l.is_test?'<span class="pill">Test</span>':''}<span class="pill ${l.status==='active'?'g':'y'}">${esc(LSTAT[l.status]||l.status)}</span></span></div>
   <div class="lg"><div><b>${l.teams} of ${l.team_count}</b>teams filled</div><div><b>${l.cpu}</b>computer teams</div><div><b>${esc(l.commissioner||'—')}</b>commissioner</div><div><b>${l.finish_bonus?'On':'Off'}</b>finish bonus</div><div><b>${l.msgs_7d}</b>chat messages this week</div><div><b>${esc(shortDate(l.created))}</b>created</div></div></div>`).join('');
  return `<p class="intro">Every league in Combat. Real leagues are made by players. Test leagues are practice drafts.</p>
  <div class="grid">${stat('All leagues',n(L.total))}${stat('Real leagues',n(L.real),'not counting tests')}</div>
  ${stuckSplit().fresh.length?sec('Stuck drafts','The pick timer ran out in the last day and the draft did not move on.')+box(stuckSplit().fresh.map(x=>`<div>${esc(x.league)}: pick ${x.pick}, timer ran out ${ago(x.overdue_s)}</div>`).join(''),'red'):''}
  ${stuckSplit().old.length?sec('Abandoned drafts','These drafts were started and then left alone for over a day. They are most likely old tests nobody finished. They do not hurt anything, but they can be cleaned up.')+box(stuckSplit().old.map(x=>`<div>${esc(x.league)}: stopped at pick ${x.pick}, ${ago(x.overdue_s)}</div>`).join(''),'yel'):''}
  ${sec('Where leagues are at')}${box(kv(Object.fromEntries(Object.entries(L.by_status).map(([k,v])=>[LSTAT[k]||k,v]))))}
  ${sec('Draft results')}${box(kv(D.drafts.by_status)+`<div class="note">${D.drafts.autopick_share==null?'':D.drafts.autopick_share+'% of all draft picks were made automatically because a player ran out of time.'}</div>`)}
  ${sec('Trades and waiver claims, last 7 days')}<div class="two">${box('<b>Trades</b><div style="margin-top:8px">'+kv(D.activity.trades_7d)+'</div>')}${box('<b>Waiver claims</b><div style="margin-top:8px">'+kv(D.activity.claims_7d)+'</div>')}</div>
  ${sec('All leagues')}<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${cards}</div>`}
function pUsers(){const u=D.usage,us=u,tot=Math.max(1,...u.views_7d.map(x=>x.n)),ta=Math.max(1,...u.actions_7d.map(x=>x.n));
  const bars=(arr,k,mx)=>arr.map(x=>`<div class="row" style="margin:8px 0"><div style="width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x[k]||'(unknown)')}</div><div class="bar"><i style="width:${x.n/mx*100}%"></i></div><div style="width:44px;text-align:right"><b>${x.n}</b></div></div>`).join('')||'<span style="color:var(--dim)">No data yet. It fills in as people use the app.</span>';
  const p=u.press_room;
  return `<p class="intro">How people are using the app. These numbers come from app tracking, so they start filling in once people sign in.</p>
  <div class="grid">${stat('Active people',n(u.users_24h),'last 24 hours')}${stat('Active people',n(u.users_7d),'last 7 days')}${stat('Visits',n(us.sessions_24h),'last 24 hours')}${stat('Time per visit',us.avg_minutes_per_session_7d==null?'—':us.avg_minutes_per_session_7d+' min','average, last 7 days')}</div>
  ${sec('Errors','Things that broke for a player.')}<div class="grid">${stat('Errors',n(u.error_count_24h),'last 24 hours',u.error_count_24h?'red':'grn')}</div>
  ${box(u.errors_24h.length?`<div class="scroll"><table><tr><th>Time (UTC)</th><th>Screen</th><th>What happened</th></tr>${u.errors_24h.map(e=>`<tr><td style="color:var(--dim)">${esc(String(e.at).slice(11,19))}</td><td>${esc(e.screen||'')}</td><td>${esc(e.msg||'')}</td></tr>`).join('')}</table></div>`:'<span style="color:var(--green)">No errors in the last 24 hours.</span>',u.errors_24h.length?'red':'').replace('class="card','style="margin-top:12px" class="card')}
  ${sec('Pages people visit','Number of views in the last 7 days.')}${box(bars(u.views_7d,'screen',tot))}
  ${sec('Buttons people tap','Most used buttons in the last 7 days.')}${box(bars(u.actions_7d,'action',ta))}
  ${sec('Phones and computers','Visits in the last 7 days by device.')}${box(kv(u.devices_7d))}
  ${sec('Press room','The live commentary feature, last 7 days.')}<div class="grid">${stat('Times opened',n(p.opened))}${stat('Mic taps',n(p.mic))}${stat('Chat messages sent',n(p.chat))}${stat('Interruptions',n(p.interrupts))}</div>`}
function pReports(){const o=R.filter(x=>x.status==='open'),c=R.length-o.length;
  return `<p class="intro">Players can report chat messages. For each one you can remove the message or dismiss the report if it is fine.</p>
  <div class="grid">${stat('Waiting for you',n(o.length),'',o.length?'red':'grn')}${stat('Already handled',n(c))}</div>
  ${sec('Reported messages')}${R.length?`<div class="list card">${R.map(x=>`<div><div class="row" style="justify-content:space-between"><b>${esc(x.message_name||'Someone')}</b><span class="row" style="gap:8px"><span style="color:var(--dim);font-size:14px">${esc(shortDate(x.created_at))}</span><span class="pill ${x.status==='open'?'r':'g'}">${x.status==='open'?'Needs a decision':esc(x.status==='removed'?'Removed':'Dismissed')}</span></span></div><div style="margin:6px 0;word-break:break-word">“${esc(x.message_body||'')}”</div>${x.reason?`<div style="color:var(--dim);font-size:14px">Reason given: ${esc(x.reason)}</div>`:''}${x.status==='open'?`<div class="row" style="margin-top:10px"><button class="btn sm" data-rm="${x.id}">Remove message</button><button class="btn o sm" data-cl="${x.id}">It's fine, dismiss</button></div>`:''}</div>`).join('')}</div>`:box('<span style="color:var(--dim)">No reports yet.</span>')}`}
function pData(){const q=D.data_quality,pc=v=>q.fighters?Math.round(v/q.fighters*100)+'% of fighters':'—';
  return `<p class="intro">How complete the fighter information is. Numbers show how many fighters are missing each piece.</p>
  <div class="grid">${stat('Fighters in Combat',n(q.fighters))}${stat('Missing a photo',n(q.no_photo),pc(q.no_photo))}${stat('Missing age',n(q.no_age),pc(q.no_age))}${stat('Missing height',n(q.no_height),pc(q.no_height))}${stat('Missing reach',n(q.no_reach),pc(q.no_reach))}${stat('Missing stance',n(q.no_stance),pc(q.no_stance))}${stat('Missing country',n(q.no_country),pc(q.no_country))}${stat('Duplicate fights',n(q.dup_bouts),'fights saved more than once (same two fighters, same date)',q.dup_bouts?'red':'grn')}</div>
  ${sec('Fighters on upcoming cards with missing info','Fighters fighting in the next 30 days. These are the ones players will see first.')}${box(q.upcoming_missing.length?`<div class="scroll"><table><tr><th>Fighter</th><th>Photo</th><th>Age</th><th>Height</th><th>Reach</th><th>Country</th></tr>${q.upcoming_missing.map(f=>`<tr><td><b>${esc(f.name)}</b></td>${['photo','age','height','reach','country'].map(k=>`<td>${f[k]?'<span class="pill r">Missing</span>':'<span style="color:var(--dim)">OK</span>'}</td>`).join('')}</tr>`).join('')}</table></div><div class="note">To fill these in, use “Fill in fighter info and photos” on the Fix-It Tools tab.</div>`:'<span style="color:var(--green)">Every fighter on an upcoming card has full info.</span>')}`}
let FC=null,FCerr='';
async function loadFouls(){try{const {data,error}=await sb.rpc('admin_foul_candidates');if(error)throw error;FC=data||[];FCerr=''}catch(e){FC=[];FCerr=e.message||'Could not load fights'}draw()}
function pFouls(){if(FC===null){loadFouls();return box('<div class="tool"><h3>Record a foul or point deduction</h3><p class="what">Loading fights…</p></div>')}
  const opts=FC.map(x=>`<option value="${esc(x.id)}">${esc(x.date)} · ${esc(x.fighter)} (vs ${esc(x.opponent)})${x.fouls?' · '+x.fouls+' foul'+(x.fouls>1?'s':'')+' recorded':''}</option>`).join('');
  return box(`<div class="tool"><h3>Record a foul or point deduction</h3><p class="what">Choose the fighter who committed the foul or had a point taken, then enter how many.</p><p class="when">Each foul costs that fighter 2 fantasy points, but only in leagues that have Deductions turned on. Shows fights from the last 21 days.</p>${FCerr?`<div class="note" style="color:var(--red)">${esc(FCerr)}</div>`:''}<div class="row"><select id="fcSel" style="max-width:100%;flex:1;min-width:220px">${opts||'<option value="">No finished fights yet</option>'}</select><label class="row" style="gap:6px">Fouls <input id="fcN" type="number" min="0" max="10" value="1" style="width:80px"></label><button class="btn" id="fcGo">Save</button></div><div class="note" id="fcMsg"></div></div>`)}
function pTools(){const d=etToday();
  return `<p class="intro">Fixes you can run yourself. Each button opens a new tab that shows what happened. Where there is a “Preview” button, run it first. It only shows what would change and does not change anything.</p><div class="two">
  ${box(`<div class="tool"><h3>Connect fights to live scoring</h3><p class="what">Links every fight on a date to the live stats feed so fantasy points update during the fight.</p><p class="when">Use when the Fights tab says a fight is not connected. Normally do this the morning of an event.</p><div class="row" style="margin:6px 0 12px"><label class="row" style="gap:8px">Event date <input id="ld" value="${d}" style="width:150px"></label></div><a class="btn o" id="l1" target="_blank">Preview</a> <a class="btn" id="l2" target="_blank">Connect them</a></div>`)}
  ${box(`<div class="tool"><h3>Refresh live scores now</h3><p class="what">Pulls the newest stats for all live fights right away.</p><p class="when">This already runs by itself every minute. Use it only if a live fight looks stuck.</p><a class="btn" target="_blank" href="${FN}live-poll">Refresh now</a></div>`)}
  ${box(`<div class="tool"><h3>Fill in fighter info and photos</h3><p class="what">Adds age, height, reach, stance, record and photo for fighters on upcoming cards.</p><p class="when">Use when the Fighter Data tab shows missing info for upcoming fighters.</p><a class="btn o" target="_blank" href="${FN}enrich-upcoming?dryRun=true">Preview</a> <a class="btn" target="_blank" href="${FN}enrich-upcoming">Fill it in</a></div>`)}
  ${box(`<div class="tool"><h3>Re-check winners</h3><p class="what">Goes back over finished fights and corrects any wrong winner.</p><p class="when">Use if a league matchup was decided by the wrong winner.</p><a class="btn" target="_blank" href="${FN}repair-winners">Re-check winners</a></div>`)}
  ${pFouls()}
  </div>`}
function draw(){const app=$('#app');
  if(err){app.innerHTML=`<div class="msg"><h1 style="color:var(--gold);font-size:30px">Combat Admin</h1><p style="color:var(--mut)">${/Not allowed/i.test(err)?'This page is only for the Combat owner.':'Could not load the admin page: '+esc(err)}</p><p><a class="btn" href="login.html?redirect=admin.html">Sign in</a></p></div>`;return}
  if(!D){app.innerHTML='<div class="msg" style="color:var(--dim)">Loading…</div>';return}
  const body={home:pHome,fights:pFights,leagues:pLeagues,users:pUsers,reports:pReports,data:pData,tools:pTools}[tab]||pHome;
  const open=R.filter(x=>x.status==='open').length;
  app.innerHTML=`<div class="top"><h1>Combat Admin</h1><span class="upd">Updated ${new Date(D.generated_at).toLocaleTimeString()}. Refreshes by itself every 30 seconds.</span><button class="btn o" id="rf">Refresh</button></div><div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-t="${k}">${l}${k==='reports'&&open?`<span class="dot">${open}</span>`:''}</button>`).join('')}</div>${body()}`;
  const fcGo=$('#fcGo');if(fcGo)fcGo.addEventListener('click',async()=>{const id=$('#fcSel').value,k=+$('#fcN').value;if(!id){return}const {error}=await sb.rpc('admin_set_fouls',{p_performance:id,p_fouls:k});const m=$('#fcMsg');if(error){m.textContent=error.message;return}m.textContent='Saved.';FC=null;setTimeout(loadFouls,400)});
  const l1=$('#l1'),l2=$('#l2'),ld=$('#ld');if(ld){const set=()=>{l1.href=FN+'link-card-bouts?date='+encodeURIComponent(ld.value)+'&dryRun=true';l2.href=FN+'link-card-bouts?date='+encodeURIComponent(ld.value)};set();ld.addEventListener('input',set)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;location.hash=tab;draw();window.scrollTo(0,0);return}const rm=e.target.closest('[data-rm]');if(rm){const x=R.find(q=>String(q.id)===rm.dataset.rm);if(x)(async()=>{await sb.from(x.source==='league'?'chat_messages':'cr_chat').delete().eq('id',x.message_id);await sb.from('chat_reports').update({status:'removed'}).eq('id',x.id);load()})();return}
  const cl=e.target.closest('[data-cl]');if(cl){(async()=>{await sb.from('chat_reports').update({status:'dismissed'}).eq('id',cl.dataset.cl);load()})();return}
  if(e.target.closest('#rf'))load()});
(async()=>{const u=await CombatAuth.getUser();if(!u){err='Not signed in';draw();return}load();setInterval(()=>{if(!document.hidden&&tab!=='tools')load()},30000)})();
</script></body></html>
