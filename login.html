<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combat — Sign In</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E0F11">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0E0F11; --panel:#17181B; --panel-2:#1E2024; --border:#2A2C31;
    --text:#EDEDED; --text-dim:#8A8A8A; --text-faint:#4E4F53; --gold:#D4AF37; --red:#E2283C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{width:100%;max-width:380px;}
  .brand{text-align:center;font-size:17px;font-weight:600;letter-spacing:0.02em;margin-bottom:24px;}
  .brand span{color:var(--gold);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;}
  .tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--panel-2);border-radius:8px;padding:4px;}
  .tab{flex:1;text-align:center;padding:8px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text-dim);}
  .tab.active{background:var(--gold);color:#0E0F11;font-weight:600;}
  label{display:block;font-size:12px;color:var(--text-dim);margin-top:14px;margin-bottom:6px;}
  input{
    width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);
    font-size:14px;padding:10px 12px;
  }
  input:focus{outline:none;border-color:var(--gold);}
  button.primary{
    width:100%;background:var(--gold);color:#0E0F11;border:none;border-radius:8px;padding:12px;
    font-size:14px;font-weight:600;cursor:pointer;margin-top:20px;
  }
  button.primary:disabled{opacity:0.5;cursor:not-allowed;}
  .error{
    background:rgba(226,67,51,0.1);border:1px solid rgba(226,67,51,0.3);color:#F0897D;
    font-size:12.5px;padding:10px 14px;border-radius:8px;margin-top:16px;
  }
  .success{
    background:rgba(76,175,125,0.1);border:1px solid rgba(76,175,125,0.3);color:#9FD6B8;
    font-size:12.5px;padding:10px 14px;border-radius:8px;margin-top:16px;
  }
  .back{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:var(--text-dim);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">COMBAT <span>SIGN IN</span></div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tabSignIn">Sign In</div>
      <div class="tab" id="tabSignUp">Sign Up</div>
    </div>

    <div class="tabs" id="methodTabs" style="margin-top:-6px">
      <div class="tab active" id="methodEmail">Email</div>
      <div class="tab" id="methodPhone">Phone</div>
    </div>

    <form id="form">
      <div id="displayNameField" style="display:none;">
        <label for="displayName">Display name</label>
        <input id="displayName" type="text" maxlength="40" placeholder="How your league sees you">
      </div>
      <div id="emailFields">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" minlength="6">
        <a href="#" id="forgotLink" style="display:block;text-align:right;margin-top:8px;font-size:12.5px;color:var(--gold,#D4AF37);font-weight:600;text-decoration:none;">Forgot password?</a>
      </div>
      <div id="phoneFields" style="display:none;">
        <label for="phone">Mobile number</label>
        <input id="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="(555) 123-4567">
        <div style="margin-top:8px;font-size:12px;color:var(--text-dim);">No password needed. We text you a new code each time. Lost access to your old password? Just sign in with a code.</div>
        <div id="codeField" style="display:none;">
          <label for="code">6-digit code</label>
          <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
        </div>
      </div>
      <button class="primary" id="submitBtn" type="submit">Sign In</button>
    </form>

    <form id="resetForm" style="display:none;">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
      <label for="newPassword2">Confirm new password</label>
      <input id="newPassword2" type="password" autocomplete="new-password" minlength="6" required>
      <button class="primary" id="resetBtn" type="submit">Save New Password</button>
    </form>

    <div class="error" id="errorBox" style="display:none;"></div>
    <div class="success" id="successBox" style="display:none;"></div>
  </div>
  <div style="text-align:center;margin-top:14px;font-size:11.5px;color:var(--text-faint);">
    By continuing you agree to Combat's <a href="terms.html" style="color:var(--text-dim);font-weight:700;">Terms and Conditions</a> and <a href="privacy.html" style="color:var(--text-dim);font-weight:700;">Privacy Policy</a>.
  </div>
  <a href="index.html" class="back">← Back to Combat</a>
</div>

<script src="auth.js"></script>
<script>
const { client } = CombatAuth;

const tabSignIn = document.getElementById("tabSignIn");
const tabSignUp = document.getElementById("tabSignUp");
const form = document.getElementById("form");
const displayNameField = document.getElementById("displayNameField");
const displayNameInput = document.getElementById("displayName");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const errorBox = document.getElementById("errorBox");
const successBox = document.getElementById("successBox");

// Phone sign-in needs a paid text-message provider (Twilio) connected in Supabase.
// Flip to true once that is set up and the Phone tab appears.
const PHONE_LOGIN = false;
if (!PHONE_LOGIN) document.getElementById("methodTabs").style.display = "none";
let mode = "signin";
let method = "email";      // email | phone
let codeSent = false;      // phone flow: waiting for the text-message code
const methodEmail = document.getElementById("methodEmail");
const methodPhone = document.getElementById("methodPhone");
const emailFields = document.getElementById("emailFields");
const phoneFields = document.getElementById("phoneFields");
const codeField = document.getElementById("codeField");
const phoneInput = document.getElementById("phone");
const codeInput = document.getElementById("code");

function submitLabel() {
  if (method === "phone") return codeSent ? "Verify Code" : "Text Me a Code";
  return mode === "signup" ? "Create Account" : "Sign In";
}
function setMethod(next) {
  method = next; codeSent = false;
  methodEmail.classList.toggle("active", method === "email");
  methodPhone.classList.toggle("active", method === "phone");
  emailFields.style.display = method === "email" ? "block" : "none";
  phoneFields.style.display = method === "phone" ? "block" : "none";
  codeField.style.display = "none";
  emailInput.required = method === "email"; passwordInput.required = method === "email";
  phoneInput.required = method === "phone"; codeInput.required = false;
  submitBtn.textContent = submitLabel();
  errorBox.style.display = "none"; successBox.style.display = "none";
}
methodEmail.addEventListener("click", () => setMethod("email"));
methodPhone.addEventListener("click", () => setMethod("phone"));
// US numbers can be typed any way; everything else must start with + and the country code.
function toE164(raw) {
  const t = String(raw || "").trim(); const d = t.replace(/\D/g, "");
  if (t.startsWith("+")) return "+" + d;
  if (d.length === 10) return "+1" + d;
  if (d.length === 11 && d[0] === "1") return "+" + d;
  return null;
}

function setMode(next) {
  mode = next;
  tabSignIn.classList.toggle("active", mode === "signin");
  tabSignUp.classList.toggle("active", mode === "signup");
  displayNameField.style.display = mode === "signup" ? "block" : "none";
  displayNameInput.required = mode === "signup";
  passwordInput.autocomplete = mode === "signup" ? "new-password" : "current-password";
  codeSent = false; codeField.style.display = "none";
  submitBtn.textContent = submitLabel();
  errorBox.style.display = "none";
  successBox.style.display = "none";
}

tabSignIn.addEventListener("click", () => setMode("signin"));
tabSignUp.addEventListener("click", () => setMode("signup"));

// A page that requires sign-in (like joining a Face-Off room) links here
// with ?redirect=<url> so we can send people back where they meant to go
// instead of always landing on team.html.
const redirectTarget = new URLSearchParams(location.search).get("redirect") || "league.html";

// Already signed in? Bounce straight back rather than showing the form.
const isRecovery = /type=recovery/.test(location.hash);
CombatAuth.getUser().then((user) => {
  if (user && !isRecovery) {
    successBox.textContent = "You're already signed in.";
    successBox.style.display = "block";
    setTimeout(() => { window.location.href = redirectTarget; }, 500);
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.style.display = "none";
  successBox.style.display = "none";
  submitBtn.disabled = true;

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  try {
    if (method === "phone") {
      const phone = toE164(phoneInput.value);
      if (!phone) throw new Error("Enter a full mobile number, with the country code if it's outside the US (like +44 7700 900123).");
      if (!codeSent) {
        const displayName = displayNameInput.value.trim();
        if (mode === "signup" && !displayName) throw new Error("Pick a display name.");
        if (mode === "signup") { try { localStorage.setItem("combat-pending-display-name", displayName); } catch (e) {} }
        const { error } = await client.auth.signInWithOtp({ phone, options: { shouldCreateUser: mode === "signup" } });
        if (error) throw error;
        codeSent = true; codeField.style.display = "block"; codeInput.required = true; codeInput.focus();
        submitBtn.textContent = submitLabel();
        successBox.textContent = "Code sent. It can take a few seconds to arrive.";
        successBox.style.display = "block";
      } else {
        const token = codeInput.value.replace(/\D/g, "");
        if (token.length !== 6) throw new Error("Enter the 6-digit code from the text.");
        const { data, error } = await client.auth.verifyOtp({ phone, token, type: "sms" });
        if (error) throw error;
        let pendingName = null;
        try { pendingName = localStorage.getItem("combat-pending-display-name"); } catch (e) {}
        if (pendingName && data.user) {
          await CombatAuth.ensureProfile(data.user.id, pendingName);
          try { localStorage.removeItem("combat-pending-display-name"); } catch (e) {}
        }
        window.location.href = redirectTarget;
        return;
      }
    } else if (mode === "signup") {
      const displayName = displayNameInput.value.trim();
      if (!displayName) throw new Error("Pick a display name.");

      const { data, error } = await client.auth.signUp({ email, password });
      if (error) throw error;

      if (data.session && data.user) {
        // Signed in immediately (email confirmation is off) — safe to save now.
        await CombatAuth.ensureProfile(data.user.id, displayName);
        successBox.textContent = "Account created — you're signed in.";
        successBox.style.display = "block";
        setTimeout(() => { window.location.href = redirectTarget; }, 800);
      } else {
        // No session yet (email confirmation required) — the profile write
        // would be blocked until they're actually logged in, so stash the
        // name and apply it the moment they sign in below.
        try { localStorage.setItem("combat-pending-display-name", displayName); } catch (e) {}
        successBox.textContent = "Account created — check your email to confirm, then sign in.";
        successBox.style.display = "block";
        setMode("signin");
      }
    } else {
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) throw error;

      let pendingName = null;
      try { pendingName = localStorage.getItem("combat-pending-display-name"); } catch (e) {}
      if (pendingName && data.user) {
        await CombatAuth.ensureProfile(data.user.id, pendingName);
        try { localStorage.removeItem("combat-pending-display-name"); } catch (e) {}
      }

      window.location.href = redirectTarget;
    }
  } catch (err) {
    errorBox.textContent = err.message || "Something went wrong.";
    errorBox.style.display = "block";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = submitLabel();
  }
});
// ---- Forgot password ----
const forgotLink = document.getElementById("forgotLink");
const resetForm = document.getElementById("resetForm");
function showReset() {
  form.style.display = "none"; document.getElementById("tabSignIn").parentElement.style.display = "none"; document.getElementById("methodTabs").style.display = "none";
  resetForm.style.display = "block";
  successBox.textContent = "Choose a new password."; successBox.style.display = "block"; errorBox.style.display = "none";
}
forgotLink.addEventListener("click", async (e) => {
  e.preventDefault(); errorBox.style.display = "none"; successBox.style.display = "none";
  const email = emailInput.value.trim();
  if (!email) { errorBox.textContent = "Type your email above first, then tap Forgot password."; errorBox.style.display = "block"; emailInput.focus(); return; }
  const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) { errorBox.textContent = error.message || "Couldn't send the reset email."; errorBox.style.display = "block"; return; }
  successBox.textContent = "If that email has an account, a reset link is on its way. Open it on this device.";
  successBox.style.display = "block";
});
client.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY") showReset(); });
if (isRecovery) setTimeout(showReset, 600);
resetForm.addEventListener("submit", async (e) => {
  e.preventDefault(); errorBox.style.display = "none";
  const a = document.getElementById("newPassword").value, b2 = document.getElementById("newPassword2").value;
  if (a !== b2) { errorBox.textContent = "Those passwords don't match."; errorBox.style.display = "block"; return; }
  const { error } = await client.auth.updateUser({ password: a });
  if (error) { errorBox.textContent = error.message || "Couldn't save the new password."; errorBox.style.display = "block"; return; }
  successBox.textContent = "Password updated. Taking you in…"; successBox.style.display = "block";
  setTimeout(() => { window.location.href = redirectTarget; }, 900);
});
</script>
</body>
</html>
