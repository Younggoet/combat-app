<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combat — Mock Draft</title>
<meta name="description" content="Try Combat's mock draft — real fighters, real ratings, no sign-in required.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0B0D">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D; --panel:#141417; --panel-2:#1A1A1E; --panel-3:#0F0F12; --border:#242428; --border-2:#1C1C20;
    --text:#F5F2EA; --text-dim:#9A9AA2; --text-faint:#5A5A62; --text-faint-2:#4A4A52; --gold:#D4AF37; --red:#E2283C;
    /* Elevation: cards are told apart by depth (shadow), not a hairline
       border — a thin rgba edge keeps things crisp but the shadow carries
       the weight. Two sizes: small controls vs. hero panels. */
    --edge:1px solid rgba(255,255,255,0.06);
    --shadow-sm:0 4px 14px rgba(0,0,0,0.35);
    --shadow-lg:0 16px 40px rgba(0,0,0,0.5);
    --r-sm:8px; --r-md:14px; --r-lg:20px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; color:var(--text);
    font-family:'Barlow',-apple-system,sans-serif; min-height:100vh;
    background:
      radial-gradient(900px 500px at 12% -5%, rgba(212,175,55,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(226,40,60,0.08), transparent 55%),
      var(--bg);
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  .h-font{font-family:'Oswald',sans-serif;text-transform:uppercase;}
  .wrap{max-width:1440px;margin:0 auto;padding:24px 20px 60px;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#2A2A30;border-radius:4px;}
  @media (max-width:760px){
    .wrap{padding:14px 14px 40px;}
  }

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .name{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:19px;font-weight:700;letter-spacing:1px;color:var(--gold);}

  .loading, .msg{text-align:center;color:var(--text-dim);padding:60px 0;font-size:14px;}
  .error{
    background:rgba(226,40,60,0.1);border:1px solid rgba(226,40,60,0.3);color:#F0897D;
    font-size:13px;padding:14px 16px;border-radius:8px;margin-bottom:16px;
  }

  /* ---------- Landing ---------- */
  .hero{
    max-width:720px;margin:80px auto 0;text-align:center;padding:0 10px;
    display:flex;flex-direction:column;align-items:center;
  }
  .hero .wordmark{
    font-family:'Oswald',sans-serif;text-transform:uppercase;font-weight:700;
    font-size:clamp(48px,10vw,88px);line-height:1;letter-spacing:2px;color:var(--gold);margin:0;
    text-shadow:0 2px 0 rgba(0,0,0,0.5);
  }
  .hero .tagline{
    font-family:'Oswald',sans-serif;text-transform:uppercase;font-weight:600;
    font-size:clamp(14px,2.6vw,20px);letter-spacing:6px;color:var(--text-dim);margin:10px 0 44px;
  }
  .octagon{
    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  button.cta{
    background:linear-gradient(180deg,#E6C75C,var(--gold));color:#17120A;border:3px solid #17120A;border-radius:10px;
    padding:28px 52px;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:clamp(17px,3vw,22px);
    font-weight:700;letter-spacing:1.5px;cursor:pointer;
    box-shadow:0 0 0 1px rgba(212,175,55,0.5), 0 18px 40px rgba(212,175,55,0.28);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.cta:hover{
    background:linear-gradient(180deg,#F0D878,#E0BC4E);transform:translateY(-2px);
    box-shadow:0 0 0 1px rgba(212,175,55,0.6), 0 22px 46px rgba(212,175,55,0.38);
  }
  .hero .welcome{font-size:13.5px;color:var(--text-faint);margin-top:18px;letter-spacing:0.5px;}

  /* ---------- Setup ---------- */
  .settings-card{
    max-width:520px;margin:20px auto;background:var(--panel);border:var(--edge);
    border-radius:var(--r-md);padding:28px 30px 32px;box-shadow:var(--shadow-lg);
  }
  @media (max-width:760px){
    .settings-card{padding:22px 20px 26px;margin:14px auto;}
  }
  .settings-card .kicker{font-size:11px;letter-spacing:2px;color:var(--text-faint);margin-bottom:4px;}
  .settings-card h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:20px;margin:0 0 6px;letter-spacing:1px;}
  .settings-card .desc{font-size:13px;color:var(--text-dim);margin:0 0 26px;line-height:1.5;}
  .field{margin-bottom:22px;}
  .field label{display:block;font-size:11px;letter-spacing:1.5px;color:var(--text-faint);margin-bottom:8px;text-transform:uppercase;}
  input[type=text].field-input{
    width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);
    font-size:14px;padding:11px 14px;
  }
  input[type=text].field-input:focus{outline:none;border-color:var(--gold);}
  .stepper{display:flex;align-items:center;gap:14px;}
  .stepper button{
    width:36px;height:36px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);font-size:17px;cursor:pointer;
  }
  .stepper button:hover{border-color:var(--gold);}
  .stepper .val{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;min-width:28px;text-align:center;}
  .photo-row{display:flex;align-items:center;gap:14px;}
  .photo-preview{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--panel-2);border:1px solid var(--border);flex-shrink:0;}
  .photo-preview-ph{
    width:60px;height:60px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:9px;flex-shrink:0;text-align:center;
  }
  input[type=file]{font-size:12px;color:var(--text-dim);}
  button.primary{
    background:var(--red);color:#fff;border:none;border-radius:4px;padding:13px 30px;
    font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;width:100%;font-family:'Oswald',sans-serif;text-transform:uppercase;
  }
  button.primary:disabled{opacity:0.4;cursor:not-allowed;}
  .back-link{display:inline-block;margin-bottom:14px;font-size:12px;color:var(--text-faint);text-decoration:none;cursor:pointer;}
  .back-link:hover{color:var(--text-dim);}
  .lobby{
    max-width:480px;margin:50px auto;background:var(--panel);border:var(--edge);
    border-radius:var(--r-lg);padding:40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;
    box-shadow:var(--shadow-lg);
  }
  @media (max-width:760px){
    .lobby{margin:20px auto;padding:28px 22px;}
  }
  .share-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  button.ghost{
    background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:4px;
    padding:10px 20px;font-size:12px;letter-spacing:1px;cursor:pointer;font-family:'Oswald',sans-serif;text-transform:uppercase;
  }
  button.ghost:hover{border-color:var(--gold);color:var(--gold);}
  .roster-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;margin-top:16px;}
  .roster-role{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--panel-2);}
  .roster-role .rname{color:var(--text-dim);}
  .roster-role .rfill{color:var(--gold);font-weight:600;}
  .feed-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;margin-top:16px;max-height:280px;overflow-y:auto;}
  .feed-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--panel-2);font-size:12.5px;}
  .feed-row .fname{font-weight:600;}
  .feed-row .meta{color:var(--text-faint);font-size:11px;}

  /* ---------- Draft room header ---------- */
  .dr-header{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid #1C1C20;margin-bottom:0;flex-wrap:wrap;gap:14px;}
  .dr-header-left{display:flex;align-items:center;gap:14px;}
  .vrule{width:1px;height:22px;background:#2A2A30;}
  .board-link{border:var(--edge);border-radius:var(--r-sm);padding:10px 18px;cursor:pointer;background:var(--panel-2);color:#D8D5CC;font-weight:600;box-shadow:var(--shadow-sm);}
  .board-link:hover{color:var(--gold);}
  .status-group{display:flex;align-items:center;gap:24px;}
  .status-right{text-align:right;}
  .status-right .lbl{font-size:10px;letter-spacing:1.5px;color:#7A7A82;}
  .status-right .val{font-size:22px;font-weight:700;}
  button.start-draft{background:linear-gradient(180deg,#F0423F,var(--red));color:#fff;border:none;border-radius:var(--r-sm);padding:16px 36px;cursor:pointer;box-shadow:0 10px 26px rgba(226,40,60,0.35);}
  @media (max-width:560px){
    .dr-header-subtitle{display:none;}
    .status-group, .status-right{gap:16px;}
  }

  /* ---------- Octagon tracker ---------- */
  .tracker{display:flex;align-items:flex-start;gap:14px;padding:22px 0;background:var(--panel-3);border-bottom:1px solid var(--border-2);margin:0 -20px;padding-left:20px;padding-right:20px;overflow-x:auto;scroll-snap-type:x proximity;}
  .tslot{display:flex;flex-direction:column;align-items:center;gap:7px;width:108px;flex-shrink:0;scroll-snap-align:start;}
  .tslot .oct{width:52px;height:52px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
  .tslot .pickline{display:flex;align-items:center;gap:5px;}
  .tslot .pickline .n{font-size:10px;letter-spacing:1px;color:#5A5A62;}
  .tslot .info{font-size:11px;letter-spacing:0.5px;text-align:center;line-height:1.3;}
  .tslot .divtag{border-radius:10px;padding:1px 8px;}
  @media (max-width:760px){
    .tracker{gap:10px;padding:16px 14px;margin:0 -14px;}
    .tslot{width:82px;}
    .tslot .oct{width:42px;height:42px;}
  }

  /* ---------- Main stage ---------- */
  .stage{display:flex;gap:24px;padding:28px 0;align-items:flex-start;flex-wrap:wrap;}
  .stage-main{flex:2;min-width:320px;display:flex;flex-direction:column;gap:20px;}
  .stage-side{flex:0 0 360px;display:flex;flex-direction:column;min-width:300px;}
  @media (max-width:900px){
    .stage{flex-direction:column;padding:20px 0;}
    .stage-main, .stage-side{flex:unset;width:100%;min-width:0;}
  }

  .spotlight-card{background:var(--panel);border:var(--edge);border-radius:var(--r-md);padding:26px;display:flex;gap:26px;flex-wrap:wrap;box-shadow:var(--shadow-lg);}
  .spotlight-photo{flex:0 0 200px;height:260px;background:#1C1C20;border:var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:var(--r-sm);overflow:hidden;}
  .spotlight-body{flex:1;min-width:260px;display:flex;flex-direction:column;gap:18px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin-bottom:18px;}
  .stat-cell{background:#1C1C20;border:var(--edge);border-radius:var(--r-sm);padding:12px 6px;text-align:center;}
  .stat-cell .v{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;color:var(--text);line-height:1.1;}
  .stat-cell .l{font-size:9px;letter-spacing:0.5px;color:#6A6A72;margin-top:4px;}
  .tape-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-2);}
  .tape-row .a{font-family:'Oswald',sans-serif;font-size:19px;font-weight:700;color:var(--text);}
  .tape-row .lbl{font-size:10.5px;letter-spacing:1px;color:#6A6A72;text-align:center;padding:0 18px;}
  .tape-row .b{font-family:'Oswald',sans-serif;font-size:19px;font-weight:700;color:#8A8A92;text-align:right;}
  @media (max-width:760px){
    .spotlight-card{padding:18px;gap:16px;}
    .spotlight-photo{flex:unset;width:100%;height:220px;}
    .stat-grid{grid-template-columns:repeat(3,1fr);}
    .tape-row .a, .tape-row .b{font-size:16px;}
  }

  .role-pills{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .role-pill{border-radius:var(--r-lg);padding:10px 18px;border:var(--edge);background:var(--panel-2);min-height:40px;}
  .lock-pick-btn{align-self:stretch;border:none;border-radius:var(--r-sm);padding:16px 32px;font-size:15px;font-weight:700;letter-spacing:2px;font-family:'Oswald',sans-serif;text-transform:uppercase;box-shadow:var(--shadow-sm);}
  @media (max-width:760px){
    .lock-pick-btn{padding:16px 20px;}
  }

  .slip-panel{background:var(--panel);border:var(--edge);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-lg);}
  .slip-head{padding:18px 22px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;justify-content:space-between;}
  .slip-list{padding:6px 22px;max-height:420px;overflow-y:auto;}
  .slip-group{display:flex;align-items:center;gap:8px;padding:12px 0 6px;}
  .slip-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-2);gap:8px;}
  .slip-foot{padding:16px 22px;background:var(--panel-3);}

  .side-card{background:var(--panel);border:var(--edge);border-radius:var(--r-md);overflow:hidden;margin-top:18px;box-shadow:var(--shadow-lg);}
  .side-card-head{padding:16px 22px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;gap:8px;}
  .side-card-body{padding:6px 22px;}
  .feed-item{padding:11px 0;border-bottom:1px solid var(--border-2);display:flex;align-items:baseline;gap:10px;font-size:13px;}
  .news-item{padding:12px 0;border-bottom:1px solid var(--border-2);display:flex;align-items:flex-start;gap:10px;}
  .news-item a{font-size:12px;color:#C9C6BD;line-height:1.4;}
  .news-item a:hover{color:var(--gold);}
  .news-tag{border-radius:var(--r-sm);padding:2px 7px;flex:0 0 auto;margin-top:1px;font-size:8px;letter-spacing:0.5px;}

  /* ---------- Queue / filters / table ---------- */
  .queue-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .queue-chip{border-radius:var(--r-lg);padding:6px 14px;border:var(--edge);background:var(--panel-2);font-size:11px;}
  .filter-tabs{display:flex;align-items:center;gap:8px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
  .filter-tab{border-radius:var(--r-lg);padding:9px 18px;cursor:pointer;background:var(--panel-2);border:var(--edge);font-size:11.5px;letter-spacing:1px;flex-shrink:0;min-height:40px;}
  .division-strip{display:flex;align-items:center;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
  .division-chip{border-radius:var(--r-sm);padding:5px 10px;cursor:pointer;font-size:9px;letter-spacing:0.3px;border:var(--edge);flex-shrink:0;min-height:30px;}
  .search-row{display:flex;gap:10px;margin-bottom:14px;}
  input.search{
    background:var(--panel-2);border:var(--edge);border-radius:var(--r-sm);color:var(--text);
    font-size:15px;padding:13px 16px;flex:1;box-shadow:var(--shadow-sm);
  }
  input.search:focus{outline:none;box-shadow:0 0 0 2px var(--gold);}

  .pool-table{border:var(--edge);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-lg);}
  .pool-table-scroll{overflow-x:auto;}
  .pool-grid{display:grid;grid-template-columns:1.8fr 0.9fr 0.8fr 0.8fr 0.6fr 0.6fr 0.8fr 0.8fr 0.6fr 0.8fr 0.8fr 0.9fr 1fr 0.5fr;min-width:1060px;}
  .pool-head{padding:12px 16px;background:var(--panel-3);border-bottom:1px solid var(--border-2);font-size:10px;letter-spacing:1px;color:#6A6A72;}
  button.pool-row-btn{all:unset;display:contents;cursor:pointer;}
  .pool-cell{padding:13px 16px;border-bottom:1px solid var(--border-2);font-size:13.5px;color:#C4C1B8;display:flex;align-items:center;}
  .pool-row-btn:hover .pool-cell{background:rgba(255,255,255,0.02);}
  .fname-cell{gap:10px;min-width:0;}
  .fname-cell .av{width:32px;height:32px;border-radius:50%;background:#1C1C20;border:var(--edge);flex:0 0 auto;}
  .divtag2{border-radius:var(--r-sm);padding:2px 7px;font-size:8px;letter-spacing:0.5px;width:fit-content;}
  .footnote{font-size:10px;letter-spacing:1px;color:var(--text-faint-2);margin-top:10px;}

  /* Card-ified pool list on phones: the 14-column grid becomes a stack of
     tappable fighter cards — name + photo up top, the handful of stats that
     actually help a quick decision (division, record, projected points,
     rating) as labeled chips below. Full per-stat columns stay on desktop,
     where there's room to actually read them. */
  @media (max-width:760px){
    .pool-table-scroll{overflow-x:visible;}
    .pool-grid{display:block;min-width:0;}
    .pool-head{display:none;}
    button.pool-row-btn{
      display:flex !important;flex-wrap:wrap;align-items:center;gap:6px 10px;
      background:var(--panel-2);border-radius:var(--r-sm);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);
    }
    .pool-cell{padding:0;border-bottom:none;font-size:13px;}
    .fname-cell{order:1;flex:1 1 100%;}
    .cell-rank{order:2;margin-left:auto;}
    .cell-star{order:3;}
    .cell-div, .cell-record, .cell-finishes, .cell-projfp{order:4;}
    .cell-sigstr, .cell-td, .cell-kd, .cell-ctrl, .cell-subatt, .cell-rev, .cell-tddef{display:none;}
    .pool-cell[data-label]::before{content:attr(data-label) " ";color:var(--text-faint-2);font-size:10px;letter-spacing:0.5px;margin-right:4px;}
  }

  /* ---------- Full Draft Board ---------- */
  .board-wrap{overflow-x:auto;padding:12px 0;-webkit-overflow-scrolling:touch;}
  .board-min{min-width:1280px;}
  .board-team-row{display:grid;gap:10px;margin-bottom:14px;}
  .board-team-cell{text-align:center;padding:10px 6px;border-radius:var(--r-sm);background:var(--panel);border:var(--edge);}
  .board-round-row{display:grid;gap:10px;margin-bottom:14px;align-items:center;}
  .board-round-lbl{display:flex;flex-direction:column;justify-content:center;padding-right:6px;}
  .board-cell{padding:12px 10px 10px;border-radius:var(--r-sm);min-height:108px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel);border:var(--edge);box-shadow:var(--shadow-sm);}
  .board-cell .oct{width:46px;height:46px;display:flex;align-items:center;justify-content:center;}
  .board-cell .nm{font-size:12px;font-weight:600;text-align:center;line-height:1.15;}
  .board-cell .tag{border-radius:var(--r-sm);padding:2px 8px;font-size:8px;letter-spacing:0.5px;}
  .board-hint{display:none;font-size:11px;color:var(--text-faint);margin-bottom:8px;}
  @media (max-width:760px){
    .board-hint{display:block;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="content"><div class="loading">Loading…</div></div>
</div>

<script>
const content = document.getElementById("content");
function esc(s){ return CombatAuth.escapeHtml(s); }

/* =========================================================================
   Dynasty draft engine — ported from combat-sync/netlify/functions/lib/draft-engine.js.
   Pure functions, no network calls. Operates on a purely local `picks` array
   (never touches draft_rooms/draft_picks) so this page runs with no sign-in.
   ========================================================================= */
const ROLES = {
  PRIMARY: { activeCap: 3, cageCap: 12 },
  STRIKER: { activeCap: 3, cageCap: 12 },
  GRAPPLER: { activeCap: 2, cageCap: 8 },
  FINISHER: { activeCap: 2, cageCap: 8 },
};
const ROLE_NAMES = Object.keys(ROLES);
const ACTIVE_SLOTS_PER_TEAM = Object.values(ROLES).reduce((s, r) => s + r.activeCap, 0); // 10
const CAGESIDE_SLOTS_PER_TEAM = Object.values(ROLES).reduce((s, r) => s + r.cageCap, 0); // 40
const TOTAL_SLOTS_PER_TEAM = ACTIVE_SLOTS_PER_TEAM + CAGESIDE_SLOTS_PER_TEAM; // 50

function snakeTeamForPick(teamOrder, pickNumber){
  const teamCount = teamOrder.length;
  const roundIndex0 = Math.floor((pickNumber - 1) / teamCount);
  const positionInRound0 = (pickNumber - 1) % teamCount;
  const reversed = roundIndex0 % 2 === 1;
  const position = reversed ? teamCount - 1 - positionInRound0 : positionInRound0;
  return teamOrder[position];
}
function roundNumberForPick(pickNumber, teamCount){
  return Math.floor((pickNumber - 1) / teamCount) + 1;
}
function getPhase(pickNumber, teamCount){
  const activePicks = ACTIVE_SLOTS_PER_TEAM * teamCount;
  const cagesidePicks = CAGESIDE_SLOTS_PER_TEAM * teamCount;
  if (pickNumber <= activePicks) {
    return { phase: "active", roundInPhase: Math.floor((pickNumber - 1) / teamCount) + 1, roundsInPhase: ACTIVE_SLOTS_PER_TEAM };
  }
  if (pickNumber <= activePicks + cagesidePicks) {
    const pwc = pickNumber - activePicks;
    return { phase: "cageside", roundInPhase: Math.floor((pwc - 1) / teamCount) + 1, roundsInPhase: CAGESIDE_SLOTS_PER_TEAM };
  }
  return { phase: "complete", roundInPhase: null, roundsInPhase: null };
}
function roleCountForTeam(picks, teamId, role, slotType){
  return picks.filter((p) => p.team_id === teamId && p.role === role && p.slot_type === slotType).length;
}
function isFighterTaken(picks, fighterId){
  return picks.some((p) => p.fighter_id === fighterId);
}
function validatePick(teamOrder, picks, proposed){
  const { teamId, fighterId, role } = proposed;
  const teamCount = teamOrder.length;
  const nextPickNumber = picks.length + 1;
  const base = { legal: false, reason: null };
  if (!ROLE_NAMES.includes(role)) return { ...base, reason: `"${role}" isn't a role` };
  const { phase } = getPhase(nextPickNumber, teamCount);
  if (phase === "complete") return { ...base, reason: "Draft complete" };
  const expectedTeam = snakeTeamForPick(teamOrder, nextPickNumber);
  if (teamId !== expectedTeam) return { ...base, reason: "Not this team's pick" };
  if (isFighterTaken(picks, fighterId)) return { ...base, reason: "Fighter already drafted" };
  const slotType = phase === "active" ? "active" : "cageside";
  const cap = phase === "active" ? ROLES[role].activeCap : ROLES[role].cageCap;
  const countSoFar = roleCountForTeam(picks, teamId, role, slotType);
  if (countSoFar >= cap) return { ...base, reason: `${role} is full for this phase` };
  return { legal: true, reason: null, pickNumber: nextPickNumber, roundNumber: roundNumberForPick(nextPickNumber, teamCount), phase, slotType, role, roleSlotNumber: countSoFar + 1 };
}
function openRoleSlots(picks, teamId){
  return ROLE_NAMES.map((role) => {
    const activeCount = roleCountForTeam(picks, teamId, role, "active");
    const cageCount = roleCountForTeam(picks, teamId, role, "cageside");
    return { role, activeOpen: ROLES[role].activeCap - activeCount, cageOpen: ROLES[role].cageCap - cageCount };
  });
}

};
const DIVISION_LIST = Object.keys(DIVISION_COLOR);
const ROLE_COLOR = { ALL: "var(--gold)", PRIMARY: "var(--gold)", STRIKER: "#E8C93A", GRAPPLER: "#1F6B3A", FINISHER: "var(--red)" };

function fmtCtrl(sec){
  if (sec === null || sec === undefined) return "—";
  const s = Math.round(sec);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function fmtPct(x){
  if (x === null || x === undefined) return "—";
  return `${Math.round(x * 100)}%`;
}
function fmtNum(x, d){
  if (x === null || x === undefined) return "—";
  return Number(x).toFixed(d === undefined ? 1 : d);
}
function fmtRecord(f){
  if (f.wins === null || f.wins === undefined || f.losses === null || f.losses === undefined) return "—";
  return `${f.wins}-${f.losses}-0`;
}

// Same "Standard Fight Points" weights used to score real leagues
// (combat-sync/netlify/functions/scoring.js) — applied here to each
// fighter's career per-fight averages to project a per-fight fantasy score.
// TD-defense bonus (0.5 pt per takedown defended) is estimated from
// td_def_pct against a league-average opponent-attempt rate, since the
// fighters table stores a per-fighter aggregate, not opponent-specific
// raw attempt counts.
const FANTASY_WEIGHTS = { sigStrike: 0.1, takedown: 2, knockdown: 8, controlMinute: 1, subAttempt: 1, reversal: 6, tdDefended: 0.5 };
const ASSUMED_OPP_TD_ATTEMPTS = 3;
function projectedFantasyPoints(f){
  if (!f) return null;
  const sig = Number(f.avg_sig_strikes) || 0;
  const td = Number(f.avg_takedowns) || 0;
  const kd = Number(f.avg_knockdowns) || 0;
  const ctrlMin = (Number(f.avg_control_seconds) || 0) / 60;
  const subAtt = Number(f.avg_sub_attempts) || 0;
  const rev = Number(f.avg_reversals) || 0;
  const tdDefBonus = (f.td_def_pct !== null && f.td_def_pct !== undefined)
    ? Number(f.td_def_pct) * ASSUMED_OPP_TD_ATTEMPTS * FANTASY_WEIGHTS.tdDefended
    : 0;
  return sig * FANTASY_WEIGHTS.sigStrike + td * FANTASY_WEIGHTS.takedown + kd * FANTASY_WEIGHTS.knockdown
    + ctrlMin * FANTASY_WEIGHTS.controlMinute + subAtt * FANTASY_WEIGHTS.subAttempt + rev * FANTASY_WEIGHTS.reversal
    + tdDefBonus;
}

// Which number a fighter is ranked by right now: the rank-based Overall
// Rating by default (derived from where a fighter ranks in projected
// fantasy points — never the raw internal Elo number), or that role's own
// stat-weighted score once that role is the active filter — same logic the
// real draft.html room and bots use.
function rankField(filterValue){
  if (filterValue === "STRIKER") return "striker_score";
  if (filterValue === "GRAPPLER") return "grappler_score";
  if (filterValue === "FINISHER") return "finisher_score";
  return null; // ALL / PRIMARY / a division — ranked by Overall Rating below
}
function rankValue(f, filterValue){
  const field = rankField(filterValue);
  if (field === null) {
    const v = overallRatingById[f.id];
    return (v === null || v === undefined) ? -Infinity : v;
  }
  const v = f[field];
  return (v === null || v === undefined) ? -Infinity : v;
}
function isDivisionFilter(v){ return DIVISION_LIST.includes(v); }

function rankedAvailable(filterValue, draftedIds){
  const divisionFilter = isDivisionFilter(filterValue);
  return fighters
    .filter((f) => !draftedIds[f.id])
    .filter((f) => !divisionFilter || f.announced_weight_class === filterValue)
    .slice()
    .sort((a, b) => rankValue(b, filterValue) - rankValue(a, filterValue));
}

async function loadFighterPool(){
  if (fighters.length || fighterPoolError) return;
  try {
    const { data, error } = await CombatAuth.client
      .from("fighters")
      .select("id, full_name, nickname, announced_weight_class, photo_url, current_rating, striker_score, grappler_score, finisher_score, wins, losses, finishes, avg_sig_strikes, avg_takedowns, avg_knockdowns, avg_control_seconds, avg_sub_attempts, avg_reversals, td_def_pct")
      .order("current_rating", { ascending: false })
      .limit(1000);
    if (error) throw error;
    fighters = data || [];
    fightersById = {};
    fighters.forEach((f) => { fightersById[f.id] = f; });

    // Overall Rating is a rank, not a score: sort everyone by projected
    // fantasy points, then scale each fighter's position in that order onto
    // a friendly 60-99 band (#1 overall = 99) — never the raw internal
    // rating number.
    projectedFPById = {};
    fighters.forEach((f) => { projectedFPById[f.id] = projectedFantasyPoints(f); });
    const byProjectedFP = fighters.slice().sort((a, b) => (projectedFPById[b.id] || 0) - (projectedFPById[a.id] || 0));
    overallRatingById = {};
    const n = byProjectedFP.length;
    byProjectedFP.forEach((f, idx) => {
      overallRatingById[f.id] = n > 1 ? Math.round(99 - (idx / (n - 1)) * 39) : 99;
    });
  } catch (err) {
    fighterPoolError = err.message || "Couldn't load fighters.";
  }
}
function fighterName(id){
  const f = fightersById[id];
  return f ? f.full_name : "Unknown fighter";
}
// Fills an octagon pick-tracker/board slot: the fighter's photo if we have
// one, clipped to the parent's octagon shape, else the generic silhouette.
function octagonAvatar(f, strokeColor, size){
  if (f && f.photo_url) {
    return `<img src="${esc(f.photo_url)}" style="width:100%;height:100%;object-fit:cover;" alt="">`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${strokeColor}" stroke-width="1.6"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>`;
}

/* ---------------- Draft setup / engine glue ---------------- */
const BOT_NAME_POOL = [
  "Iron Fist FC", "Submission Squad", "Knockout Kings", "Cage Rattlers West",
  "The Ground Game", "Takedown Titans", "Clinch City", "Southpaw Syndicate",
  "Phantom Punches", "The Scramble", "Guard Pullers Inc", "Buzzer Beaters",
];

function beginDraft(){
  teams = [];
  const userIndex = Math.floor(Math.random() * teamCount);
  const shuffledBotNames = BOT_NAME_POOL.slice().sort(() => Math.random() - 0.5);
  let botNameIdx = 0;
  for (let i = 0; i < teamCount; i++) {
    if (i === userIndex) {
      teams.push({ id: "user", name: userTeamName, photoUrl: userTeamPhotoUrl, isUser: true });
    } else {
      teams.push({ id: `bot-${i}`, name: shuffledBotNames[botNameIdx % shuffledBotNames.length] + (botNameIdx >= shuffledBotNames.length ? ` ${Math.floor(botNameIdx / shuffledBotNames.length) + 1}` : ""), photoUrl: null, isUser: false });
      botNameIdx++;
    }
  }
  userTeamId = "user";
  teamOrder = teams.map((t) => t.id);
  picks = [];
  started = false;
  selectedFighterId = null;
  selectedRole = null;
  activeFilter = "ALL";
  screen = "draft";
  render();
  loadNews();
}

function startDraft(){
  if (started) return;
  started = true;
  render();
  maybeRunBots();
}

function currentPickNumber(){ return picks.length + 1; }

function makeLocalPick(teamId, fighterId, role, isBot){
  const result = validatePick(teamOrder, picks, { teamId, fighterId, role });
  if (!result.legal) return result;
  picks.push({
    pick_number: result.pickNumber,
    round_number: result.roundNumber,
    team_id: teamId,
    fighter_id: fighterId,
    role,
    slot_type: result.slotType,
    is_autopick: !!isBot,
  });
  return result;
}

function bestOpenRoleForPhase(teamId, phase){
  const open = openRoleSlots(picks, teamId);
  const field = phase === "active" ? "activeOpen" : "cageOpen";
  const candidate = open.find((r) => r[field] > 0);
  return candidate ? candidate.role : null;
}

function botTakePick(teamId){
  const { phase } = getPhase(currentPickNumber(), teamOrder.length);
  if (phase === "complete") return false;
  const role = bestOpenRoleForPhase(teamId, phase);
  if (!role) return false;
  const taken = {};
  picks.forEach((p) => { taken[p.fighter_id] = true; });
  const best = rankedAvailable(role, taken)[0];
  if (!best) return false;
  const result = makeLocalPick(teamId, best.id, role, true);
  return result.legal;
}

function maybeRunBots(){
  clearTimeout(botTimer);
  const { phase } = getPhase(currentPickNumber(), teamOrder.length);
  if (phase === "complete") { screen = "complete"; render(); return; }
  const onClock = snakeTeamForPick(teamOrder, currentPickNumber());
  if (onClock === userTeamId) { render(); return; }
  botTimer = setTimeout(() => {
    botTakePick(onClock);
    maybeRunBots();
  }, 450);
}

function teamName(id){
  const t = teams.find((x) => x.id === id);
  return t ? t.name : id;
}
function teamInitials(id){
  if (id === userTeamId) return "YOU";
  const name = teamName(id);
  return name.split(/\s+/).map((w) => w[0]).join("").slice(0, 3).toUpperCase();
}

  const totalPicks = TOTAL_SLOTS_PER_TEAM * teamOrder.length;
  const draftComplete = pickNum > totalPicks;
  const onClockTeam = draftComplete ? null : snakeTeamForPick(teamOrder, pickNum);
  const isMyTurn = !draftComplete && onClockTeam === userTeamId;
  const showPickUI = started && isMyTurn && !draftComplete;
  const myOpenRoles = isMyTurn ? openRoleSlots(picks, userTeamId) : [];
  const phaseField = phase === "active" ? "activeOpen" : "cageOpen";
  const roundNumber = roundNumberForPick(Math.min(pickNum, totalPicks), teamOrder.length);

  const draftedIds = {};
  picks.forEach((p) => { draftedIds[p.fighter_id] = true; });

  const available = rankedAvailable(activeFilter, draftedIds);
  const manualTarget = (showPickUI && selectedFighterId && !draftedIds[selectedFighterId]) ? fightersById[selectedFighterId] : null;
  const spotlight = showPickUI ? (manualTarget || available[0]) : null;
  const isManualPick = !!manualTarget;

  /* ---- Octagon pick tracker: sliding window of 8 picks around current ---- */
  const feedByPick = {};

  let trackerHtml = "";
  for (let n = windowStart; n <= windowEnd; n++) {
    const team = snakeTeamForPick(teamOrder, n);
    const entry = feedByPick[n];
    const teamColor = team === userTeamId ? "var(--gold)" : "#6A6A72";

          </div>

              </div>
              <div class="h-font" style="font-size:12px;letter-spacing:1px;color:#9A9AA2;margin-top:4px;">${esc(spotlight.announced_weight_class || "")} &middot; ${fmtRecord(spotlight)} &middot; ${spotlight.finishes ?? 0} FINISHES</div>

            ${tapeRows.map((r) => `<div class="tape-row"><div class="a">${esc(r.a)}</div><div class="lbl">${esc(r.label)}</div><div class="b">${esc(r.b)}</div></div>`).join("")}

              <div class="h-font" style="font-size:11px;letter-spacing:1px;color:var(--gold);">${esc(spotlight.full_name.toUpperCase())} (AVAILABLE)</div>
              <div></div>
              <div class="h-font" style="font-size:11px;letter-spacing:1px;color:#6A6A72;text-align:right;">${lastOwnPick ? esc(lastOwnPick.full_name.toUpperCase()) + " (YOUR LAST PICK)" : "NO PRIOR PICK"}</div>
            </div>
          </div>

      <div class="role-pills">

          const open = r[phaseField];
          const isFull = open <= 0;
          const isActive = r.role === selectedRole;
          const rc = ROLE_COLOR[r.role] || "var(--gold)";
          let style = "color:#9A9AA2;";
          if (isFull) style = "color:#4A4A52;background:#161618;border-color:#242428;opacity:0.6;cursor:not-allowed;";

      </button>

    `;
  } else if (started && draftComplete) {
    stageMainHtml = `
      <div class="spotlight-card" style="border-color:var(--gold);text-align:center;justify-content:center;">
        <div style="width:100%;">
          <div class="h-font" style="font-size:22px;font-weight:700;letter-spacing:2px;color:var(--gold);">DRAFT COMPLETE</div>

    stageMainHtml = `<div class="spotlight-card" style="justify-content:center;"><div class="h-font" style="font-size:13px;letter-spacing:1px;color:#9A9AA2;">Waiting on ${esc(teamName(onClockTeam))}…</div></div>`;
  }

  /* ---- Your slip ---- */
  const filled = { PRIMARY: [], STRIKER: [], GRAPPLER: [], FINISHER: [] };
  picks.filter((p) => p.team_id === userTeamId && p.slot_type === "active").forEach((p) => filled[p.role].push(p));
  let slipHtml = "";
  let projectedTotal = 0;
  ROLE_NAMES.forEach((role, ri) => {
    const cap = ROLES[role].activeCap;
    const have = filled[role];
    slipHtml += `<div class="slip-group" style="${ri === 0 ? "" : "border-top:1px solid var(--border-2);"}"><span class="h-font" style="font-size:10px;letter-spacing:2px;color:${ROLE_COLOR[role]};">${role}</span><span class="h-font" style="font-size:9px;letter-spacing:1px;color:#4A4A52;">${cap} SLOT${cap > 1 ? "S" : ""}</span></div>`;
    for (let i = 0; i < cap; i++) {
      const p = have[i];
      const f = p ? fightersById[p.fighter_id] : null;
      const isPending = !p && showPickUI && role === selectedRole && i === have.length && spotlight;
      if (f) {
        const dc = DIVISION_COLOR[f.announced_weight_class] || "var(--gold)";
        const pts = fmtNum(projectedFPById[f.id], 1);
        projectedTotal += Number(projectedFPById[f.id]) || 0;
        slipHtml += `<div class="slip-row"><div style="display:flex;align-items:center;gap:8px;min-width:0;"><div class="divtag2" style="background:${dc}2A;color:${dc};">${esc(DIV_SHORT[f.announced_weight_class] || "")}</div><div class="h-font" style="font-size:14px;font-weight:600;">${esc(f.full_name)}</div></div><div class="h-font" style="font-size:14px;font-weight:700;color:var(--text);">${pts}</div></div>`;
      } else if (isPending) {
        const dc = DIVISION_COLOR[spotlight.announced_weight_class] || "var(--gold)";
        slipHtml += `<div class="slip-row"><div style="display:flex;align-items:center;gap:8px;min-width:0;"><div class="divtag2" style="background:${dc}2A;color:${dc};">${esc(DIV_SHORT[spotlight.announced_weight_class] || "")}</div><div class="h-font" style="font-size:14px;font-weight:600;color:var(--red);">${esc(spotlight.full_name)} (PENDING)</div></div><div class="h-font" style="font-size:14px;font-weight:700;">${fmtNum(projectedFPById[spotlight.id], 1)}</div></div>`;
      } else {
        slipHtml += `<div class="slip-row"><div class="h-font" style="font-size:14px;color:#5A5A62;">Empty slot</div><div class="h-font" style="font-size:14px;color:#5A5A62;">--</div></div>`;
      }
    }
  });

  /* ---- Live draft feed ---- */
  const feedHtml = picks.slice().reverse().slice(0, 12).map((p) => {
    const f = fightersById[p.fighter_id];
    return `<div class="feed-item"><div class="h-font" style="font-size:11px;color:#5A5A62;flex:0 0 auto;">#${p.pick_number}</div><div class="h-font" style="font-size:13px;color:#C9C6BD;"><span style="color:var(--gold);">${esc(teamInitials(p.team_id))}</span> took ${esc(f ? f.full_name : "?")} <span style="color:#6A6A72;">(${esc(f ? (DIV_SHORT[f.announced_weight_class] || "") : "")})</span></div></div>`;
  }).join("") || `<div style="color:var(--text-faint);font-size:12.5px;padding:12px 0;">No picks yet.</div>`;

  /* ---- League news — real articles, roster-relevant ones first ---- */
  const myFighterIds = new Set(picks.filter((p) => p.team_id === userTeamId).map((p) => p.fighter_id));
  const relevant = newsItems.filter((it) => (it.fighters || []).some((mf) => myFighterIds.has(mf.id)));
  const newsToShow = (relevant.length ? relevant : newsItems).slice(0, 4);
  const newsHtml = !newsLoaded
    ? `<div style="color:var(--text-faint);font-size:12.5px;padding:12px 0;">Loading news…</div>`
    : (newsToShow.length ? newsToShow.map((it) => `
        <div class="news-item">
          <div class="news-tag" style="background:#242428;color:#B8B5AD;">${esc((it.sport || "NEWS").toUpperCase())}</div>
          <a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>
        </div>
      `).join("") : `<div style="color:var(--text-faint);font-size:12.5px;padding:12px 0;">No news yet.</div>`);

  /* ---- Ranked next queue ---- */
  const queueSource = available.slice(spotlight ? 1 : 0, spotlight ? 4 : 3);
  const queueHtml = queueSource.map((f, i) => `
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="queue-chip" style="${i === 0 ? "background:rgba(212,175,55,0.12);border-color:var(--gold);color:var(--gold);" : "background:#16161A;color:#9A9AA2;"}">${esc(f.full_name)}</div>
      ${i < queueSource.length - 1 ? `<span style="color:#3A3A40;font-size:13px;">&rarr;</span>` : ""}
    </div>
  `).join("");

  /* ---- Filter tabs + division strip ---- */
  const filterTabsHtml = FILTER_TABS.map((r) => {
    const active = r === activeFilter;
    const rc = ROLE_COLOR[r] || "var(--gold)";
    return `<button class="filter-tab" data-filter="${r}" style="${active ? `background:${rc}22;border-color:${rc};color:${rc};font-weight:700;` : "color:#9A9AA2;"}">${esc(r)}</button>`;
  }).join("");
  const divisionStripHtml = DIVISION_LIST.map((d) => {
    const active = d === activeFilter;
    const dc = DIVISION_COLOR[d];
    return `<button class="division-chip" data-filter="${esc(d)}" style="${active ? `background:${dc}33;border-color:${dc};color:${dc};font-weight:700;` : `background:${dc}14;color:#9A9AA2;`}">${esc(DIV_SHORT[d] || d)}</button>`;
  }).join("");

  const poolHeading = isDivisionFilter(activeFilter)
    ? `${activeFilter.toUpperCase()} · RANKED BY OVERALL RATING`
    : activeFilter === "ALL" ? "ALL ROLES · RANKED BY OVERALL RATING"
    : activeFilter === "PRIMARY" ? "PRIMARY · RANKED BY OVERALL RATING"
    : `${activeFilter} · RANKED BY ${activeFilter} SCORE`;
  const rankColLabel = isDivisionFilter(activeFilter) || activeFilter === "ALL" || activeFilter === "PRIMARY"
    ? "OVERALL RATING" : `${activeFilter} SCORE`;

  const existingSearchInput = document.getElementById("fighterSearch");
  const filterVal = existingSearchInput ? existingSearchInput.value : "";
  // Capture focus/cursor BEFORE the innerHTML swap below destroys this node,
  // so typing doesn't lose focus after every keystroke (previously the new
  // input rendered unfocused, so only one letter could be typed at a time).
  const searchWasFocused = !!existingSearchInput && document.activeElement === existingSearchInput;
  const searchSelStart = searchWasFocused ? existingSearchInput.selectionStart : null;
  const searchSelEnd = searchWasFocused ? existingSearchInput.selectionEnd : null;
  const searched = filterVal
    ? available.filter((f) => f.full_name.toLowerCase().includes(filterVal.toLowerCase()))
    : available;
  const poolRows = searched.slice(0, 60).map((f) => {
    const dc = DIVISION_COLOR[f.announced_weight_class] || "var(--gold)";
    const isSpotlight = !!spotlight && f.id === spotlight.id;
    const rv = rankValue(f, activeFilter);
    const hl = isSpotlight ? "background:rgba(212,175,55,0.06);" : "";
    return `
      <button class="pool-row-btn" data-fighter-id="${f.id}" ${showPickUI ? "" : "disabled"}>
        <div style="${hl}" class="pool-cell fname-cell"><div class="av" style="overflow:hidden;">${f.photo_url ? `<img src="${esc(f.photo_url)}" style="width:100%;height:100%;object-fit:cover;" alt="">` : ""}</div><span class="h-font" style="font-size:14px;font-weight:600;color:${isSpotlight ? "var(--gold)" : "var(--text)"};">${esc(f.full_name)}</span></div>
        <div style="${hl}" class="pool-cell cell-div"><div class="divtag2" style="background:${dc}2A;color:${dc};">${esc(DIV_SHORT[f.announced_weight_class] || "")}</div></div>
        <div style="${hl}" class="pool-cell cell-record" data-label="REC">${esc(fmtRecord(f))}</div>
        <div style="${hl}" class="pool-cell cell-sigstr">${esc(fmtNum(f.avg_sig_strikes))}</div>
        <div style="${hl}" class="pool-cell cell-td">${esc(fmtNum(f.avg_takedowns))}</div>
        <div style="${hl}" class="pool-cell cell-kd">${esc(fmtNum(f.avg_knockdowns, 2))}</div>
        <div style="${hl}" class="pool-cell cell-ctrl">${esc(fmtCtrl(f.avg_control_seconds))}</div>
        <div style="${hl}" class="pool-cell cell-subatt">${esc(fmtNum(f.avg_sub_attempts))}</div>
        <div style="${hl}" class="pool-cell cell-rev">${esc(fmtNum(f.avg_reversals, 2))}</div>
        <div style="${hl}" class="pool-cell cell-tddef">${esc(fmtPct(f.td_def_pct))}</div>
        <div style="${hl}" class="pool-cell cell-finishes" data-label="FIN">${f.finishes ?? "—"}</div>
        <div style="${hl}" class="pool-cell cell-projfp" data-label="PROJ FP">${fmtNum(projectedFPById[f.id], 1)}</div>
        <div style="${hl}" class="pool-cell cell-rank"><span class="h-font" style="font-size:17px;font-weight:700;color:var(--gold);">${rv === -Infinity ? "—" : fmtNum(rv, 0)}</span></div>
        <div style="${hl}" class="pool-cell cell-star">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="${isSpotlight ? "var(--gold)" : "none"}" stroke="${isSpotlight ? "var(--gold)" : "#4A4A52"}" stroke-width="1.5"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2l-5-4.9 6.9-1L12 2z"></path></svg>
        </div>
      </button>
    `;
  }).join("");

  content.innerHTML = `
    <div class="dr-header">
      <div class="dr-header-left">
        <div class="h-font" style="font-size:22px;font-weight:700;letter-spacing:1px;color:var(--gold);">COMBAT</div>

        <div class="h-font dr-header-subtitle" style="font-size:15px;letter-spacing:2px;color:#9A9AA2;">DIVISIONAL DYNASTY DRAFT</div>

            <div class="h-font" style="font-size:10px;letter-spacing:1.5px;color:var(--gold);margin-top:2px;">${draftComplete ? "DRAFT COMPLETE" : isMyTurn ? "YOUR PICK" : "PICK " + pickNum + " OF " + totalPicks}</div>
          </div>
          <div class="vrule"></div>
          <div class="status-right">
            <div class="lbl">ON THE CLOCK</div>

          </div>

          <div class="slip-list">${slipHtml}</div>
          <div class="slip-foot">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div class="h-font" style="font-size:12px;letter-spacing:2px;color:#9A9AA2;">PROJECTED FANTASY PTS</div>
              <div class="h-font" style="font-size:24px;font-weight:700;color:var(--gold);">${fmtNum(projectedTotal, 1)}</div>

            <div class="h-font" style="font-size:10px;letter-spacing:1px;color:#4A4A52;margin-top:6px;">+ ${CAGESIDE_SLOTS_PER_TEAM} CAGE SIDE PICKS TO FOLLOW</div>
          </div>
        </div>

        <div class="side-card">
          <div class="side-card-head"><div style="width:7px;height:7px;border-radius:50%;background:var(--red);"></div><div class="h-font" style="font-size:12px;letter-spacing:2px;color:#9A9AA2;">LIVE DRAFT FEED</div></div>
          <div class="side-card-body">${feedHtml}</div>
        </div>

        <div class="side-card">
          <div class="side-card-head">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><path d="M4 4h16v16H4z"></path><path d="M8 8h8M8 12h8M8 16h4"></path></svg>
            <div class="h-font" style="font-size:12px;letter-spacing:2px;color:#9A9AA2;">LEAGUE NEWS</div>
          </div>
          <div class="side-card-body">${newsHtml}</div>
        </div>
      </div>
    </div>

    <div>
      <div class="queue-row"><div class="h-font" style="font-size:11px;letter-spacing:2px;color:#7A7A82;">RANKED NEXT</div>${queueHtml}</div>
      <div class="search-row"><input class="search" id="fighterSearch" placeholder="Search fighters…" value="${esc(filterVal)}"></div>
      <div class="filter-tabs">${filterTabsHtml}</div>
      <div class="division-strip">${divisionStripHtml}</div>
      <div class="h-font" style="font-size:12px;letter-spacing:2px;color:#7A7A82;margin-bottom:12px;">AVAILABLE &mdash; ${esc(poolHeading)}</div>
      <div class="pool-table">
        <div class="pool-table-scroll">
          <div class="pool-grid">
            <div class="pool-head">FIGHTER</div><div class="pool-head">DIV</div><div class="pool-head">RECORD</div>
            <div class="pool-head">SIG STR</div><div class="pool-head">TD</div><div class="pool-head">KD</div>
            <div class="pool-head">CTRL</div><div class="pool-head">SUB ATT</div><div class="pool-head">REV</div>
            <div class="pool-head">TD DEF</div><div class="pool-head">FINISHES</div>
            <div class="pool-head">PROJ FP</div>
            <div class="pool-head" style="color:var(--gold);">${esc(rankColLabel)}</div><div class="pool-head">★</div>
            ${poolRows}
          </div>
        </div>
      </div>
      <div class="footnote">STATS SHOWN ARE PER-FIGHT CAREER AVERAGES FROM SYNCED FIGHT DATA &middot; SIG STR = SIGNIFICANT STRIKES LANDED &middot; TD = TAKEDOWNS LANDED &middot; KD = KNOCKDOWNS &middot; CTRL = CONTROL TIME &middot; FINISHES = CAREER KO/TKO + SUBMISSION WINS &middot; ★ = CURRENTLY SPOTLIGHTED</div>
    </div>
  `;

  document.getElementById("boardLinkBtn").addEventListener("click", () => { screen = "board"; render(); });

  const startBtn = document.getElementById("startDraftBtn");
  if (startBtn) startBtn.addEventListener("click", startDraft);

  const clearBtn = document.getElementById("clearSelectedBtn");
  if (clearBtn) clearBtn.addEventListener("click", () => { selectedFighterId = null; render(); });

  document.querySelectorAll(".pool-row-btn").forEach((btn) => {
    if (btn.disabled) return;
    btn.addEventListener("click", () => { selectedFighterId = btn.dataset.fighterId; render(); });
  });

  const searchInput = document.getElementById("fighterSearch");
  if (searchInput) {
    searchInput.addEventListener("input", render);
    if (searchWasFocused) {
      searchInput.focus();
      searchInput.setSelectionRange(searchSelStart, searchSelEnd);
    }
  }

  document.querySelectorAll(".filter-tab, .division-chip").forEach((btn) => {
    btn.addEventListener("click", () => { activeFilter = btn.dataset.filter; render(); });
  });

  document.querySelectorAll(".role-pill").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.disabled) return;
      selectedRole = btn.dataset.role;
      render();
    });
  });

  const lockBtn = document.getElementById("lockBtn");
  if (lockBtn) {
    lockBtn.addEventListener("click", () => {
      if (!selectedRole) return;
      const errBox = document.getElementById("pickError");
      const target = manualTarget || available[0];
      if (!target) return;
      const result = makeLocalPick(userTeamId, target.id, selectedRole, false);
      if (!result.legal) {
        errBox.textContent = result.reason || "That pick isn't legal.";
        errBox.style.display = "block";
        return;
      }
      selectedFighterId = null;
      selectedRole = null;
      maybeRunBots();
    });
  }
}

/* ---------------- Full Draft Board ---------------- */
function renderBoard(){
  const cols = teamOrder.length;
  const teamHeaderHtml = teamOrder.map((tid) => `
    <div class="board-team-cell" style="${tid === userTeamId ? "background:rgba(212,175,55,0.12);border-color:var(--gold);" : ""}">
      <div class="h-font" style="font-size:13px;font-weight:700;color:${tid === userTeamId ? "var(--gold)" : "#C9C6BD"};">${esc(teamInitials(tid))}</div>
      ${tid === userTeamId ? `<div class="h-font" style="font-size:9px;letter-spacing:1px;color:var(--gold);margin-top:2px;">YOUR TEAM</div>` : ""}
    </div>
  `).join("");

  const picksByRoundTeam = {};
  picks.forEach((p) => { picksByRoundTeam[`${p.round_number}:${p.team_id}`] = p; });
  const currentPick = currentPickNumber();
  const totalRounds = TOTAL_SLOTS_PER_TEAM;
  const maxRoundToShow = Math.min(totalRounds, Math.max(5, roundNumberForPick(currentPick, cols) + 2));

  let roundsHtml = "";
  for (let round = 1; round <= maxRoundToShow; round++) {
    let cellsHtml = "";
    teamOrder.forEach((tid) => {
      const p = picksByRoundTeam[`${round}:${tid}`];
      const pickNumberForCell = (round - 1) * cols + (1 + teamOrder.indexOf(snakeTeamForPick(teamOrder, (round - 1) * cols + 1) === tid ? 0 : 0));
      // Determine if this cell is the current on-the-clock cell
      let isCurrentCell = false;
      for (let n = (round - 1) * cols + 1; n <= round * cols; n++) {
        if (n === currentPick && snakeTeamForPick(teamOrder, n) === tid) { isCurrentCell = true; break; }
      }
      if (p) {
        const f = fightersById[p.fighter_id];
        const dc = (f && DIVISION_COLOR[f.announced_weight_class]) || "var(--gold)";
        cellsHtml += `
          <div class="board-cell">
            <div class="oct" style="clip-path:polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);background:#1C1C20;border:2px solid ${dc};overflow:hidden;">
              ${octagonAvatar(f, dc, 20)}
            </div>
            <div class="nm">${esc(f ? f.full_name : "?")}</div>
            <div class="tag" style="background:${dc}2A;color:${dc};">${esc(f ? (DIV_SHORT[f.announced_weight_class] || "") : "")}</div>
          </div>
        `;
      } else if (isCurrentCell && started) {
        cellsHtml += `
          <div class="board-cell" style="background:rgba(226,40,60,0.08);border-color:var(--red);">
            <div class="oct" style="clip-path:polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);background:rgba(226,40,60,0.15);border:2px solid var(--red);box-shadow:0 0 0 4px rgba(226,40,60,0.12);">
              <span class="h-font" style="font-size:16px;font-weight:700;color:var(--red);">?</span>
            </div>
            <div class="nm" style="color:var(--red);">On the clock</div>
          </div>
        `;
      } else {
        cellsHtml += `<div class="board-cell" style="background:transparent;border:1px dashed #202024;"><div class="oct" style="clip-path:polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);border:1px dashed #2A2A30;"></div><div class="nm" style="color:#3A3A40;">Empty</div></div>`;
      }
    });
    roundsHtml += `
      <div class="board-round-row" style="grid-template-columns:90px repeat(${cols}, 1fr);">
        <div class="board-round-lbl"><div class="h-font" style="font-size:10px;letter-spacing:1.5px;color:#6A6A72;">ROUND</div><div class="h-font" style="font-size:24px;font-weight:700;color:#4A4A52;">${round}</div></div>
        ${cellsHtml}
      </div>
    `;
  }

  content.innerHTML = `
    <div class="dr-header">
      <div class="dr-header-left">
        <div class="h-font" style="font-size:22px;font-weight:700;letter-spacing:1px;color:var(--gold);">COMBAT</div>
        <div class="vrule"></div>
        <div class="h-font" style="font-size:15px;letter-spacing:2px;color:#9A9AA2;">FULL DRAFT BOARD</div>
      </div>
      <button class="board-link h-font" id="backToRoomBtn" style="font-size:11px;letter-spacing:2px;">&larr; BACK TO LIVE ROOM</button>
    </div>
    <div class="board-hint">Swipe sideways to see every team &rarr;</div>
    <div class="board-wrap">
      <div class="board-min">
        <div class="board-team-row" style="grid-template-columns:90px repeat(${cols}, 1fr);"><div></div>${teamHeaderHtml}</div>
        ${roundsHtml}
      </div>
    </div>
  `;
  document.getElementById("backToRoomBtn").addEventListener("click", () => { screen = "draft"; render(); });
}

/* ---------------- Complete ---------------- */
function renderComplete(){
  const myPicks = picks.filter((p) => p.team_id === userTeamId);
  const grouped = ROLE_NAMES.map((role) => {
    const roleP = myPicks.filter((p) => p.role === role);
    return `
      <div class="roster-role">
        <span class="rname">${esc(role)}</span>
        <span class="rfill">${roleP.length} drafted</span>
      </div>
    `;
  }).join("");
  const topPicks = myPicks.slice(0, 10).map((p) => `
    <div class="feed-row">
      <div><span class="fname">${esc(fighterName(p.fighter_id))}</span> <span class="meta">${esc(p.role)}</span></div>
      <div class="meta">#${p.pick_number}</div>
    </div>
  `).join("");

  content.innerHTML = `
    <div class="lobby" style="max-width:560px;">
      <div class="octagon" style="width:60px;height:60px;background:var(--gold);"></div>
      <div>
        <div class="h-font" style="font-size:20px;font-weight:700;letter-spacing:2px;color:var(--gold);">DRAFT COMPLETE</div>
        <div style="font-size:13px;color:var(--text-dim);margin-top:8px;">${esc(userTeamName)} drafted a full ${TOTAL_SLOTS_PER_TEAM}-fighter Dynasty roster against ${teamCount - 1} bots.</div>
      </div>
      <div class="roster-card" style="width:100%;text-align:left;">${grouped}</div>
      <div style="width:100%;">
        <div class="h-font" style="font-size:11px;letter-spacing:2px;color:var(--text-faint);margin-bottom:8px;text-align:left;">YOUR FIRST 10 PICKS</div>
        <div class="feed-card" style="margin-top:0;">${topPicks}</div>
      </div>
      <div class="share-row">
        <button class="ghost" id="draftAgainBtn">DRAFT AGAIN</button>
        <a href="login.html"><button class="cta">CREATE A REAL LEAGUE</button></a>
      </div>
    </div>
  `;
  document.getElementById("draftAgainBtn").addEventListener("click", () => {
    screen = "setup";
    picks = [];
    render();
  });
}

/* ---------------- Router ---------------- */
function render(){
  if (screen === "landing") return renderLanding();
  if (screen === "setup") return renderSetup();
  if (screen === "draft") return renderDraft();
  if (screen === "board") return renderBoard();
  if (screen === "complete") return renderComplete();
}

render();
</script>
</body>
</html>
