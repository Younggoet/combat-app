<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Combat</title>
<meta name="description" content="Fantasy combat sports. Draft real fighters and score every fight from real stats.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1124">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<style>html,body{margin:0;background:#0A1124}#app{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<script src="dc-runtime.js"></script>
<script>
(async function(){
  var todayStr=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  var fmt=function(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})};
  var last=function(n){return (n||'').trim().split(/\s+/).slice(-1)[0]};
  /* real upcoming cards -> the home slideshow */
  var slides=[];
  try{
    var sb=window.CombatAuth&&window.CombatAuth.client;
    if(sb){
      var r=await sb.from('bouts').select('id,event_name,bout_date,bout_order,is_title_fight,status,fighter_a,fighter_b').gte('bout_date',todayStr()).in('status',['scheduled','confirmed','rumored','live']).order('bout_date',{ascending:true}).limit(200);
      var bouts=r.data||[],ids=[];bouts.forEach(function(b){ids.push(b.fighter_a,b.fighter_b)});ids=Array.from(new Set(ids));var F={};
      for(var i=0;i<ids.length;i+=80){var q=await sb.from('fighters').select('id,full_name,announced_weight_class').in('id',ids.slice(i,i+80));(q.data||[]).forEach(function(f){F[f.id]=f})}
      var map={};
      bouts.forEach(function(b){if(!F[b.fighter_a]||!F[b.fighter_b])return;var k=b.bout_date+'|'+b.event_name;(map[k]=map[k]||{name:b.event_name,date:b.bout_date,bouts:[]}).bouts.push(b)});
      Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.date<b.date?-1:1}).slice(0,6).forEach(function(ev){
        var sc=function(x){var A=F[x.fighter_a],B=F[x.fighter_b],s=x.is_title_fight?1000:0,en=(ev.name||'').toLowerCase();if(en.indexOf(last(A.full_name).toLowerCase())>-1)s+=250;if(en.indexOf(last(B.full_name).toLowerCase())>-1)s+=250;if(x.bout_order!=null)s+=100-x.bout_order;return s};
        ev.bouts.sort(function(a,b){return sc(b)-sc(a)});
        var m=ev.bouts[0],A=F[m.fighter_a],B=F[m.fighter_b],wc=A.announced_weight_class||B.announced_weight_class||'';
        slides.push({k:'UFC',kicker:(ev.name||'UFC').toUpperCase(),title:last(A.full_name)+' vs '+last(B.full_name),sub:fmt(ev.date)+' · '+(m.is_title_fight?'Title fight':wc?wc+' main event':'Main event'),c:'#FF3B4E',c2:'#FF8A5B'});
      });
    }
  }catch(e){slides=[]}
  window.__SLIDES=slides;
  window.__PUBLIC=[];
  try{var sb2=window.CombatAuth&&window.CombatAuth.client;if(sb2){var pr=await sb2.from('leagues').select('id,name,team_count,teams(id)').eq('is_public',true).eq('archived',false).eq('status','setup').not('team_count','is',null).order('created_at',{ascending:false}).limit(6);
    window.__PUBLIC=(pr.data||[]).map(function(l){return {name:l.name,meta:'Card Redraft \u00b7 '+((l.teams||[]).length)+'/'+l.team_count+' teams'}})}}catch(e){}
  /* signed-in players with a Combat username: their leagues on the homepage */
  var ME={signedIn:false,label:'SIGN IN',leagues:[],signGo:function(){location.href='login.html?redirect=index.html'},create:function(){location.href='league.html?create=1'},join:function(){location.href='league.html?lobby=1'},viewAll:function(){location.href='league.html'},open:function(l){location.href='league.html?open='+encodeURIComponent(l.id)}};
  try{
    var A=window.CombatAuth,u=A&&await A.getUser();
    if(u){
      ME.userId=u.id;ME.label='MY LEAGUES';ME.signGo=function(){location.href='league.html'};
      var prof=await A.getProfile(u.id);
      if(prof&&prof.display_name){
        ME.signedIn=true;
        try{var pr2=await A.client.from('profiles').select('display_name,avatar_shape,avatar_color,avatar_url').eq('id',u.id).single();var d=pr2.data||{};ME.profile={name:d.display_name||prof.display_name,shape:d.avatar_shape||'octagon',color:d.avatar_color||'#FF3B4E',photo:d.avatar_url||''}}catch(e){ME.profile={name:prof.display_name,shape:'octagon',color:'#FF3B4E',photo:''}}
        var sb3=A.client,tr=await sb3.from('teams').select('id,league_id,leagues!inner(*)').eq('owner_user_id',u.id);
        var ls=((tr.data||[]).map(function(r){return r.leagues})).filter(function(l){return l.team_count&&!l.archived}).sort(function(x,y){return y.created_at.localeCompare(x.created_at)});
        var ids=ls.map(function(l){return l.id}),cnt={};
        if(ids.length){var tc=await sb3.from('teams').select('league_id').in('league_id',ids);(tc.data||[]).forEach(function(x){cnt[x.league_id]=(cnt[x.league_id]||0)+1})}
        ME.leagues=ls.map(function(l){return {id:l.id,name:l.name,meta:'Card Redraft \u00b7 '+(l.status==='setup'?'Setting up':l.status==='drafting'?'Drafting':'In season')+' \u00b7 '+(cnt[l.id]||1)+'/'+l.team_count+' teams',when:l.draft_time?'Draft '+new Date(l.draft_time).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Draft time not set'}});
      }
    }
  }catch(e){}
  /* Me tab: profile shape, color, photo, username */
  (function(){
    var A=window.CombatAuth;
    var needSignIn=function(){location.href='login.html?redirect=index.html';return new Promise(function(){})};
    ME.saveProfile=needSignIn;ME.upload=needSignIn;
    if(!A||!ME.userId)return;
    ME.upload=function(file){return new Promise(function(res,rej){
      var img=new Image(),url=URL.createObjectURL(file);
      img.onerror=function(){rej(new Error('That file is not an image'))};
      img.onload=function(){var m=512,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(async function(b){try{var path=ME.userId+'/profile.jpg',up=await A.client.storage.from('team-photos').upload(path,b,{upsert:true,contentType:'image/jpeg'});if(up.error)throw up.error;
          res(A.client.storage.from('team-photos').getPublicUrl(path).data.publicUrl+'?t='+Date.now())}catch(e){rej(e)}},'image/jpeg',.88)};
      img.src=url})};
    ME.saveProfile=async function(p){
      var n=(p.name||'').trim().replace(/\s+/g,' ');
      if(n.length<2)throw new Error('Use at least 2 characters for your username');
      var r=await A.client.from('profiles').upsert({id:ME.userId,display_name:n,avatar_shape:p.shape,avatar_color:p.color,avatar_url:p.photo||null},{onConflict:'id'});
      if(r.error)throw new Error("Could not save your profile");
      return 'Profile saved'};
  })();
  window.__ME=ME;
  var desk=window.matchMedia('(min-width:900px)').matches;
  var CREATE="(location.href='league.html?create=1')",LOBBY="(location.href='league.html?lobby=1')";
  function patch(s){
    s=s.replace(/const SLIDES = \[[\s\S]*?\n    \];/,"const SLIDES = (window.__SLIDES&&window.__SLIDES.length)?window.__SLIDES:[{k:'UFC',kicker:'UFC',title:'Cards are being booked',sub:'Fights show up here once they are announced',c:'#FF3B4E',c2:'#FF8A5B'}];");
    s=s.replace(/(name:'(?:Bayou Brawlers|Octagon Alley|Late Stoppage Club)'[^\n]*?pick:\s*\(\)\s*=>\s*)this\.setState\(\{\s*page:\s*'username'\s*\}\)/g,'$1'+LOBBY);
    s=s.replace(/cur\.leagues \? \[[\s\S]*?\] : \[\];/,"cur.leagues ? (window.__PUBLIC||[]).map(l => ({ name:l.name, meta:l.meta, pick:() => "+LOBBY+" })) : [];");
    s=s.replace("kicker:'UFC FIGHT NIGHT · DOHA'","kicker:((window.__SLIDES||[])[0]||{kicker:'UFC'}).kicker").replace("title:'Prochazka vs Stirling'","title:((window.__SLIDES||[])[0]||{title:'Cards are being booked'}).title").replace("sub:'Light heavyweight main event · Block 1 card'","sub:((window.__SLIDES||[])[0]||{sub:''}).sub").replace("status:'Block 1 scoring live Saturday'","status:'Next card'");
    s=s.replace(/this\.setState\(\{\s*page:\s*'username'\s*\}\)/g,CREATE);
    s=s.replace(/go: \(\) => \{\}/g,"go: () => { if (k === 'ufc') "+CREATE+"; }");
    return s;
  }
  var inst=await DCRuntime.mount({url:desk?'mock/Desktop.dc.html':'mock/Main.dc.html',root:document.getElementById('app'),patch:patch,patchText:function(t){return t.replace(/<div style="font-size:13px;color:#E8F0FF;padding:10px 12px;background:rgba\(44,230,255,\.08\)[^>]*>[^<]*<\/div>/g,'')}});
  /* the design files are fixed-size boards; here they fill the screen */
})();
</script>
<script src="auto-refresh.js"></script>
</body>
</html>
