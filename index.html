<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combat — Mock Draft</title>
<meta name="description" content="Try Combat's mock draft — real fighters, real ratings, no sign-in required.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0B0D">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D; --panel:#141417; --panel-2:#1A1A1E; --border:#242428;
    --text:#F5F2EA; --text-dim:#9A9AA2; --text-faint:#5A5A62; --gold:#D4AF37; --red:#E2283C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Barlow',-apple-system,sans-serif; min-height:100vh;
  }
  a{color:inherit;}
  .h-font{font-family:'Oswald',sans-serif;text-transform:uppercase;}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .name{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:19px;font-weight:700;letter-spacing:1px;color:var(--gold);}
  .brand .sub{font-size:13px;letter-spacing:2px;color:var(--text-dim);}
  .nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .nav a{font-size:12px;color:var(--text-dim);text-decoration:none;}
  .nav a.current{color:var(--gold);}

  .loading, .msg{text-align:center;color:var(--text-dim);padding:60px 0;font-size:14px;}
  .error{
    background:rgba(226,40,60,0.1);border:1px solid rgba(226,40,60,0.3);color:#F0897D;
    font-size:13px;padding:14px 16px;border-radius:8px;margin-bottom:16px;
  }

  /* ---------- Landing ---------- */
  .hero{
    max-width:720px;margin:80px auto 0;text-align:center;padding:0 10px;
    display:flex;flex-direction:column;align-items:center;
  }
  .hero .wordmark{
    font-family:'Oswald',sans-serif;text-transform:uppercase;font-weight:700;
    font-size:clamp(48px,10vw,88px);line-height:1;letter-spacing:2px;color:var(--gold);margin:0;
    text-shadow:0 2px 0 rgba(0,0,0,0.5);
  }
  .hero .tagline{
    font-family:'Oswald',sans-serif;text-transform:uppercase;font-weight:600;
    font-size:clamp(14px,2.6vw,20px);letter-spacing:6px;color:var(--text-dim);margin:10px 0 44px;
  }
  .octagon{
    width:60px;height:60px;clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    background:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
  }
  button.cta{
    background:linear-gradient(180deg,#E6C75C,var(--gold));color:#17120A;border:3px solid #17120A;border-radius:10px;
    padding:28px 52px;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:clamp(17px,3vw,22px);
    font-weight:700;letter-spacing:1.5px;cursor:pointer;
    box-shadow:0 0 0 1px rgba(212,175,55,0.5), 0 18px 40px rgba(212,175,55,0.28);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.cta:hover{
    background:linear-gradient(180deg,#F0D878,#E0BC4E);transform:translateY(-2px);
    box-shadow:0 0 0 1px rgba(212,175,55,0.6), 0 22px 46px rgba(212,175,55,0.38);
  }
  .hero .welcome{font-size:13.5px;color:var(--text-faint);margin-top:18px;letter-spacing:0.5px;}

  /* ---------- Setup (League-Settings-styled) ---------- */
  .settings-card{
    max-width:520px;margin:20px auto;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:28px 30px 32px;
  }
  .settings-card .kicker{font-size:11px;letter-spacing:2px;color:var(--text-faint);margin-bottom:4px;}
  .settings-card h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:20px;margin:0 0 6px;letter-spacing:1px;}
  .settings-card .desc{font-size:13px;color:var(--text-dim);margin:0 0 26px;line-height:1.5;}
  .field{margin-bottom:22px;}
  .field label{display:block;font-size:11px;letter-spacing:1.5px;color:var(--text-faint);margin-bottom:8px;text-transform:uppercase;}
  input[type=text].field-input{
    width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);
    font-size:14px;padding:11px 14px;
  }
  input[type=text].field-input:focus{outline:none;border-color:var(--gold);}
  .stepper{display:flex;align-items:center;gap:14px;}
  .stepper button{
    width:36px;height:36px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);font-size:17px;cursor:pointer;
  }
  .stepper button:hover{border-color:var(--gold);}
  .stepper .val{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;min-width:28px;text-align:center;}
  .photo-row{display:flex;align-items:center;gap:14px;}
  .photo-preview{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--panel-2);border:1px solid var(--border);flex-shrink:0;}
  .photo-preview-ph{
    width:60px;height:60px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:9px;flex-shrink:0;text-align:center;
  }
  input[type=file]{font-size:12px;color:var(--text-dim);}
  button.primary{
    background:var(--red);color:#fff;border:none;border-radius:4px;padding:13px 30px;
    font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;width:100%;font-family:'Oswald',sans-serif;text-transform:uppercase;
  }
  button.primary:disabled{opacity:0.4;cursor:not-allowed;}
  .back-link{display:inline-block;margin-bottom:14px;font-size:12px;color:var(--text-faint);text-decoration:none;cursor:pointer;}
  .back-link:hover{color:var(--text-dim);}

  /* ---------- Draft room ---------- */
  .lobby{
    max-width:480px;margin:50px auto;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;
  }
  .status-strip{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px 24px;margin-bottom:20px;flex-wrap:wrap;
  }
  .status-block{text-align:right;}
  .status-block .label{font-size:10px;letter-spacing:2px;color:var(--text-faint);}
  .status-block .val{font-size:18px;font-weight:700;font-family:'Oswald',sans-serif;}

  .layout{display:flex;gap:24px;align-items:flex-start;}
  .col-main{flex:2;min-width:0;}
  .col-side{flex:0 0 320px;}

  .onclock-banner{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);}
  .dot.mine{background:#4CAF7D;}

  .pool-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:20px;}
  input.search{
    width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);
    font-size:14px;padding:10px 14px;margin-bottom:14px;
  }
  input.search:focus{outline:none;border-color:var(--gold);}

  .fighter-row{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:4px;cursor:pointer;
    border:1px solid transparent;
  }
  .fighter-row:hover{background:var(--panel-2);}
  .fighter-row.selected{background:rgba(212,175,55,0.1);border-color:var(--gold);}
  .fighter-row .name{flex:1;font-size:14px;font-weight:600;}
  .fighter-row .rating{font-size:13px;color:var(--gold);font-weight:700;}
  .fighter-row .weight{font-size:11px;color:var(--text-faint);width:120px;}
  .pool-scroll{max-height:420px;overflow-y:auto;}

  .role-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .role-btn{
    background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:8px 16px;
    cursor:pointer;color:var(--text-dim);font-size:11px;letter-spacing:1px;
  }
  .role-btn.active{border-color:var(--gold);color:var(--gold);}
  .role-btn:disabled{opacity:0.3;cursor:not-allowed;}

  .lock-btn{
    margin-top:16px;background:var(--red);color:#fff;border:none;border-radius:4px;padding:13px 28px;
    font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;font-family:'Oswald',sans-serif;text-transform:uppercase;
  }
  .lock-btn:disabled{opacity:0.4;cursor:not-allowed;}

  .teams-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .team-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--panel-2);}
  .team-row.current{background:rgba(226,40,60,0.08);}
  .team-row.mine{background:rgba(76,175,125,0.06);}
  .team-photo{width:30px;height:30px;border-radius:6px;object-fit:cover;background:var(--panel-2);flex-shrink:0;}
  .team-photo-ph{width:30px;height:30px;border-radius:6px;background:var(--panel-2);flex-shrink:0;}
  .team-row .tname{flex:1;font-size:13px;font-weight:600;}
  .team-row .tcount{font-size:11px;color:var(--text-faint);}

  .feed-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;margin-top:16px;max-height:280px;overflow-y:auto;}
  .feed-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--panel-2);font-size:12.5px;}
  .feed-row .fname{font-weight:600;}
  .feed-row .meta{color:var(--text-faint);font-size:11px;}

  .roster-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;margin-top:16px;}
  .roster-role{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--panel-2);}
  .roster-role .rname{color:var(--text-dim);}
  .roster-role .rfill{color:var(--gold);font-weight:600;}

  .share-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  button.ghost{
    background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:4px;
    padding:10px 20px;font-size:12px;letter-spacing:1px;cursor:pointer;font-family:'Oswald',sans-serif;text-transform:uppercase;
  }
  button.ghost:hover{border-color:var(--gold);color:var(--gold);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="name">COMBAT</span>
    </div>
  </div>

  <div id="content"><div class="loading">Loading…</div></div>
</div>

<script>
const content = document.getElementById("content");
function esc(s){ return CombatAuth.escapeHtml(s); }

/* =========================================================================
   Dynasty draft engine — ported straight from
   combat-sync/netlify/functions/lib/draft-engine.js. Pure functions, no
   network calls. This copy operates on a purely local `picks` array (never
   touches draft_rooms/draft_picks) so this page can run with no sign-in,
   for anyone, as a public demo.
   ========================================================================= */
const ROLES = {
  PRIMARY: { activeCap: 3, cageCap: 12 },
  STRIKER: { activeCap: 3, cageCap: 12 },
  GRAPPLER: { activeCap: 2, cageCap: 8 },
  FINISHER: { activeCap: 2, cageCap: 8 },
};
const ROLE_NAMES = Object.keys(ROLES);
const ACTIVE_SLOTS_PER_TEAM = Object.values(ROLES).reduce((s, r) => s + r.activeCap, 0); // 10
const CAGESIDE_SLOTS_PER_TEAM = Object.values(ROLES).reduce((s, r) => s + r.cageCap, 0); // 40
const TOTAL_SLOTS_PER_TEAM = ACTIVE_SLOTS_PER_TEAM + CAGESIDE_SLOTS_PER_TEAM; // 50

function snakeTeamForPick(teamOrder, pickNumber){
  const teamCount = teamOrder.length;
  const roundIndex0 = Math.floor((pickNumber - 1) / teamCount);
  const positionInRound0 = (pickNumber - 1) % teamCount;
  const reversed = roundIndex0 % 2 === 1;
  const position = reversed ? teamCount - 1 - positionInRound0 : positionInRound0;
  return teamOrder[position];
}
function roundNumberForPick(pickNumber, teamCount){
  return Math.floor((pickNumber - 1) / teamCount) + 1;
}
function getPhase(pickNumber, teamCount){
  const activePicks = ACTIVE_SLOTS_PER_TEAM * teamCount;
  const cagesidePicks = CAGESIDE_SLOTS_PER_TEAM * teamCount;
  if (pickNumber <= activePicks) {
    return { phase: "active", roundInPhase: Math.floor((pickNumber - 1) / teamCount) + 1, roundsInPhase: ACTIVE_SLOTS_PER_TEAM };
  }
  if (pickNumber <= activePicks + cagesidePicks) {
    const pwc = pickNumber - activePicks;
    return { phase: "cageside", roundInPhase: Math.floor((pwc - 1) / teamCount) + 1, roundsInPhase: CAGESIDE_SLOTS_PER_TEAM };
  }
  return { phase: "complete", roundInPhase: null, roundsInPhase: null };
}
function roleCountForTeam(picks, teamId, role, slotType){
  return picks.filter((p) => p.team_id === teamId && p.role === role && p.slot_type === slotType).length;
}
function isFighterTaken(picks, fighterId){
  return picks.some((p) => p.fighter_id === fighterId);
}
function validatePick(teamOrder, picks, proposed){
  const { teamId, fighterId, role } = proposed;
  const teamCount = teamOrder.length;
  const nextPickNumber = picks.length + 1;
  const base = { legal: false, reason: null };
  if (!ROLE_NAMES.includes(role)) return { ...base, reason: `"${role}" isn't a role` };
  const { phase } = getPhase(nextPickNumber, teamCount);
  if (phase === "complete") return { ...base, reason: "Draft complete" };
  const expectedTeam = snakeTeamForPick(teamOrder, nextPickNumber);
  if (teamId !== expectedTeam) return { ...base, reason: "Not this team's pick" };
  if (isFighterTaken(picks, fighterId)) return { ...base, reason: "Fighter already drafted" };
  const slotType = phase === "active" ? "active" : "cageside";
  const cap = phase === "active" ? ROLES[role].activeCap : ROLES[role].cageCap;
  const countSoFar = roleCountForTeam(picks, teamId, role, slotType);
  if (countSoFar >= cap) return { ...base, reason: `${role} is full for this phase` };
  return { legal: true, reason: null, pickNumber: nextPickNumber, roundNumber: roundNumberForPick(nextPickNumber, teamCount), phase, slotType, role, roleSlotNumber: countSoFar + 1 };
}
function openRoleSlots(picks, teamId){
  return ROLE_NAMES.map((role) => {
    const activeCount = roleCountForTeam(picks, teamId, role, "active");
    const cageCount = roleCountForTeam(picks, teamId, role, "cageside");
    return { role, activeOpen: ROLES[role].activeCap - activeCount, cageOpen: ROLES[role].cageCap - cageCount };
  });
}

/* ========================================================================= */

let fighters = [];
let fightersById = {};
let fighterPoolError = null;

let screen = "landing"; // landing | setup | draft | complete
let teamCount = 8;
let userTeamName = "";
let userTeamPhotoUrl = null;

let teams = [];       // [{id, name, photoUrl, isUser}]
let teamOrder = [];   // team ids in round-1 order
let userTeamId = null;
let picks = [];
let selectedFighterId = null;
let selectedRole = null;
let botTimer = null;

async function loadFighterPool(){
  if (fighters.length || fighterPoolError) return;
  try {
    const { data, error } = await CombatAuth.client
      .from("fighters")
      .select("id, full_name, nickname, announced_weight_class, current_rating, photo_url")
      .order("current_rating", { ascending: false })
      .limit(1000);
    if (error) throw error;
    fighters = data || [];
    fightersById = {};
    fighters.forEach((f) => { fightersById[f.id] = f; });
  } catch (err) {
    fighterPoolError = err.message || "Couldn't load fighters.";
  }
}
function fighterName(id){
  const f = fightersById[id];
  return f ? f.full_name : "Unknown fighter";
}

/* ---------------- Landing ---------------- */
function renderLanding(){
  content.innerHTML = `
    <div class="hero">
      <div class="wordmark">Combat</div>
      <div class="tagline">UFC Fantasy Draft</div>
      <button class="cta" id="startCtaBtn">TRY COMBAT'S MOCK DRAFT TODAY</button>
      <div class="welcome">Jump into a live draft right now — no sign-up needed.</div>
    </div>
  `;
  document.getElementById("startCtaBtn").addEventListener("click", () => { screen = "setup"; render(); });
}

/* ---------------- Setup ---------------- */
function renderSetup(){
  content.innerHTML = `
    <a class="back-link" id="backLink">&larr; Back</a>
    <div class="settings-card">
      <div class="kicker">MOCK DRAFT SETUP</div>
      <h2>Set up your draft</h2>
      <div class="desc">This is your own practice run — name your team, add a photo if you want, and pick how many teams are in the room. Everyone else is a bot that drafts by fighter rating.</div>

      <div class="field">
        <label>Your team name</label>
        <input type="text" class="field-input" id="teamNameInput" maxlength="40" placeholder="e.g. Cage Rattlers" value="${esc(userTeamName)}">
      </div>

      <div class="field">
        <label>Team photo (optional)</label>
        <div class="photo-row">
          ${userTeamPhotoUrl
            ? `<img class="photo-preview" id="photoPreview" src="${esc(userTeamPhotoUrl)}" alt="">`
            : `<div class="photo-preview-ph" id="photoPreview">NO PHOTO</div>`}
          <input type="file" id="photoInput" accept="image/*">
        </div>
      </div>

      <div class="field">
        <label>Number of teams</label>
        <div class="stepper">
          <button id="teamCountMinus" type="button">&minus;</button>
          <div class="val" id="teamCountVal">${teamCount}</div>
          <button id="teamCountPlus" type="button">&plus;</button>
        </div>
      </div>

      <button class="primary" id="setupStartBtn">START MOCK DRAFT</button>
      <div class="error" id="setupError" style="display:none;margin-top:16px;"></div>
    </div>
  `;

  document.getElementById("backLink").addEventListener("click", () => { screen = "landing"; render(); });

  document.getElementById("teamCountMinus").addEventListener("click", () => {
    if (teamCount > 4) { teamCount -= 2; document.getElementById("teamCountVal").textContent = teamCount; }
  });
  document.getElementById("teamCountPlus").addEventListener("click", () => {
    if (teamCount < 12) { teamCount += 2; document.getElementById("teamCountVal").textContent = teamCount; }
  });

  const photoInput = document.getElementById("photoInput");
  photoInput.addEventListener("change", () => {
    const file = photoInput.files[0];
    if (!file) return;
    userTeamPhotoUrl = URL.createObjectURL(file);
    const img = document.createElement("img");
    img.className = "photo-preview";
    img.id = "photoPreview";
    img.src = userTeamPhotoUrl;
    document.getElementById("photoPreview").replaceWith(img);
  });

  document.getElementById("setupStartBtn").addEventListener("click", async () => {
    const name = document.getElementById("teamNameInput").value.trim();
    const errBox = document.getElementById("setupError");
    if (!name) {
      errBox.textContent = "Give your team a name first.";
      errBox.style.display = "block";
      return;
    }
    userTeamName = name;
    const btn = document.getElementById("setupStartBtn");
    btn.disabled = true;
    btn.textContent = "LOADING FIGHTERS…";
    await loadFighterPool();
    if (fighterPoolError) {
      errBox.textContent = fighterPoolError;
      errBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "START MOCK DRAFT";
      return;
    }
    beginDraft();
  });
}

/* ---------------- Draft setup / engine glue ---------------- */
const BOT_NAME_POOL = [
  "Iron Fist FC", "Submission Squad", "Knockout Kings", "Cage Rattlers West",
  "The Ground Game", "Takedown Titans", "Clinch City", "Southpaw Syndicate",
  "Phantom Punches", "The Scramble", "Guard Pullers Inc", "Buzzer Beaters",
];

function beginDraft(){
  teams = [];
  const userIndex = Math.floor(Math.random() * teamCount);
  const shuffledBotNames = BOT_NAME_POOL.slice().sort(() => Math.random() - 0.5);
  let botNameIdx = 0;
  for (let i = 0; i < teamCount; i++) {
    if (i === userIndex) {
      teams.push({ id: "user", name: userTeamName, photoUrl: userTeamPhotoUrl, isUser: true });
    } else {
      teams.push({ id: `bot-${i}`, name: shuffledBotNames[botNameIdx % shuffledBotNames.length] + (botNameIdx >= shuffledBotNames.length ? ` ${Math.floor(botNameIdx / shuffledBotNames.length) + 1}` : ""), photoUrl: null, isUser: false });
      botNameIdx++;
    }
  }
  userTeamId = "user";
  teamOrder = teams.map((t) => t.id);
  picks = [];
  selectedFighterId = null;
  selectedRole = null;
  screen = "draft";
  render();
  maybeRunBots();
}

function currentPickNumber(){ return picks.length + 1; }

function makeLocalPick(teamId, fighterId, role, isBot){
  const result = validatePick(teamOrder, picks, { teamId, fighterId, role });
  if (!result.legal) return result;
  picks.push({
    pick_number: result.pickNumber,
    round_number: result.roundNumber,
    team_id: teamId,
    fighter_id: fighterId,
    role,
    slot_type: result.slotType,
    is_autopick: !!isBot,
  });
  return result;
}

function bestOpenRoleForPhase(teamId, phase){
  const open = openRoleSlots(picks, teamId);
  const field = phase === "active" ? "activeOpen" : "cageOpen";
  const candidate = open.find((r) => r[field] > 0);
  return candidate ? candidate.role : null;
}

function botTakePick(teamId){
  const { phase } = getPhase(currentPickNumber(), teamOrder.length);
  if (phase === "complete") return false;
  const role = bestOpenRoleForPhase(teamId, phase);
  if (!role) return false;
  const taken = new Set(picks.map((p) => p.fighter_id));
  const best = fighters.find((f) => !taken.has(f.id));
  if (!best) return false;
  const result = makeLocalPick(teamId, best.id, role, true);
  return result.legal;
}

function maybeRunBots(){
  clearTimeout(botTimer);
  const { phase } = getPhase(currentPickNumber(), teamOrder.length);
  if (phase === "complete") { screen = "complete"; render(); return; }
  const onClock = snakeTeamForPick(teamOrder, currentPickNumber());
  if (onClock === userTeamId) { render(); return; }
  botTimer = setTimeout(() => {
    botTakePick(onClock);
    maybeRunBots();
  }, 450);
}

/* ---------------- Draft room rendering ---------------- */
function teamName(id){
  const t = teams.find((x) => x.id === id);
  return t ? t.name : id;
}

function renderDraft(){
  const pickNum = currentPickNumber();
  const { phase } = getPhase(pickNum, teamOrder.length);
  const onClockTeam = snakeTeamForPick(teamOrder, pickNum);
  const isMyTurn = onClockTeam === userTeamId;
  const myOpenRoles = isMyTurn ? openRoleSlots(picks, userTeamId) : [];
  const phaseField = phase === "active" ? "activeOpen" : "cageOpen";

  const filterVal = document.getElementById("fighterSearch") ? document.getElementById("fighterSearch").value : "";
  const taken = new Set(picks.map((p) => p.fighter_id));
  const poolRows = fighters
    .filter((f) => !taken.has(f.id))
    .filter((f) => !filterVal || f.full_name.toLowerCase().includes(filterVal.toLowerCase()))
    .slice(0, 60);

  const feedRows = picks.slice().reverse().slice(0, 25).map((p) => `
    <div class="feed-row">
      <div><span class="fname">${esc(fighterName(p.fighter_id))}</span> <span class="meta">${esc(p.role)}</span></div>
      <div class="meta">#${p.pick_number} &middot; ${esc(teamName(p.team_id))}${p.is_autopick ? " &middot; bot" : ""}</div>
    </div>
  `).join("") || `<div style="color:var(--text-faint);font-size:12.5px;">No picks yet.</div>`;

  const teamRows = teamOrder.map((tid) => {
    const t = teams.find((x) => x.id === tid);
    const count = picks.filter((p) => p.team_id === tid).length;
    const photo = t && t.photoUrl
      ? `<img class="team-photo" src="${esc(t.photoUrl)}" alt="">`
      : `<div class="team-photo-ph"></div>`;
    return `
      <div class="team-row ${tid === onClockTeam ? "current" : ""} ${tid === userTeamId ? "mine" : ""}">
        ${photo}
        <div class="tname">${esc(t ? t.name : tid)}${tid === userTeamId ? " (you)" : ""}</div>
        <div class="tcount">${count}/${TOTAL_SLOTS_PER_TEAM}</div>
      </div>
    `;
  }).join("");

  const myRoster = openRoleSlots(picks, userTeamId).map((r) => {
    const activeFilled = ROLES[r.role].activeCap - r.activeOpen;
    const cageFilled = ROLES[r.role].cageCap - r.cageOpen;
    return `
      <div class="roster-role">
        <span class="rname">${esc(r.role)}</span>
        <span class="rfill">${activeFilled}/${ROLES[r.role].activeCap} active &middot; ${cageFilled}/${ROLES[r.role].cageCap} cage</span>
      </div>
    `;
  }).join("");

  content.innerHTML = `
    <div class="status-strip">
      <div class="onclock-banner">
        <div class="dot ${isMyTurn ? "mine" : ""}"></div>
        <div class="h-font" style="font-size:13px;letter-spacing:2px;color:${isMyTurn ? "var(--gold)" : "var(--red)"};">
          ${isMyTurn ? "YOUR PICK" : "ON THE CLOCK — " + esc(teamName(onClockTeam))}
        </div>
      </div>
      <div style="display:flex;gap:28px;">
        <div class="status-block">
          <div class="label">PICK</div>
          <div class="val">${pickNum} <span style="color:var(--text-faint);font-size:13px;">(${esc(phase)})</span></div>
        </div>
        <div class="status-block">
          <div class="label">ROUND</div>
          <div class="val">${roundNumberForPick(pickNum, teamOrder.length)}</div>
        </div>
      </div>
    </div>

    <div class="layout">
      <div class="col-main">
        <div class="pool-card">
          <input class="search" id="fighterSearch" placeholder="Search fighters…" value="${esc(filterVal)}">
          <div class="pool-scroll" id="poolList">
            ${poolRows.map((f) => `
              <div class="fighter-row ${f.id === selectedFighterId ? "selected" : ""}" data-fighter-id="${f.id}">
                <div class="name">${esc(f.full_name)}${f.nickname ? ` <span style="color:var(--text-faint);font-weight:400;">"${esc(f.nickname)}"</span>` : ""}</div>
                <div class="weight">${esc(f.announced_weight_class || "")}</div>
                <div class="rating">${Math.round(f.current_rating)}</div>
              </div>
            `).join("")}
          </div>

          ${isMyTurn ? `
            <div class="role-row" id="roleRow">
              ${myOpenRoles.map((r) => `
                <button class="role-btn ${r.role === selectedRole ? "active" : ""}" data-role="${r.role}" ${r[phaseField] <= 0 ? "disabled" : ""}>
                  ${esc(r.role)} (${r[phaseField]} open)
                </button>
              `).join("")}
            </div>
            <button class="lock-btn" id="lockBtn" ${(!selectedFighterId || !selectedRole) ? "disabled" : ""}>LOCK PICK</button>
            <div class="error" id="pickError" style="display:none;margin-top:12px;"></div>
          ` : `<div style="margin-top:16px;font-size:12.5px;color:var(--text-faint);">Waiting on ${esc(teamName(onClockTeam))}…</div>`}
        </div>
      </div>

      <div class="col-side">
        <div class="teams-card">${teamRows}</div>
        <div class="roster-card">
          <div class="h-font" style="font-size:11px;letter-spacing:2px;color:var(--text-faint);margin-bottom:8px;">YOUR SLIP</div>
          ${myRoster}
        </div>
        <div class="feed-card">
          <div class="h-font" style="font-size:11px;letter-spacing:2px;color:var(--text-faint);margin-bottom:8px;">RECENT PICKS</div>
          ${feedRows}
        </div>
      </div>
    </div>
  `;

  document.querySelectorAll(".fighter-row").forEach((row) => {
    row.addEventListener("click", () => {
      selectedFighterId = row.dataset.fighterId;
      render();
    });
  });
  const searchInput = document.getElementById("fighterSearch");
  if (searchInput) {
    searchInput.addEventListener("input", () => { render(); searchInput.focus(); });
    // restore caret to the end after a full re-render
    const v = searchInput.value;
    searchInput.value = "";
    searchInput.value = v;
  }
  document.querySelectorAll(".role-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.disabled) return;
      selectedRole = btn.dataset.role;
      render();
    });
  });
  const lockBtn = document.getElementById("lockBtn");
  if (lockBtn) {
    lockBtn.addEventListener("click", () => {
      const errBox = document.getElementById("pickError");
      const result = makeLocalPick(userTeamId, selectedFighterId, selectedRole, false);
      if (!result.legal) {
        errBox.textContent = result.reason || "That pick isn't legal.";
        errBox.style.display = "block";
        return;
      }
      selectedFighterId = null;
      selectedRole = null;
      maybeRunBots();
    });
  }
}

/* ---------------- Complete ---------------- */
function renderComplete(){
  const myPicks = picks.filter((p) => p.team_id === userTeamId);
  const grouped = ROLE_NAMES.map((role) => {
    const roleP = myPicks.filter((p) => p.role === role);
    return `
      <div class="roster-role">
        <span class="rname">${esc(role)}</span>
        <span class="rfill">${roleP.length} drafted</span>
      </div>
    `;
  }).join("");
  const topPicks = myPicks.slice(0, 10).map((p) => `
    <div class="feed-row">
      <div><span class="fname">${esc(fighterName(p.fighter_id))}</span> <span class="meta">${esc(p.role)}</span></div>
      <div class="meta">#${p.pick_number}</div>
    </div>
  `).join("");

  content.innerHTML = `
    <div class="lobby" style="max-width:560px;">
      <div class="octagon"></div>
      <div>
        <div class="h-font" style="font-size:20px;font-weight:700;letter-spacing:2px;color:var(--gold);">DRAFT COMPLETE</div>
        <div style="font-size:13px;color:var(--text-dim);margin-top:8px;">${esc(userTeamName)} drafted a full ${TOTAL_SLOTS_PER_TEAM}-fighter Dynasty roster against ${teamCount - 1} bots.</div>
      </div>
      <div class="roster-card" style="width:100%;text-align:left;">${grouped}</div>
      <div style="width:100%;">
        <div class="h-font" style="font-size:11px;letter-spacing:2px;color:var(--text-faint);margin-bottom:8px;text-align:left;">YOUR FIRST 10 PICKS</div>
        <div class="feed-card" style="margin-top:0;">${topPicks}</div>
      </div>
      <div class="share-row">
        <button class="ghost" id="draftAgainBtn">DRAFT AGAIN</button>
        <a href="login.html"><button class="cta">CREATE A REAL LEAGUE</button></a>
      </div>
    </div>
  `;
  document.getElementById("draftAgainBtn").addEventListener("click", () => {
    screen = "setup";
    picks = [];
    render();
  });
}

/* ---------------- Router ---------------- */
function render(){
  if (screen === "landing") return renderLanding();
  if (screen === "setup") return renderSetup();
  if (screen === "draft") return renderDraft();
  if (screen === "complete") return renderComplete();
}

render();
</script>
</body>
</html>
