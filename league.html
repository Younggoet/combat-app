const $=s=>document.querySelector(s);

const secH=(t,r)=>`<div class="sh"><span class="h" style="font-size:18px;color:var(--fg)">${t}</span>${r||''}</div>`;

['3rr','3RD ROUND REVERSAL','Snake, 3rd round reversal','Moderate','Snake order, but the order flips again in round 3 so the last picker gets two in a row early and the first picker waits longer.'],

'3rr':'<path d="M14 16h36a8 8 0 0 1 0 16H26a8 8 0 0 0 0 16h24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M14 64h32a6 6 0 0 0 0-12" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M52 64l8-8-8-8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>',
linear:'<g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 24h46M50 16l8 8-8 8"/><path d="M12 42h46M50 34l8 8-8 8"/><path d="M12 60h46M50 52l8 8-8 8"/></g>',
auction:'<g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M26 18l22 22M20 30l22 22M38 12l14 14M14 44l14 14"/><path d="M34 60h32"/></g>'};

const PL=n=>{const p=plan(n);return{reg:p.c===6?'Blocks 1 to 7':'Blocks 1 to 8',seed:`Top ${p.c} play for the title${p.c===6?', seeds 1 and 2 get a bye':''}${p.l?'. Bottom '+p.l+' play the last place bracket':''}. Points break ties`,po:p.c===6?'Block 8 round one, Block 9 semis, Block 10 Last Stand':'Block 9 semis, Block 10 Last Stand'}};

const RK={};
async function loadRanks(){try{const {data}=await sb.from('fighters').select('id,current_rating,announced_weight_class').limit(2000);if(!data||!data.length)return;const all=data.map(x=>({id:x.id,r:Number(x.current_rating)||0,w:x.announced_weight_class})).sort((a,b)=>b.r-a.r);

async function loadCards(){

async function openLeague(id,sv){try{await Promise.all([loadLeague(id),loadCards(),loadRanks()]);await loadMsgs();await loadRoom();await loadSeason();Z.tab='home';Z.ls='standings';Z.mu=0;Z.sub=Z.L.status==='setup'?'draft':'room';const h=[Z.L.commissioner_user_id];const {data:p}=await sb.from('profiles').select('id,display_name').in('id',h);(p||[]).forEach(x=>Z.hosts[x.id]=x.display_name);if(sv){['tab','fs','ls','dt','card','ps','sub','dv'].forEach(k=>{if(sv[k]!=null)Z[k]=sv[k]})}go('league')}catch(e){toast("Couldn't open that league");console.error(e)}}
async function createLeague(){
  if(Z.busy)return;Z.busy=true;Z.err='';render();
  const c=Z.c,[tm,fg]=SIZES[c.sz];
  try{
    let L=null;
    for(let i=0;i<5&&!L;i++){
      const row={name:c.name.trim(),commissioner_user_id:Z.uid,team_count:tm,fighters_per_team:fg,draft_type:c.dt,waiver_type:'standard',faab_budget:200,join_code:genCode(),is_public:false,status:'setup',pick_seconds:45,format:'card_redraft'};
      const {data,error}=await sb.from('leagues').insert(row).select().single();
      if(!error)L=data;else if(!/join_code|duplicate|unique/i.test(error.message))throw error;
    }
    if(!L)throw new Error('Could not make an invite code');
    const {error:te}=await sb.from('teams').insert({league_id:L.id,name:teamName(Z.dn),owner_user_id:Z.uid,claimed_at:new Date().toISOString()});
    if(te){await sb.from('leagues').delete().eq('id',L.id);throw te}

  }catch(e){Z.busy=false;fail(e,"Couldn't create the league. Try again.")}
}
async function joinLeague(id){
  if(Z.busy)return;Z.busy=true;Z.err='';render();
  try{
    const {error}=await sb.from('teams').insert({league_id:id,name:teamName(Z.dn),owner_user_id:Z.uid,claimed_at:new Date().toISOString()});
    if(error&&!/duplicate|unique/i.test(error.message))throw error;
    Z.busy=false;await loadMine();await openLeague(id);toast('You joined the league');
  }catch(e){Z.busy=false;fail(e,"Couldn't join the league.")}
}
async function lookupCode(code){

    if(Z.leagues.some(l=>l.id===data.id)){await openLeague(data.id);return}}
  go('join');
}

  else if(a==='stat'){Z.stat=v;render()}
  else if(a==='drop'){Z.drop=v}
  else if(a==='doadd'){if(!Z.drop){toast('Pick a fighter to drop');return}const bid=Z.L.waiver_type==='faab'?+($('#bid')||{value:0}).value||0:0;const {error}=await sb.rpc('cr_submit_claim',{p_league:Z.L.id,p_add:Z.sh.add,p_drop:Z.drop,p_bid:bid});if(error){toast(error.message||"Couldn't submit that claim");return}closeSheet();await loadSeason();Z.ps='trades';render();toast('Claim submitted')}
  else if(a==='cl_cancel'){await sb.rpc('cr_cancel_claim',{p_claim:v});await loadSeason();render();toast('Claim cancelled')}
  else if(a==='enter_draft'){location.href='cr-draft.html?league='+Z.L.id}
  else if(a==='pt_new'){pickTradeSheet()}
  else if(a==='pt_to'){Z.sh.to=v;Z.sh.get=null;$('#pn').innerHTML=Z.sh.body()}
  else if(a==='pt_send'){Z.sh.send=v}
  else if(a==='pt_get'){Z.sh.get=v}
  else if(a==='pt_offer'){const h=Z.sh;if(!h.to||!h.send||!h.get){toast('Pick a team and one pick or fighter each way');return}if(h.send[0]==='f'&&h.get[0]==='f'){toast('At least one side must be a draft pick');return}const {error}=await sb.rpc('cr_propose_pick_trade',{p_room:Z.room.id,p_to:h.to,p_send_fighter:h.send[0]==='f'?h.send.slice(2):null,p_send_pick:h.send[0]==='p'?+h.send.slice(2):null,p_get_fighter:h.get[0]==='f'?h.get.slice(2):null,p_get_pick:h.get[0]==='p'?+h.get.slice(2):null});if(error){toast(error.message||"Couldn't send that offer");return}closeSheet();await refreshRoom(true);toast('Offer sent')}
  else if(a==='pt_act'){const {error}=await sb.rpc('cr_respond_pick_trade',{p_trade:el.dataset.id,p_action:v});if(error){toast(error.message||"Couldn't do that")}else toast(v==='accept'?'Trade accepted':v==='decline'?'Declined':'Offer cancelled');await refreshRoom(true)}
  else if(a==='tr_new'){tradeSheet()}
  else if(a==='tr_to'){Z.sh.to=v;Z.sh.get=[];$('#pn').innerHTML=Z.sh.body()}
  else if(a==='tr_send'||a==='tr_get'||a==='tr_drop'){const k=a==='tr_send'?'send':a==='tr_get'?'get':'drops',arr=Z.sh[k],i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else{const lim=k==='drops'?needDrop(myTeam().id,Z.sh.get.length,Z.sh.send.length):3;if(arr.length>=lim){toast(k==='drops'?'You only need to drop '+lim:'Up to 3 fighters each way');el.checked=false;return}arr.push(v)}$('#pn').innerHTML=Z.sh.body()}
  else if(a==='tr_drop2'){const arr=Z.sh.drops,i=arr.indexOf(v),t=Z.trades.find(x=>x.id===Z.sh.tracc),need=needDrop(myTeam().id,tSend(t).length,tGet(t).length);if(i>=0)arr.splice(i,1);else{if(arr.length>=need){toast('You only need to drop '+need);el.checked=false;return}arr.push(v)}$('#pn').innerHTML=Z.sh.body()}
  else if(a==='tr_acc_go'){const t=Z.trades.find(x=>x.id===Z.sh.tracc),need=needDrop(myTeam().id,tSend(t).length,tGet(t).length);if(Z.sh.drops.length!==need){toast('Pick '+need+' fighter'+(need>1?'s':'')+' to drop');return}await trAccept(Z.sh.tracc,Z.sh.drops)}
  else if(a==='tr_send_offer'){const h=Z.sh;if(!h.to||!h.send.length||!h.get.length){toast('Pick a team and at least one fighter each way');return}const need=needDrop(myTeam().id,h.get.length,h.send.length);if(h.drops.length!==need){toast('Pick '+need+' fighter'+(need>1?'s':'')+' to drop');return}
    const multi=h.send.length>1||h.get.length>1||h.drops.length;const {error}=multi?await sb.rpc('cr_propose_trade_multi',{p_league:Z.L.id,p_to:h.to,p_send:h.send,p_get:h.get,p_drops:h.drops}):await sb.rpc('cr_propose_trade',{p_league:Z.L.id,p_to:h.to,p_send:h.send[0],p_get:h.get[0]});if(error){toast(error.message||"Couldn't send that offer");return}closeSheet();await loadSeason();render();toast('Offer sent')}
  else if(a==='tr_act'&&v==='accept'){trAcceptSheet(el.dataset.id)}
  else if(a==='tr_act'){const {error}=await sb.rpc(Z.trades.find(x=>x.id===el.dataset.id)&&Z.trades.find(x=>x.id===el.dataset.id).send_fighters?'cr_respond_trade_multi':'cr_respond_trade',{p_trade:el.dataset.id,p_action:v});if(error){toast(error.message||"Couldn't do that")}else toast(v==='accept'?'Trade accepted':v==='decline'?'Declined':'Offer cancelled');await loadSeason();render()}
  else if(a==='fs'){Z.fs=v;render()}
  else if(a==='sdv'){Z.sdv=v;render()}
  else if(a==='pv'){pvSet(v);render()}
  else if(a==='pvp'){PV.run=!PV.run;pvTimer();render()}
  else if(a==='pvn'){pvStep()}
  else if(a==='tm_edit'){teamSheet()}
  else if(a==='tm_color'){tmName();Z.tm.color=v;tmPaint()}
  else if(a==='tm_save'){teamSave()}
  else if(a==='tm_nophoto'){tmName();Z.tm.photo='';tmPaint()}
  else if(a==='pvi'){pvInt(v)}
  else if(a==='pvmic'){pvMic()}
  else if(a==='pvsend'){pvSend()}
  else if(a==='card'){Z.card=+v;render()}
  else if(a==='mu'){Z.mu=+v;render()}
  else if(a==='sub'){Z.sub=v;if(v==='chat')await loadMsgs();render();scrollTo(0,0)}
  else if(a==='toast_m')toast(v);
  else if(a==='copy'){try{await navigator.clipboard.writeText(joinLink(Z.L));toast('Invite link copied')}catch(_){toast(joinLink(Z.L))}}
  else if(a==='share'){const u=joinLink(Z.L);if(navigator.share){try{await navigator.share({title:Z.L.name,text:'Join my Combat league: '+Z.L.name,url:u})}catch(_){}}else{try{await navigator.clipboard.writeText(u);toast('Invite link copied')}catch(_){toast(u)}}}
  else if(a==='toggle_open')await upd({is_public:!Z.L.is_public},Z.L.is_public?'League is now private':'League posted to the lobby');
  else if(a==='set_wv')await upd({waiver_type:v},'Waivers updated');
  else if(a==='save_time'){const t=$('#dtt').value;if(!t){toast('Pick a date and time');return}const d=new Date(t);if(d<new Date()){toast('Pick a time in the future');return}await upd({draft_time:d.toISOString()},'Draft time set')}
  else if(a==='finbonus'){const on=!Z.L.finish_bonus;if(await upd({finish_bonus:on},'Finish bonus '+(on?'on':'off'))){await loadSeason();render()}}
  else if(a==='rename'){const n=($('#rn').value||'').trim();if(!n){toast('Name cannot be empty');return}await upd({name:n},'League renamed')}
  else if(a==='ask'){if(v==='leave'&&isComm()){toast('Delete the league instead, or ask the commissioner');return}Z.conf=v;render()}
  else if(a==='cancel'){Z.conf=null;render()}
  else if(a==='rm_team'){const {error}=await sb.from('teams').delete().eq('id',v);if(error){toast("Couldn't remove that team");return}Z.teams=Z.teams.filter(t=>t.id!==v);render();toast('Team removed')}
  else if(a==='do_leave'){const t=myTeam();if(t){const {error}=await sb.from('teams').delete().eq('id',t.id);if(error){toast("Couldn't leave");return}}await loadMine();toast('You left the league');go('home')}
  else if(a==='do_delete'){await sb.from('teams').delete().eq('league_id',Z.L.id);const {error}=await sb.from('leagues').delete().eq('id',Z.L.id);if(error){toast("Couldn't delete the league");await loadLeague(Z.L.id);render();return}await loadMine();toast('League deleted');go('home')}
  }catch(err){console.error(err);toast('Something went wrong. Try again.')}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='cf')return;e.preventDefault();const i=$('#ci'),b=(i.value||'').trim();if(!b)return;i.value='';
  const {error}=await sb.from('chat_messages').insert({league_id:Z.L.id,display_name:teamName(Z.dn),body:b});if(error){toast("Couldn't send");return}await loadMsgs();render();setTimeout(()=>{const x=$('#ci');x&&x.focus()},0)});
// Live scoring: during a card, reload scores every 45s so Matchup, My Corner, Fight Night and the pool update on their own.
setInterval(async()=>{if(Z.v!=='league'||!Z.L||document.hidden||Z.liveBusy)return;const el=document.activeElement;if(el&&el.matches&&el.matches('input,textarea'))return;if($('#sheet')&&$('#sheet').classList.contains('on'))return;if(PV&&PV.mode==='live')return;
  const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'}),yest=new Date(Date.now()-864e5).toLocaleDateString('en-CA',{timeZone:'America/New_York'});
  if(!(Z.bouts||[]).some(b=>(b.bout_date===today||b.bout_date===yest)&&b.status!=='completed'&&b.status!=='cancelled'))return;
  Z.liveBusy=true;try{await loadSeason();render()}catch(e){}Z.liveBusy=false},45000);
setInterval(async()=>{if(Z.v==='league'&&Z.sub==='chat'&&!document.hidden&&!document.activeElement?.matches('input')){const n=Z.msgs.length;await loadMsgs();if(Z.msgs.length!==n)render()}},6000);

async function refreshRoom(force){
  if(!Z.room||!Z.L)return;const before=Z.room.current_pick_number+Z.room.status,wasLive=Z.room.status==='live';
  await loadRoom();
  if(Z.room.status==='complete'&&(Z.L.status!=='active'||wasLive)){await loadLeague(Z.L.id);await loadSeason();Z.tab='home';force=true}
  if(force||Z.room.current_pick_number+Z.room.status!==before)if(Z.v==='league'&&Z.sub==='room'){const s=$('#rs');const f=s&&document.activeElement===s;render();if(f){const n=$('#rs');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
}
let ticking=false,pz=0;
setInterval(async()=>{
  if(Z.v!=='league'||!Z.room||(Z.room.status!=='live'&&Z.room.status!=='paused')||document.hidden||ticking)return;
  if(Z.room.status==='paused'){pz=(pz+1)%40;if(pz%6)return;ticking=true;try{if(!pz)await sb.rpc('cr_tick',{p_room:Z.room.id});await refreshRoom()}catch(e){console.error(e)}ticking=false;return}
  ticking=true;try{
    const dl=Z.room.current_pick_deadline?new Date(Z.room.current_pick_deadline).getTime():0;
    if(dl&&Date.now()>dl+600){await sb.rpc('cr_tick',{p_room:Z.room.id})}
    if(Z.sub==='room'||Z.sub==='draft'||Z.tab==='league')await refreshRoom();else await loadRoom();
  }catch(e){console.error(e)}ticking=false},1500);
setInterval(()=>{const c=$('#clk');if(!c||!Z.room||!Z.room.current_pick_deadline)return;const t=Math.max(0,Math.ceil((new Date(Z.room.current_pick_deadline)-Date.now())/1000));c.textContent=t}, 250);
document.addEventListener('input',e=>{if(e.target.id==='rs'){Z.rq=e.target.value;const l=$('#plist');if(l)l.innerHTML=poolRows()}});

/* ---------- start ---------- */
(async()=>{
  try{
    const user=await CombatAuth.getUser();
    const q=new URLSearchParams(location.search),jc=q.get('join');
    if(!user){Z.pendingJoin=jc;return go('signin')}
    Z.uid=user.id;
    const p=await CombatAuth.getProfile(user.id);
    Z.dn=(p&&p.display_name)||'';
    if(!Z.dn){Z.pendingJoin=jc;return go('name')}
    await loadMine();
    if(jc)return await lookupCode(jc);
    const oid=q.get('open');if(oid&&Z.leagues.some(l=>l.id===oid)){await openLeague(oid);history.replaceState(null,'','league.html');return}
    try{const sv=JSON.parse(localStorage.getItem('cb_nav')||'null');if(sv&&sv.lid&&Z.leagues.some(l=>l.id===sv.lid)){await openLeague(sv.lid,sv);if(Z.v==='league')return}}catch(e){}
    go('home');
  }catch(e){console.error(e);$('#app').innerHTML=`<div class="pad" style="padding-top:30vh;text-align:center"><div class="h" style="font-size:22px">Couldn't load your leagues</div><div class="mut" style="margin:8px 0 16px">Check your connection and try again.</div><button class="btn g" onclick="location.reload()">RETRY</button></div>`}
})();
