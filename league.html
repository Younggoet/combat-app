<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Mobile league app: one column, sticky header, five bottom tabs, sub-tabs inside each. */
:root{--bg:#0B0B0D;--surf:#131317;--surf2:#1B1B20;--fg:#F2EFE6;--mut:#B8B5AE;--dim:#8C8982;--gold:#D4AF37;--gold2:#E8C93A;--red:#E2283C;--redl:#FF6A78;--teal:#3FD8C5;--green:#4CD08A;--ol:#D4AF37aa;
--tc-cage:#D4AF37;--tc-iron:#FF5468;--tc-sub:#1FB5A3;--tc-td:#4C8BFF;--tc-ko:#B57BFF;--tc-gp:#FF7A2F;color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:14px}
body{min-height:100vh;background:radial-gradient(900px 600px at 20% -5%,rgba(236,60,80,.45),rgba(226,40,60,0) 70%),linear-gradient(180deg,#4A121C 0,#1A0A0E 420px,#0B0B0D 900px),var(--bg);background-attachment:fixed}
.h{font-family:Oswald,Impact,sans-serif;letter-spacing:.5px}
#app{max-width:560px;margin:0 auto;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{--P:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.ob{--c:16px;padding:1.5px;background:var(--ol);clip-path:var(--P)}
.ob{min-width:0}.ob>.i{min-width:0;--c:calc(var(--oc,16px) - 1px);clip-path:var(--P);background:var(--fill,linear-gradient(155deg,rgba(212,175,55,.12),rgba(0,0,0,0) 60%),#131317);padding:var(--pad,14px);height:100%}
.ob.sm{--oc:10px}.ob.sm{--c:10px}.ob.md{--c:14px;--oc:14px}.ob.lg{--c:22px;--oc:22px}
.oc{clip-path:polygon(29.29% 0,70.71% 0,100% 29.29%,100% 70.71%,70.71% 100%,29.29% 100%,0 70.71%,0 29.29%)}

.fav>i{display:block;width:100%;height:100%;background:#0F0F12}
.tav{width:var(--s);height:var(--s);flex:none;background:var(--tc);position:relative;display:flex;align-items:center;justify-content:center}
.tav>b{position:absolute;inset:max(2px,calc(var(--s)/14));background:#131317;display:flex;align-items:center;justify-content:center;font-family:Oswald,sans-serif;font-size:calc(var(--s)*.34);color:var(--tc);background-size:cover;background-position:center}

.ibtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#26262B;color:var(--fg);border:0;cursor:pointer;--c:11px;clip-path:var(--P);position:relative}
.ibtn svg{width:20px;height:20px}
.dot{position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.chip{--c:9px;clip-path:var(--P);background:linear-gradient(135deg,#6E5622,#3A2E14);color:var(--fg);border:0;padding:9px 16px;font-family:Oswald,sans-serif;font-size:14px;letter-spacing:1px;white-space:nowrap;cursor:pointer}
.chip.on{background:linear-gradient(135deg,#F2D675,#D4AF37 60%,#9C7A1E);color:#14120A}
.chip.sm{padding:6px 12px;font-size:12px;--c:7px;background:#26262B;color:var(--mut)}.chip.sm.on{background:linear-gradient(135deg,#F2D675,#D4AF37 60%,#9C7A1E);color:#14120A}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 0}.sh .h{font-size:18px;letter-spacing:1px}.sh span{font-size:12px;color:var(--dim)}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column}.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}.gold{color:var(--gold2)}.small{font-size:12px}.tiny{font-size:11px}
.nm{font-family:Oswald,sans-serif;font-size:17px;font-weight:700;line-height:1.1}

.tag.ph{border:1px dashed #33333A;color:#55555D;clip-path:none;background:none;font-family:Inter}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(19,19,23,.92),#101013);border-top:1px solid #2a2a30;padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.nav>div{display:flex;gap:4px;width:100%;max-width:560px}
.nb{flex:1;border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;font-family:Oswald,sans-serif;font-size:11px;letter-spacing:1px;--c:12px;clip-path:var(--P)}
.nb svg{width:22px;height:22px}.nb.on{color:#14120A;background:linear-gradient(135deg,#F2D675,#D4AF37 60%,#9C7A1E)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{font-size:10px;letter-spacing:1px;color:var(--dim);text-align:right;font-weight:500;padding:4px 4px}.tbl td{padding:8px 4px;text-align:right;border-top:1px solid #26262C}.tbl th:first-child,.tbl td:first-child{text-align:left}
.scroll{overflow-x:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--redl);font-family:Oswald;font-size:12px;letter-spacing:1.5px}.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:lp 1.2s infinite}
@keyframes lp{50%{opacity:.25}}
.bar{height:6px;background:#26262B;border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%}

.sheet{position:fixed;inset:0;z-index:50;display:none}.sheet.on{display:block}
.sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.7)}
@media (min-width:900px){.sheet.fpw .pn{max-width:1180px;top:40px;bottom:40px}.sheet.tpw .pn{max-width:860px;top:40px;bottom:40px}}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;top:24px;max-width:560px;margin:0 auto;overflow-y:auto;background:var(--bg);--c:22px;clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% 100%,0 100%,0 var(--c));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--gold);color:#14120A;font-family:Oswald;letter-spacing:1px;padding:10px 20px;--c:10px;clip-path:var(--P);display:none}
.bub{--c:9px;clip-path:var(--P);padding:1.5px;background:var(--bc)}.bub>div{--c:8px;clip-path:var(--P);background:#17171B;padding:7px 10px;font-size:12px;line-height:1.35}
input,textarea{font:inherit;color:inherit}
.msg{display:flex;gap:10px;align-items:flex-start}
.fi{width:100%;background:#26262B;border:0;padding:12px 14px;--c:10px;clip-path:var(--P);color:var(--fg);outline:none}
.sw{width:30px;height:30px;border:0;padding:0;cursor:pointer;--c:9px;clip-path:var(--P)}
.wv{display:inline-block;width:3px;background:var(--gold2);animation:wv .9s infinite}@keyframes wv{0%,100%{height:3px}50%{height:12px}}
@media (prefers-reduced-motion:reduce){.live::before,.wv{animation:none}}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}


.dgrid,.dcol{display:contents}
@media (min-width:900px){
 #app{max-width:1240px}
 .hdr,.pad{padding-left:32px;padding-right:32px}
 .sec{padding-top:10px}
 .dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}
 .dcol{display:flex;flex-direction:column;gap:12px;min-width:0}
 .seg{flex-wrap:wrap;overflow:visible}
 .home-wrap{max-width:720px}
}
@media (min-width:900px) and (max-width:1199px){.dgrid{grid-template-columns:repeat(2,1fr)}.dcol:nth-child(3){grid-column:1/-1}}

.dkwrap{padding:0 32px 60px;max-width:1360px;margin:0 auto}
.dkcard{--c:16px;clip-path:var(--P);background:rgba(212,175,55,.67);position:relative;isolation:isolate}
.dkcard::after{content:'';position:absolute;inset:1.5px;--c:15px;clip-path:var(--P);background:#16161A;z-index:-1}
.dkbar{padding:12px 16px;background:rgba(255,255,255,.03)}
.dkcard .tbl th:nth-child(-n+2){text-align:left}.dkcard .tbl th:first-child{width:40px}
.dkcard .tbl th:nth-child(-n+2){text-align:left}.dkcard .tbl th:first-child{width:40px}
.dkbody .sec{padding-left:0;padding-right:0}
@media (min-width:900px){#app{max-width:1440px}.dkbody .pad{padding-left:0;padding-right:0}}
</style>
</head><body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="bk" data-a="close"></div><div class="pn" id="pn"></div></div>
<div class="toast" id="toast"></div>

<script src="auth.js"></script>
<script>
/* Combat leagues: create, join, find and set up a Card Redraft league. Real data only. */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ob=(h,o={})=>`<div class="ob ${o.cls||''}" style="${o.col?`--ol:${o.col}aa;--fill:linear-gradient(155deg,${o.col}38,${o.col}10 60%,rgba(0,0,0,0)),#131317;`:''}${o.pad?`--pad:${o.pad};`:''}${o.st||''}"><div class="i">${h}</div></div>`;
const secH=(t,r)=>`<div class="sh"><span class="h" style="font-size:18px;color:var(--fg)">${t}</span>${r||''}</div>`;
const ICON={back:'<path d="M15 5l-7 7 7 7"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/>',copy:'<rect x="9" y="9" width="11" height="11"/><path d="M5 15V5h10"/>'};
const svg=(p,w=20)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const SIZES=[[12,7],[12,5],[10,8],[10,6],[8,10],[8,8],[6,12],[6,10],[4,15]];
const DTS=[['snake','SNAKE','Snake (Default)','Moderate','Draft in a set or random order. Each round the order reverses. Most common way to draft.'],
['3rr','3RD ROUND REVERSAL','Snake, 3rd round reversal','Moderate','Snake order, but the order flips again in round 3 so the last picker gets two in a row early and the first picker waits longer.'],
['linear','LINEAR','Linear','Moderate','Same order every round. Pick 1 stays first in every round.'],
['auction','AUCTION','Auction','Long','Every team gets a budget and bids on fighters. Highest bid wins the fighter.']];
const DTI={snake:'<path d="M14 18h38a10 10 0 0 1 0 20H26a10 10 0 0 0 0 20h28" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><path d="M48 49l8 9-8 9" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>',
'3rr':'<path d="M14 16h36a8 8 0 0 1 0 16H26a8 8 0 0 0 0 16h24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M14 64h32a6 6 0 0 0 0-12" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M52 64l8-8-8-8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>',
linear:'<g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 24h46M50 16l8 8-8 8"/><path d="M12 42h46M50 34l8 8-8 8"/><path d="M12 60h46M50 52l8 8-8 8"/></g>',
auction:'<g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M26 18l22 22M20 30l22 22M38 12l14 14M14 44l14 14"/><path d="M34 60h32"/></g>'};
const DTSVG=(k,s)=>`<svg viewBox="0 0 72 72" width="${s}" height="${s}" style="position:absolute;inset:0;margin:auto;color:inherit">${DTI[k]}</svg>`;
const dtn=k=>(DTS.find(d=>d[0]===k)||DTS[0])[2].replace(' (Default)','');
const plan=n=>n===12?{c:6,l:6}:n===10?{c:6,l:4}:n===8?{c:4,l:4}:n===6?{c:6,l:0}:{c:4,l:0};
const PL=n=>{const p=plan(n);return{reg:p.c===6?'Blocks 1 to 7':'Blocks 1 to 8',seed:`Top ${p.c} play for the title${p.c===6?', seeds 1 and 2 get a bye':''}${p.l?'. Bottom '+p.l+' play the last place bracket':''}. Points break ties`,po:p.c===6?'Block 8 round one, Block 9 semis, Block 10 Last Stand':'Block 9 semis, Block 10 Last Stand'}};
const FCOLS='id,full_name,nickname,announced_weight_class,current_rating,photo_url,wins,losses,finishes,avg_sig_strikes,avg_takedowns,avg_knockdowns,avg_control_seconds,avg_sub_attempts,avg_reversals,td_def_pct,is_champion,date_of_birth,nationality,team,stance,height_cm,reach_cm,age_years,age_as_of,pro_wins,pro_losses,pro_draws,pro_nc';
const fx=x=>{if(x&&x.pro_wins!=null){x.wins=x.pro_wins;x.losses=x.pro_losses||0}return x};
const recS=f=>f&&f.wins!=null?f.wins+'-'+(f.losses||0)+(f.pro_draws?'-'+f.pro_draws:'')+(f.pro_nc?' ('+f.pro_nc+' NC)':''):null;
const SCORING=[['Significant strike landed','0.1'],['Takedown landed','2'],['Knockdown','8'],['Control time (per minute)','1'],['Submission attempt','1'],['Reversal','6'],['Takedown defended','0.5']];
const COLORS=['#D4AF37','#FF5468','#1FB5A3','#4C8BFF','#B57BFF','#FF7A2F','#3FD8C5','#E58CB0','#9ACD32','#E8742A','#A8325A','#F4F4F2'];

const sb=CombatAuth.client;
const Z={v:'boot',uid:null,dn:'',leagues:[],L:null,teams:[],sub:'draft',step:'name',c:{name:'',start:'new',sz:2,dt:'snake'},cards:null,pub:[],f:'all',msgs:[],conf:null,tab:'home',fs:'cards',ps:'pool',dv:'ALL',claims:[],trades:[],sh:null,drop:null,bid:'',card:0,ls:'standings',mu:0,mus:[],ros:[],bouts:[],perf:{},dt:'my',room:null,cur:null,picks:[],fmap:{},rq:'',code:'',found:null,err:'',busy:false,hosts:{}};
const teamName=dn=>'Team '+dn;
const initials=n=>{const w=String(n).replace(/^Team\s+/i,'').trim().split(/\s+/).filter(Boolean);return ((w[0]||'?')[0]+((w[1]||w[0]||'')[1]||'')).toUpperCase().slice(0,2)};
const colorOf=(t,list)=>{const i=(list||Z.teams).findIndex(x=>x.id===t.id);return COLORS[(i<0?0:i)%COLORS.length]};
const tavT=(t,s,list)=>`<div class="oc tav" style="--s:${s}px;--tc:${colorOf(t,list)}"><b class="oc">${esc(initials(t.name))}${t.photo_url?`<u style="background-image:url('${esc(t.photo_url)}')"></u>`:''}</b></div>`;
const tavL=(name,s,c)=>`<div class="oc tav" style="--s:${s}px;--tc:${c||'#D4AF37'}"><b class="oc">${esc(initials(name))}</b></div>`;
const fmtDT=iso=>iso?new Date(iso).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(6));for(const x of r)s+=a[x%a.length];return s.slice(0,3)+'-'+s.slice(3)};
const joinLink=L=>location.origin+location.pathname.replace(/[^/]*$/,'')+'league.html?join='+encodeURIComponent(L.join_code);
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
const isComm=()=>Z.L&&Z.L.commissioner_user_id===Z.uid;
const myTeam=()=>Z.teams.find(t=>t.owner_user_id===Z.uid);

/* ---------- data ---------- */
async function loadMine(){
  const {data,error}=await sb.from('teams').select('id,name,league_id,leagues!inner(*)').eq('owner_user_id',Z.uid);
  if(error)throw error;
  Z.leagues=(data||[]).map(r=>r.leagues).filter(l=>l.team_count).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const ids=Z.leagues.map(l=>l.id);Z.counts={};
  if(ids.length){const {data:t}=await sb.from('teams').select('league_id').in('league_id',ids);(t||[]).forEach(x=>Z.counts[x.league_id]=(Z.counts[x.league_id]||0)+1)}
}
async function loadLeague(id){
  const [{data:L,error},{data:T}]=await Promise.all([sb.from('leagues').select('*').eq('id',id).single(),sb.from('teams').select('*').eq('league_id',id).order('created_at')]);
  if(error)throw error;Z.L=L;Z.teams=T||[];
}
async function loadCards(){
  if(Z.cards)return;
  try{
    const today=new Date().toISOString().slice(0,10);
    const {data,error}=await sb.from('bouts').select('event_name,bout_date,status,fighter_a,fighter_b').gte('bout_date',today).neq('status','completed').order('bout_date',{ascending:true});
    if(error)throw error;
    const m=new Map(),seen=new Set();
    (data||[]).forEach(b=>{const p=[b.fighter_a,b.fighter_b].sort().join('|');if(seen.has(b.bout_date+p))return;seen.add(b.bout_date+p);const k=b.bout_date+'|'+b.event_name;if(!m.has(k))m.set(k,{eventName:b.event_name,date:b.bout_date,n:0});m.get(k).n++});
    Z.cards=[...m.values()].sort((a,b)=>a.date.localeCompare(b.date));
  }catch(e){Z.cards=[];Z.cardsErr=1}
}
/* A block never uses the card that is about to happen: it starts with the second upcoming card and needs 4 cards. */
const blockCards=()=>(Z.cards||[]).slice(1,5);
async function loadPublic(){
  const {data,error}=await sb.from('leagues').select('*,teams(id)').eq('is_public',true).eq('status','setup').not('team_count','is',null).order('created_at',{ascending:false}).limit(60);
  if(error)throw error;
  Z.pub=data||[];
  const ids=[...new Set(Z.pub.map(l=>l.commissioner_user_id).filter(Boolean))];
  if(ids.length){const {data:p}=await sb.from('profiles').select('id,display_name').in('id',ids);(p||[]).forEach(x=>Z.hosts[x.id]=x.display_name)}
}
async function loadMsgs(){
  if(!Z.L)return;
  const {data}=await sb.from('chat_messages').select('*').eq('league_id',Z.L.id).order('created_at',{ascending:true}).limit(200);
  Z.msgs=data||[];
}


const WCC={Heavyweight:'#8C8982','Light Heavyweight':'#B57BFF',Middleweight:'#3A7BFF',Welterweight:'#F4F4F2',Lightweight:'#B5452B',Featherweight:'#1FB5A3',Bantamweight:'#FF7A2F',Flyweight:'#E8742A'};
const wcol=w=>WCC[w]||(String(w||'').includes("Women")?'#E58CB0':'#D4AF37');
async function loadRoom(){

async function loadSeason(){

  Z.mus=m||[];Z.ros=ro||[];
  const [{data:cl},{data:tr}]=await Promise.all([sb.from('cr_claims').select('*').eq('league_id',Z.L.id).order('created_at',{ascending:false}),sb.from('cr_trades').select('*').eq('league_id',Z.L.id).order('created_at',{ascending:false})]);
  Z.claims=cl||[];Z.trades=tr||[];
  const names=[...new Set((Z.cur.block_cards||[]).map(c=>c.event_name))];
  const {data:b}=await sb.from('bouts').select('id,event_name,bout_date,status,fighter_a,fighter_b,winner_id,method,is_title_fight').in('event_name',names);
  const dates=new Set((Z.cur.block_cards||[]).map(c=>c.date));

  Z.perf={};
  Z.bst={};

    if(pf&&pf.length){const pm={};pf.forEach(x=>pm[x.id]=x);const {data:ms}=await sb.from('mma_stats').select('performance_id,sig_strikes_landed,takedowns_landed,knockdowns,control_time_seconds,submission_attempts,reversals').in('performance_id',pf.map(x=>x.id)).eq('round_number',0);
      (ms||[]).forEach(m=>{const p=pm[m.performance_id];if(p)Z.bst[p.bout_id+'|'+p.fighter_id]={ss:m.sig_strikes_landed||0,td:m.takedowns_landed||0,kd:m.knockdowns||0,ctrl:m.control_time_seconds||0,sub:m.submission_attempts||0,rev:m.reversals||0,pts:Number(p.fantasy_points||0)}})}}

  if(miss.length){const {data:f}=await sb.from('fighters').select(FCOLS).in('id',miss);(f||[]).forEach(x=>Z.fmap[x.id]=fx(x))}
}

const rosterOf=tid=>Z.ros.filter(r=>r.team_id===tid&&r.block_no===cb()).map(r=>r.fighter_id).sort((a,b)=>wco(a)-wco(b)||fnm(a).localeCompare(fnm(b)));

   :`<div class="row" style="gap:6px;height:${(H-4)/2}px;padding:0 9px">${x.seed?`<span class="h gold" style="width:12px;font-size:13px">${x.seed}</span>`:'<span style="width:12px"></span>'}<div class="oc" style="width:20px;height:20px;background:#26262B;flex:none"></div><span class="small dim" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.txt||'TBD')}</span></div>`;

    (m.feed||[]).forEach(f=>{const fy=ys[ri-1][f]+H/2,cy=y+H/2,x1=(ri-1)*(W+G)+W,x2=x,mid=x1+G/2;lines+=`<path d="M${x1} ${fy}H${mid}V${cy}H${x2}" fill="none" stroke="${col}" stroke-opacity=".7" stroke-width="1.5"/>`})}));

/* ---------- actions ---------- */
async function openLeague(id){try{await Promise.all([loadLeague(id),loadCards()]);await loadMsgs();await loadRoom();await loadSeason();Z.tab='home';Z.ls='standings';Z.mu=0;Z.sub=Z.L.status==='setup'?'draft':'room';const h=[Z.L.commissioner_user_id];const {data:p}=await sb.from('profiles').select('id,display_name').in('id',h);(p||[]).forEach(x=>Z.hosts[x.id]=x.display_name);go('league')}catch(e){toast("Couldn't open that league");console.error(e)}}
async function createLeague(){
  if(Z.busy)return;Z.busy=true;Z.err='';render();
  const c=Z.c,[tm,fg]=SIZES[c.sz];
  try{
    let L=null;
    for(let i=0;i<5&&!L;i++){
      const row={name:c.name.trim(),commissioner_user_id:Z.uid,team_count:tm,fighters_per_team:fg,draft_type:c.dt,waiver_type:'standard',faab_budget:200,join_code:genCode(),is_public:false,status:'setup',pick_seconds:45,format:'card_redraft'};
      const {data,error}=await sb.from('leagues').insert(row).select().single();
      if(!error)L=data;else if(!/join_code|duplicate|unique/i.test(error.message))throw error;
    }
    if(!L)throw new Error('Could not make an invite code');
    const {error:te}=await sb.from('teams').insert({league_id:L.id,name:teamName(Z.dn),owner_user_id:Z.uid,claimed_at:new Date().toISOString()});
    if(te){await sb.from('leagues').delete().eq('id',L.id);throw te}
    Z.busy=false;await loadMine();await openLeague(L.id);toast('League created');
  }catch(e){Z.busy=false;fail(e,"Couldn't create the league. Try again.")}
}
async function joinLeague(id){
  if(Z.busy)return;Z.busy=true;Z.err='';render();
  try{
    const {error}=await sb.from('teams').insert({league_id:id,name:teamName(Z.dn),owner_user_id:Z.uid,claimed_at:new Date().toISOString()});
    if(error&&!/duplicate|unique/i.test(error.message))throw error;
    Z.busy=false;await loadMine();await openLeague(id);toast('You joined the league');
  }catch(e){Z.busy=false;fail(e,"Couldn't join the league.")}
}
async function lookupCode(code){
  const {data,error}=await sb.from('leagues').select('*,teams(id)').eq('join_code',code.toUpperCase().trim()).maybeSingle();
  if(error)throw error;
  Z.found=data;if(data){const {data:p}=await sb.from('profiles').select('id,display_name').eq('id',data.commissioner_user_id);(p||[]).forEach(x=>Z.hosts[x.id]=x.display_name);
    if(Z.leagues.some(l=>l.id===data.id)){await openLeague(data.id);return}}
  go('join');
}
async function upd(patch,msg){const {error}=await sb.from('leagues').update(patch).eq('id',Z.L.id);if(error){toast("Couldn't save that");console.error(error);return false}Object.assign(Z.L,patch);render();if(msg)toast(msg);return true}

  else if(a==='fs'){Z.fs=v;render()}
  else if(a==='sdv'){Z.sdv=v;render()}
  else if(a==='pv'){pvSet(v);render()}
  else if(a==='pvp'){PV.run=!PV.run;pvTimer();render()}
  else if(a==='pvn'){pvStep()}
  else if(a==='card'){Z.card=+v;render()}
  else if(a==='mu'){Z.mu=+v;render()}
  else if(a==='sub'){Z.sub=v;if(v==='chat')await loadMsgs();render();scrollTo(0,0)}
  else if(a==='toast_m')toast(v);
  else if(a==='copy'){try{await navigator.clipboard.writeText(joinLink(Z.L));toast('Invite link copied')}catch(_){toast(joinLink(Z.L))}}
  else if(a==='share'){const u=joinLink(Z.L);if(navigator.share){try{await navigator.share({title:Z.L.name,text:'Join my Combat league: '+Z.L.name,url:u})}catch(_){}}else{try{await navigator.clipboard.writeText(u);toast('Invite link copied')}catch(_){toast(u)}}}
  else if(a==='toggle_open')await upd({is_public:!Z.L.is_public},Z.L.is_public?'League is now private':'League posted to the lobby');
  else if(a==='set_wv')await upd({waiver_type:v},'Waivers updated');
  else if(a==='save_time'){const t=$('#dtt').value;if(!t){toast('Pick a date and time');return}const d=new Date(t);if(d<new Date()){toast('Pick a time in the future');return}await upd({draft_time:d.toISOString()},'Draft time set')}
  else if(a==='rename'){const n=($('#rn').value||'').trim();if(!n){toast('Name cannot be empty');return}await upd({name:n},'League renamed')}
  else if(a==='ask'){if(v==='leave'&&isComm()){toast('Delete the league instead, or ask the commissioner');return}Z.conf=v;render()}
  else if(a==='cancel'){Z.conf=null;render()}
  else if(a==='rm_team'){const {error}=await sb.from('teams').delete().eq('id',v);if(error){toast("Couldn't remove that team");return}Z.teams=Z.teams.filter(t=>t.id!==v);render();toast('Team removed')}
  else if(a==='do_leave'){const t=myTeam();if(t){const {error}=await sb.from('teams').delete().eq('id',t.id);if(error){toast("Couldn't leave");return}}await loadMine();toast('You left the league');go('home')}
  else if(a==='do_delete'){await sb.from('teams').delete().eq('league_id',Z.L.id);const {error}=await sb.from('leagues').delete().eq('id',Z.L.id);if(error){toast("Couldn't delete the league");await loadLeague(Z.L.id);render();return}await loadMine();toast('League deleted');go('home')}
  }catch(err){console.error(err);toast('Something went wrong. Try again.')}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='cf')return;e.preventDefault();const i=$('#ci'),b=(i.value||'').trim();if(!b)return;i.value='';
  const {error}=await sb.from('chat_messages').insert({league_id:Z.L.id,display_name:teamName(Z.dn),body:b});if(error){toast("Couldn't send");return}await loadMsgs();render();setTimeout(()=>{const x=$('#ci');x&&x.focus()},0)});
setInterval(async()=>{if(Z.v==='league'&&Z.sub==='chat'&&!document.hidden&&!document.activeElement?.matches('input')){const n=Z.msgs.length;await loadMsgs();if(Z.msgs.length!==n)render()}},6000);

async function refreshRoom(force){
  if(!Z.room||!Z.L)return;const before=Z.room.current_pick_number+Z.room.status,wasLive=Z.room.status==='live';
  await loadRoom();
  if(Z.room.status==='complete'&&(Z.L.status!=='active'||wasLive)){await loadLeague(Z.L.id);await loadSeason();Z.tab='home';force=true}
  if(force||Z.room.current_pick_number+Z.room.status!==before)if(Z.v==='league'&&Z.sub==='room'){const s=$('#rs');const f=s&&document.activeElement===s;render();if(f){const n=$('#rs');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
}
let ticking=false,pz=0;
setInterval(async()=>{
  if(Z.v!=='league'||!Z.room||(Z.room.status!=='live'&&Z.room.status!=='paused')||document.hidden||ticking)return;
  if(Z.room.status==='paused'){ticking=true;try{pz=(pz+1)%5;if(!pz)await sb.rpc('cr_tick',{p_room:Z.room.id});await refreshRoom()}catch(e){console.error(e)}ticking=false;return}
  ticking=true;try{
    const dl=Z.room.current_pick_deadline?new Date(Z.room.current_pick_deadline).getTime():0;
    if(dl&&Date.now()>dl+600){await sb.rpc('cr_tick',{p_room:Z.room.id})}
    if(Z.sub==='room'||Z.sub==='draft'||Z.tab==='league')await refreshRoom();else await loadRoom();
  }catch(e){console.error(e)}ticking=false},1500);
setInterval(()=>{const c=$('#clk');if(!c||!Z.room||!Z.room.current_pick_deadline)return;const t=Math.max(0,Math.ceil((new Date(Z.room.current_pick_deadline)-Date.now())/1000));c.textContent=t}, 250);
document.addEventListener('input',e=>{if(e.target.id==='rs'){Z.rq=e.target.value;const l=$('#plist');if(l)l.innerHTML=poolRows()}});

/* ---------- start ---------- */
(async()=>{
  try{
    const user=await CombatAuth.getUser();
    const q=new URLSearchParams(location.search),jc=q.get('join');
    if(!user){Z.pendingJoin=jc;return go('signin')}
    Z.uid=user.id;
    const p=await CombatAuth.getProfile(user.id);
    Z.dn=(p&&p.display_name)||'';
    if(!Z.dn){Z.pendingJoin=jc;return go('name')}
    await loadMine();
    if(jc)return await lookupCode(jc);
    const oid=q.get('open');if(oid&&Z.leagues.some(l=>l.id===oid)){await openLeague(oid);history.replaceState(null,'','league.html');return}
    go('home');
  }catch(e){console.error(e);$('#app').innerHTML=`<div class="pad" style="padding-top:30vh;text-align:center"><div class="h" style="font-size:22px">Couldn't load your leagues</div><div class="mut" style="margin:8px 0 16px">Check your connection and try again.</div><button class="btn g" onclick="location.reload()">RETRY</button></div>`}
})();

</script>
</body></html>
